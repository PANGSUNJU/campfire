const Buddy = {
  x: 34, y: 140, place: 'camp', seated: true, name: '', tagY: 136,
  tag: null, bubble: null, label: null, bubbleUntil: 0, tagKey: '',
  blinkT: 3, blinkHold: 0, last: -1,

  init() {
    this.tag = document.createElement('div'); this.tag.className = 'tag';
    this.bubble = document.createElement('div'); this.bubble.className = 'bubble'; this.bubble.hidden = true;
    this.label = document.createElement('div'); this.label.className = 'name';
    this.tag.appendChild(this.bubble); this.tag.appendChild(this.label);
    this.tag.hidden = true;
    document.getElementById('tags').appendChild(this.tag);
  },

  hit(x, y) { return Math.abs(x - (this.x + 6)) < 11 && Math.abs(y - (this.y + 6)) < 11; },

  // 누르면 한마디(같은 말을 연달아 하지 않음)
  poke(time) {
    let i = (Math.random() * BUDDY_LINES.length) | 0;
    if (i === this.last) i = (i + 1) % BUDDY_LINES.length;
    this.last = i;
    this.bubble.textContent = BUDDY_LINES[i]; this.bubble.hidden = false;
    this.bubbleUntil = time + CONFIG.chatBubbleSeconds; this.tagKey = '';
  },

  update(dt) {
    if (this.blinkHold > 0) this.blinkHold -= dt;
    this.blinkT -= dt;
    if (this.blinkT <= 0) { this.blinkHold = 0.2; this.blinkT = rand(2.5, 6); }
  },

  draw(ctx, t) {
    const x = this.x, bob = Math.sin(t * TAU / 4.2) < 0 ? 1 : 0, y = this.y + bob;   // 숨쉬듯 1px
    // 돌로 눌러 둔 회의록 더미(뒤쪽)
    ctx.fillStyle = '#d8d2c0'; ctx.fillRect(x - 7, this.y + 9, 6, 3);
    ctx.fillStyle = '#9a9484'; ctx.fillRect(x - 7, this.y + 10, 6, 1);
    ctx.fillStyle = '#6a6a72'; ctx.fillRect(x - 5, this.y + 8, 2, 1);
    // 몸
    drawSprite(ctx, BUDDY_SPR, BUDDY_PAL, x, y, false);
    ctx.fillStyle = '#b85c26'; ctx.fillRect(x + 3, this.y + 11, 1, 1); ctx.fillRect(x + 8, this.y + 11, 1, 1);   // 발은 땅에 고정
    // 반쯤 감긴 눈
    ctx.fillStyle = '#2a1a22';
    if (this.blinkHold > 0) { ctx.fillRect(x + 5, y + 6, 1, 1); ctx.fillRect(x + 8, y + 6, 1, 1); }
    else { ctx.fillRect(x + 5, y + 5, 1, 2); ctx.fillRect(x + 8, y + 5, 1, 2); ctx.fillStyle = '#b85c26'; ctx.fillRect(x + 5, y + 4, 1, 1); ctx.fillRect(x + 8, y + 4, 1, 1); }
    // 안테나 끝의 별: 은은하게 반짝임
    const k = Math.sin(t * 1.7);
    ctx.fillStyle = '#fff2a8'; ctx.fillRect(x + 6, y, 1, 1);
    if (k > -0.2) { ctx.globalAlpha = 0.45 + 0.4 * k; ctx.fillRect(x + 5, y, 3, 1); ctx.fillRect(x + 6, y - 1, 1, 3); ctx.globalAlpha = 1; }
    // 작은 노트북(화면 빛이 얼굴 쪽으로)
    ctx.fillStyle = '#3a3e52'; ctx.fillRect(x + 12, this.y + 11, 5, 1);
    ctx.fillRect(x + 16, this.y + 7, 1, 4);
    ctx.fillStyle = ((t * 0.7) | 0) % 5 ? '#a8d4ff' : '#c8e4ff'; ctx.fillRect(x + 15, this.y + 7, 1, 4);
  },

  drawGlow(ctx) {
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#7ab4ff';
    ctx.globalAlpha = 0.07; fillEllipse(ctx, this.x + 13, this.y + 8, 9, 7);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  },
};

/* =====================================================================
 * AudioFx — Web Audio로 직접 만든 소리(음원 파일 없음). 기본은 꺼짐
 * ===================================================================== */
const AudioFx = {
  ctx: null, on: false, master: null, noise: null, cricket: null, tCrackle: 0, tChirp: 2,

  build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    const ac = this.ctx = new AC();
    this.master = ac.createGain(); this.master.gain.value = 0; this.master.connect(ac.destination);

    // 잡음 버퍼(장작 타닥 소리의 재료)
    const len = ac.sampleRate * 2;
    this.noise = ac.createBuffer(1, len, ac.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    // 낮게 깔리는 불 소리
    const src = ac.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
    const g = ac.createGain(); g.gain.value = 0.09;
    src.connect(lp); lp.connect(g); g.connect(this.master); src.start();

    // 풀벌레: 높은 음을 짧게 끊어 울림
    const osc = ac.createOscillator(); osc.type = 'sine'; osc.frequency.value = 4300;
    this.cricket = ac.createGain(); this.cricket.gain.value = 0;
    osc.connect(this.cricket); this.cricket.connect(this.master); osc.start();
    return true;
  },

  toggle() {
    if (!this.ctx && !this.build()) return false;
    this.on = !this.on;
    const now = this.ctx.currentTime;
    if (this.on) { this.ctx.resume(); this.master.gain.setTargetAtTime(CONFIG.volume, now, 0.4); }
    else this.master.gain.setTargetAtTime(0, now, 0.1);
    return this.on;
  },

  update(dt) {
    if (!this.on || !this.ctx) return;
    const ac = this.ctx, now = ac.currentTime;
    // 장작 타닥이는 소리: 불규칙한 짧은 잡음
    this.tCrackle -= dt;
    if (this.tCrackle <= 0) {
      this.tCrackle = rand(0.04, 0.5);
      const src = ac.createBufferSource(); src.buffer = this.noise; src.playbackRate.value = rand(0.6, 1.8);
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rand(900, 5000); bp.Q.value = 1.2;
      const g = ac.createGain(), v = Math.pow(Math.random(), 2) * 0.35 + 0.03;
      g.gain.setValueAtTime(v, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + rand(0.015, 0.07));
      src.connect(bp); bp.connect(g); g.connect(this.master);
      src.start(now, rand(0, 1.5), 0.1);
    }
    // 아주 작은 풀벌레 소리
    this.tChirp -= dt;
    if (this.tChirp <= 0) {
      this.tChirp = rand(1.2, 3.2);
      const g = this.cricket.gain, n = 3 + ((Math.random() * 2) | 0);
      let tt = now + 0.02;
      for (let i = 0; i < n; i++) {
        g.setValueAtTime(0, tt);
        g.linearRampToValueAtTime(0.012, tt + 0.012);
        g.linearRampToValueAtTime(0, tt + 0.045);
        tt += 0.07;
      }
    }
  },

  pause() { if (this.ctx && this.on) this.ctx.suspend(); },
  resume() { if (this.ctx && this.on) this.ctx.resume(); },
};

/* =====================================================================
 * Net — 여러 명이 함께 보기(Supabase Realtime). 주소가 없거나 연결이 안 되면 혼자 보기로 동작
 *   · 접속자 목록(presence): 이름, 옷 색, 앉은 자리
 *   · 동작·채팅(broadcast): 저장하지 않고 그 순간에만 전달
 *   · 불 위 자리(fire_slots 테이블): 먼저 올린/집은 한 명만 성공
 * ===================================================================== */
const ACT_KINDS = { tea: null, notYet: null, putPotato: 'potato', eatPotato: 'potato', plantMarsh: 'marsh', plantFish: 'marsh', eatMarsh: 'marsh', go: null, fish: null };

const Net = {
  sb: null, ch: null, online: false, joined: false,
  id: '', seat: 0, joinedAt: 0, others: new Map(),

  init() {
    this.id = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    const lib = window.supabase;
    if (!CONFIG.supabaseUrl || !CONFIG.supabaseKey || !lib || !lib.createClient) return;
    try { this.sb = lib.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth: { persistSession: false } }); }
    catch (e) { this.sb = null; }
  },

  // 시작하기를 누르면 방에 들어감
  join() {
    if (!this.sb || this.joined) return;
    this.joined = true; this.joinedAt = Date.now(); this.seat = null;
    UI.setStatus('연결하는 중…');
    const ch = this.ch = this.sb.channel(CONFIG.room, { config: { presence: { key: this.id }, broadcast: { self: false } } });
    ch.on('presence', { event: 'sync' }, () => this.onSync());
    ch.on('broadcast', { event: 'act' }, m => this.onAct(m.payload));
    ch.on('broadcast', { event: 'chat' }, m => this.onChat(m.payload));
    ch.on('broadcast', { event: 'fx' }, m => this.onFx(m.payload));
    ch.on('postgres_changes', { event: '*', schema: 'public', table: 'fire_slots' }, p => this.onRow(p));
    ch.subscribe(status => {
      if (status === 'SUBSCRIBED') { this.online = true; this.track(); this.syncClock(); this.fetchRows(); }
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        this.online = false;
        UI.setStatus('연결이 끊겼어요. 혼자 보는 중');
        UI.showChat(false);
        if (!UI.logEl.hidden) UI.toggleLog();
      }
    });
  },

  track() {
    if (!this.ch) return;
    this.ch.track({ name: Me.name, hat: Setup.sel.hat, coat: Setup.sel.coat, pants: Setup.sel.pants, seat: this.seat, place: Me.place, t: this.joinedAt });
  },

  // 서버 시각과 내 기기 시각의 차이를 구함
  syncClock() {
    const t0 = Date.now();
    this.sb.rpc('server_now').then(r => {
      const t1 = Date.now(), srv = r && r.data ? Date.parse(r.data) : NaN;
      if (!isNaN(srv)) Clock.offset = srv + (t1 - t0) / 2 - t1;
    }, () => {});
  },

  // 지금 불 위에 있는 것을 한 번에 읽어 옴
  fetchRows() {
    this.sb.from('fire_slots').select('*').then(r => {
      if (!r || r.error || !r.data) return;
      const seen = {};
      for (const row of r.data) {
        const at = Date.parse(row.placed_at);
        if (!Items.slot(row.kind, row.slot) || isNaN(at)) continue;
        // 너무 오래 방치된 것은 치움
        if (Clock.now() - at > CONFIG.staleMinutes * 60000) { this.sb.from('fire_slots').delete().eq('kind', row.kind).eq('slot', row.slot).then(() => {}, () => {}); continue; }
        seen[row.kind + row.slot] = true;
        Items.setRow(row.kind, row.slot, at, 0, row.item);
      }
      for (const kind of ['potato', 'marsh']) Items.slots[kind].forEach((s, i) => { if (s.at !== null && !s.hide && !seen[kind + i]) Items.removeRow(kind, i); });
    }, () => {});
  },

  // 접속자 목록이 바뀔 때: 내 자리를 정하고, 다른 사람 캐릭터를 만들거나 지움
  onSync() {
    const st = this.ch.presenceState(), list = [];
    for (const key of Object.keys(st)) { const p = st[key] && st[key][0]; if (p && key !== this.id) list.push(Object.assign({ id: key }, p)); }
    const valid = s => Number.isInteger(s) && s >= 0 && s < SEATS.length;

    // 내 자리: 비어 있는 가장 앞자리. 겹치면 먼저 온 사람이 앉고 나는 다시 고름
    const taken = new Set(list.filter(o => valid(o.seat)).map(o => o.seat));
    const lose = this.seat !== null && list.some(o => o.seat === this.seat && (o.t < this.joinedAt || (o.t === this.joinedAt && o.id < this.id)));
    if (this.seat === null || lose) {
      let free = null;
      for (let i = 0; i < SEATS.length; i++) if (!taken.has(i)) { free = i; break; }
      if (free !== this.seat) { this.seat = free; this.track(); }
    }
    if (Me.seat !== this.seat) Me.setSeat(this.seat);

    // 다른 사람들
    const alive = new Set();
    for (const o of list) {
      if (!valid(o.seat)) continue;
      alive.add(o.id);
      let a = this.others.get(o.id);
      if (!a) { a = new Actor(false); a.id = o.id; this.others.set(o.id, a); a.seat = -1; }
      const col = (v, d) => (typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v)) ? v : d;
      a.setOutfit({ hat: col(o.hat, DEFAULT_OUTFIT.hat), coat: col(o.coat, DEFAULT_OUTFIT.coat), pants: col(o.pants, DEFAULT_OUTFIT.pants) });
      const name = String(o.name == null ? '' : o.name).slice(0, CONFIG.nameMaxLength);
      if (a.name !== name) a.setName(name);
      if (a.seat !== o.seat) a.setSeat(o.seat);
      const place = o.place === 'lake' ? 'lake' : 'camp';
      if (!a.script && a.place !== place) a.setPlace(place);   // 걸어가는 중이 아니면 위치를 바로 맞춤
    }
    for (const [id, a] of this.others) if (!alive.has(id)) { a.remove(); this.others.delete(id); }

    const n = alive.size + (Me.seated ? 1 : 0);
    UI.setStatus(Me.seated ? '함께 불멍 중 ' + n + '명' : '자리가 꽉 찼어요(' + SEATS.length + '명). 구경하는 중');
    UI.showChat(Me.seated);
  },

  // 테이블이 바뀔 때(누가 올리거나 가져감)
  onRow(p) {
    if (!p) return;
    if (p.eventType === 'DELETE') { const r = p.old || {}; Items.removeRow(r.kind, r.slot); return; }
    const r = p.new || {}, at = Date.parse(r.placed_at);
    if (!isNaN(at)) Items.setRow(r.kind, r.slot, at, 800, r.item);
  },

  // 다른 사람의 동작
  onAct(p) {
    if (!p || !(p.kind in ACT_KINDS)) return;
    const item = ACT_KINDS[p.kind];
    if (item && !Items.slot(item, p.slot)) return;
    if (p.kind === 'go' && p.slot !== 'camp' && p.slot !== 'lake') return;
    if (p.kind === 'fish' && !(Number.isInteger(p.slot) && p.slot > 0 && p.slot <= 600)) return;
    const a = this.others.get(p.id);
    if (item) { if (p.kind.indexOf('eat') === 0) Items.claim(item, p.slot); else if (a) Items.hide(item, p.slot); }
    if (a && a.seated) a.perform(p.kind, p.slot);
  },

  onChat(p) {
    if (!p || typeof p.text !== 'string') return;
    const a = this.others.get(p.id);
    if (!a) return;
    a.say(p.text.slice(0, CONFIG.chatMaxLength), Scene.time);
    UI.addLog(a.name, p.text);
  },

  // 자리에 올리기. 성공하면 true(같은 자리에 다른 사람이 먼저 올렸으면 false)
  place(kind, i, item) {
    Items.hide(kind, i);
    if (!this.online) { Items.setRow(kind, i, Clock.now(), 0, item); return Promise.resolve(true); }
    const row = { kind, slot: i, placed_by: Me.name };
    if (item === 'fish') row.item = 'fish';   // 마시멜로는 기본값이라 따로 보내지 않음
    return this.sb.from('fire_slots').insert(row).then(r => {
      if (r && r.error) {
        Items.land(kind, i);
        // 자리가 겹친 게 아니라면 서버 테이블에 item 칸이 아직 없는 경우
        if (item === 'fish' && r.error.code !== '23505') UI.flash('물고기를 올리지 못했어요. 서버 SQL(item 칸 추가)을 확인해 주세요');
        return false;
      }
      Items.setRow(kind, i, Clock.now(), 0, item);
      return true;
    }, () => { Items.land(kind, i); return false; });
  },

  // 자리에서 가져가기. 성공하면 true(다른 사람이 먼저 집었으면 false)
  take(kind, i) {
    const done = () => { Items.claim(kind, i); Items.removeRow(kind, i); return true; };
    if (!this.online) return Promise.resolve(done());
    return this.sb.from('fire_slots').delete().eq('kind', kind).eq('slot', i).select().then(r => {
      if (!r || r.error || !r.data || r.data.length !== 1) return false;
      return done();
    }, () => false);
  },

  // 누가 상인에게서 산 구경거리
  onFx(p) {
    const item = p && SHOP.find(v => v.kind === p.kind); if (!item) return;
    Sky.play(item.kind);
    const a = this.others.get(p.id);
    UI.flash((a && a.name ? a.name + ' 님이 ' : '누군가 ') + item.obj + ' 하늘에 띄웠어요');
  },
  fx(kind) { if (this.online) this.ch.send({ type: 'broadcast', event: 'fx', payload: { id: this.id, kind } }); },

  act(kind, slot) { if (this.online) this.ch.send({ type: 'broadcast', event: 'act', payload: { id: this.id, kind, slot: slot === undefined ? null : slot } }); },
  chat(text) { if (this.online) this.ch.send({ type: 'broadcast', event: 'chat', payload: { id: this.id, text } }); },
};

    '....SS......',
    '.....S......',
    '............', '............'] },
};

const UI = {
  btnPotato: null, btnMarsh: null, btnTea: null, btnSound: null, last: '',
  status: null, chatRow: null, chatInput: null, lastChat: 0,
  logEl: null, logBtn: null, log: [],
  btnFish: null, btnBack: null, badge: null, fishCount: null, fish: 0,
  btnGrill: null, grillCount: null, statusText: '', flashUntil: 0,
  shop: null, shopFish: null, shopBtns: [],

  icon(btn, ic) {
    const cv = btn.querySelector('canvas'), g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, cv.height);
    drawSprite(g, ic.rows, ic.pal, 0, 0, false);
  },

  init() {
    this.btnPotato = document.getElementById('btnPotato');
    this.btnMarsh = document.getElementById('btnMarsh');
    this.btnTea = document.getElementById('btnTea');
    this.btnSound = document.getElementById('sound');
    this.status = document.getElementById('status');
    this.chatRow = document.getElementById('chatRow');
    this.chatInput = document.getElementById('chatInput');
    this.chatInput.maxLength = CONFIG.chatMaxLength;
    this.icon(this.btnPotato, ICONS.potato);
    this.icon(this.btnMarsh, ICONS.marsh);
    this.icon(this.btnTea, ICONS.tea);
    this.icon(this.btnSound, ICONS.soundOff);
    this.btnFish = document.getElementById('btnFish');
    this.btnBack = document.getElementById('btnBack');
    this.badge = document.getElementById('fishBadge');
    this.fishCount = document.getElementById('fishCount');
    this.icon(this.btnFish, ICONS.rod);
    this.icon(this.btnBack, ICONS.fire);
    this.icon(this.badge, ICONS.fish);
    this.btnGrill = document.getElementById('btnGrill');
    this.grillCount = document.getElementById('grillCount');
    this.icon(this.btnGrill, ICONS.fish);
    this.btnGrill.addEventListener('click', () => { if (this.fish > 0) this.place('marsh', 'plantFish', 'fish'); });
    // 들고 있는 물고기 수는 이 탭에서만 기억(새로고침은 유지, 탭을 닫으면 0)
    try { const n = parseInt(sessionStorage.getItem('campfire-fish') || '0', 10); if (n > 0) this.fish = Math.min(CONFIG.fishMax, n); } catch (e) { /* 무시 */ }
    this.btnFish.addEventListener('click', () => {
      if (!this.canAct() || Me.place !== 'lake' || this.fish >= CONFIG.fishMax) return;
      const wait = Math.round(rand(CONFIG.fishWait[0], CONFIG.fishWait[1]) * 10);   // 0.1초 단위로 맞춰 다른 화면에서도 같은 때에 잡힘
      Net.act('fish', wait); Me.goFishing(wait / 10); this.refresh();
    });
    this.btnBack.addEventListener('click', () => this.travel('camp'));
    // 상인 가게
    this.shop = document.getElementById('shop');
    this.shopFish = document.getElementById('shopFish');
    const box = document.getElementById('shopItems');
    for (const it of SHOP) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'px shopItem';
      const name = document.createElement('b'); name.textContent = it.name + ' · 물고기 ' + CONFIG.merchantPrices[it.kind] + '마리';
      const desc = document.createElement('small'); desc.textContent = it.desc;
      b.appendChild(name); b.appendChild(desc);
      b.addEventListener('click', () => this.buy(it.kind));
      box.appendChild(b);
      this.shopBtns.push({ b, kind: it.kind });
    }
    document.getElementById('shopClose').addEventListener('click', () => this.closeShop());

    this.btnPotato.addEventListener('click', () => this.place('potato', 'putPotato'));
    this.btnMarsh.addEventListener('click', () => this.place('marsh', 'plantMarsh'));
    this.btnTea.addEventListener('click', () => { if (this.canAct()) { Net.act('tea'); Me.drinkTea(); } this.refresh(); });
    this.btnSound.addEventListener('click', () => {
      const on = AudioFx.toggle();
      this.icon(this.btnSound, on ? ICONS.soundOn : ICONS.soundOff);
      this.btnSound.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    this.logEl = document.getElementById('chatLog');
    this.logBtn = document.getElementById('chatLogBtn');
    this.logBtn.addEventListener('click', () => this.toggleLog());
    // 이 탭에서 주고받은 대화만 임시로 들고 있음(새로고침해도 남고, 탭을 닫으면 사라짐)
    try { const saved = JSON.parse(sessionStorage.getItem('campfire-chat') || '[]'); if (Array.isArray(saved)) this.log = saved.slice(-CONFIG.chatLogMax); } catch (e) { /* 무시 */ }
    document.getElementById('chatSend').addEventListener('click', () => this.sendChat());
    this.chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') this.sendChat(); });
  },

  canAct() { return Setup.started && Me.seated && !Me.busy && !Me.waiting; },
  // 이동은 낚시하며 기다리는 중에도 할 수 있음(낚시를 접고 일어남)
  canGo() { return Setup.started && Me.seated && !Me.waiting && (!Me.busy || Me.state === 'fish'); },
  travel(dest) {
    if (!this.canGo() || Me.place === dest) return;
    Net.act('go', dest); Me.goTo(dest); this.refresh();
  },
  // ── 상인 가게: 물고기를 내고 하늘 구경거리를 삼 ──
  openShop() {
    if (!this.canAct() || Scene.place !== 'camp' || !Merchant.present()) return;
    this.shop.hidden = false; this.renderShop();
  },
  closeShop() { if (this.shop && !this.shop.hidden) this.shop.hidden = true; },
  renderShop() {
    this.shopFish.textContent = this.fish > 0 ? '가진 물고기 ' + this.fish + '마리' : '물고기가 없어요. 호수에서 낚아 오세요.';
    for (const s of this.shopBtns) s.b.disabled = this.fish < CONFIG.merchantPrices[s.kind];
  },
  buy(kind) {
    const price = CONFIG.merchantPrices[kind];
    if (!(price > 0) || this.fish < price || !Merchant.present()) return;
    this.setFish(this.fish - price);
    Sky.play(kind); Net.fx(kind);
    this.closeShop();
  },

  addFish() { this.setFish(this.fish + 1); },
  setFish(n) {
    this.fish = Math.max(0, Math.min(CONFIG.fishMax, n));
    try { sessionStorage.setItem('campfire-fish', String(this.fish)); } catch (e) { /* 무시 */ }
    this.refresh();
  },

  // 고구마·마시멜로 올리기: 자리를 먼저 차지한 뒤(서버 확인) 동작을 시작
  place(kind, act, item) {
    const i = Items.free(kind);
    if (!this.canAct() || i < 0 || Scene.place !== 'camp') return;
    Me.waiting = true; this.refresh();
    Net.place(kind, i, item).then(ok => {
      Me.waiting = false;
      if (ok) {
        if (item === 'fish') this.setFish(this.fish - 1);   // 들고 있던 물고기 한 마리를 씀
        Net.act(act, i); Me.perform(act, i);
      }
      this.refresh();
    });
  },

  // 꽂힌 마시멜로·익은 고구마 집기: 먼저 집은 한 명만 성공
  take(kind, act, i) {
    if (!this.canAct()) return;
    Me.waiting = true; this.refresh();
    Net.take(kind, i).then(ok => {
      Me.waiting = false;
      if (ok) { Net.act(act, i); Me.perform(act, i); }
      this.refresh();
    });
  },

  sendChat() {
    const text = this.chatInput.value.trim().slice(0, CONFIG.chatMaxLength), now = Date.now();
    if (!text || !Me.seated || now - this.lastChat < 1000) return;   // 도배 방지: 1초에 한 번
    this.lastChat = now;
    this.chatInput.value = '';
    Me.say(text, Scene.time);
    this.addLog(Me.name, text);
    Net.chat(text);
  },

  // ── 대화 기록 ──
  addLog(name, text) {
    const d = new Date(), two = n => (n < 10 ? '0' : '') + n;
    const item = { n: String(name || '').slice(0, CONFIG.nameMaxLength), t: String(text).slice(0, CONFIG.chatMaxLength), h: two(d.getHours()) + ':' + two(d.getMinutes()) };
    this.log.push(item);
    if (this.log.length > CONFIG.chatLogMax) this.log.shift();
    try { sessionStorage.setItem('campfire-chat', JSON.stringify(this.log)); } catch (e) { /* 무시 */ }
    if (!this.logEl.hidden) this.renderLog();
  },
  logLine(item) {
    const row = document.createElement('div');
    const when = document.createElement('span'); when.className = 'when'; when.textContent = item.h;
    const who = document.createElement('span'); who.className = 'who'; who.textContent = (item.n || '이름 없음') + ' ';
    const what = document.createElement('span'); what.textContent = item.t;   // textContent라 입력한 글자가 그대로만 보임
    row.appendChild(when); row.appendChild(who); row.appendChild(what);
    return row;
  },
  renderLog() {
    this.logEl.textContent = '';
    while (this.logEl.firstChild) this.logEl.removeChild(this.logEl.firstChild);
    if (!this.log.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = '아직 나눈 대화가 없어요.'; this.logEl.appendChild(e); }
    for (const item of this.log) this.logEl.appendChild(this.logLine(item));
    this.logEl.scrollTop = this.logEl.scrollHeight;   // 가장 최근 대화가 보이게
  },
  toggleLog() {
    const open = this.logEl.hidden;
    this.logEl.hidden = !open;
    this.logBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) this.renderLog();
  },

  setStatus(text) { this.statusText = text; if (!this.flashUntil && this.status.textContent !== text) this.status.textContent = text; },
  // 잠깐 보여 주는 안내(몇 초 뒤 원래 상태 글자로 돌아감)
  flash(text) { this.flashUntil = Date.now() + 6000; this.status.textContent = text; },
  showChat(show) {
    show = show && Setup.started;
    if (this.chatRow.hidden === !show) return;
    this.chatRow.hidden = !show;
    Scene.layout();
  },

  // 동작 중이거나 자리가 꽉 차면 버튼을 흐리게 하고 못 누르게 함
  refresh() {
    const b = !this.canAct(), dp = b || Items.free('potato') < 0, dm = b || Items.free('marsh') < 0;
    if (this.flashUntil && Date.now() > this.flashUntil) { this.flashUntil = 0; this.status.textContent = this.statusText; }
    const lake = Scene.place === 'lake', df = b || this.fish >= CONFIG.fishMax, dg = !this.canGo();
    const key = (dp ? 1 : 0) + '' + (dm ? 1 : 0) + (b ? 1 : 0) + (df ? 1 : 0) + (dg ? 1 : 0) + (lake ? 'L' : 'C') + this.fish;
    if (key === this.last) return;
    this.last = key;
    this.btnPotato.disabled = dp; this.btnMarsh.disabled = dm; this.btnTea.disabled = b;
    this.btnFish.disabled = df; this.btnBack.disabled = dg;
    // 있는 곳에 따라 버튼을 바꿔 보여 줌
    const swap = this.btnFish.hidden === lake;
    this.btnPotato.hidden = this.btnMarsh.hidden = this.btnTea.hidden = lake;
    this.btnFish.hidden = this.btnBack.hidden = !lake;
    // 물고기: 호수에서는 개수만, 모닥불에서는 굽기 버튼(꼬챙이 자리가 차면 꺼짐)
    this.badge.hidden = !lake || this.fish <= 0;
    this.fishCount.textContent = '×' + this.fish;
    this.btnGrill.hidden = lake || this.fish <= 0;
    this.btnGrill.disabled = dm;
    this.grillCount.textContent = '물고기 ×' + this.fish;
    if (swap) Scene.layout();
  },
};

/* =====================================================================
 * Setup — 첫 진입 설정 창(이름, 모자·옷·바지 색) → 시작하기
 * ===================================================================== */
const Setup = {
  el: null, input: null, preview: null, started: false,
  sel: Object.assign({}, DEFAULT_OUTFIT),
  groups: {},

  apply() { Me.setOutfit(this.sel); this.drawPreview(); },

  drawPreview() {
    const g = this.preview.getContext('2d'), pal = Me.pal;
    g.clearRect(0, 0, 16, 24);
    drawSprite(g, SIT_TORSO, pal, 0, 10, false);
    drawSprite(g, SIT_LEGS, pal, 0, 17, false);
    drawSprite(g, HEAD, pal, 0, 0, false);
    g.fillStyle = pal.E; g.fillRect(10, 6, 1, 2);
    for (const p of ARMS.rest.px) { g.fillStyle = pal[p[2]]; g.fillRect(p[0], p[1], 1, 1); }
  },

  // 색 고르기 버튼 한 줄 만들기
  buildSwatches(part, boxId, label) {
    const box = document.getElementById(boxId);
    this.groups[part] = [];
    for (const [col, name] of CONFIG.outfitColors[part]) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'sw'; b.style.background = col;
      b.setAttribute('aria-label', label + ' ' + name);
      b.addEventListener('click', () => this.pick(part, col));
      box.appendChild(b);
      this.groups[part].push({ b, col });
    }
  },

  pick(part, col) {
    this.sel[part] = col;
    for (const g of this.groups[part]) g.b.setAttribute('aria-pressed', g.col === col ? 'true' : 'false');
    this.apply();
  },

  init() {
    this.el = document.getElementById('setup');
    this.input = document.getElementById('nameInput');
    this.preview = document.getElementById('preview');
    this.input.maxLength = CONFIG.nameMaxLength;

    // 지난번에 고른 값이 있으면 미리 채워 둠(저장이 막힌 환경에서는 그냥 기본값)
    try {
      const saved = JSON.parse(localStorage.getItem('campfire-outfit') || 'null');
      if (saved) {
        if (typeof saved.name === 'string') this.input.value = saved.name.slice(0, CONFIG.nameMaxLength);
        for (const part of ['hat', 'coat', 'pants']) {
          if (CONFIG.outfitColors[part].some(c => c[0] === saved[part])) this.sel[part] = saved[part];
        }
      }
    } catch (e) { /* 저장소를 못 쓰면 무시 */ }

    this.buildSwatches('hat', 'swHat', '모자');
    this.buildSwatches('coat', 'swCoat', '옷');
    this.buildSwatches('pants', 'swPants', '바지');
    for (const part of ['hat', 'coat', 'pants']) this.pick(part, this.sel[part]);

    document.getElementById('btnStart').addEventListener('click', () => this.start());
    this.input.addEventListener('keydown', e => { if (e.key === 'Enter') this.start(); });
  },

  // 시작하기: 설정 창을 닫고 버튼과 이름표를 보여 준 뒤 방에 들어감
  start() {
    if (this.started) return;
    const name = this.input.value.trim().slice(0, CONFIG.nameMaxLength);
    try { localStorage.setItem('campfire-outfit', JSON.stringify({ name, hat: this.sel.hat, coat: this.sel.coat, pants: this.sel.pants })); } catch (e) { /* 무시 */ }
    this.started = true;
    this.el.hidden = true;
    Me.setName(name);
    Scene.bar.style.visibility = 'visible';
    Net.join();
    UI.refresh();
    Scene.placeTags();
  },
};

/* =====================================================================
 * Scene — 전체 흐름: 화면 크기 계산, 업데이트, 그리기, 메인 루프
 * ===================================================================== */
let Me = null;   // 내 캐릭터

const Scene = {
  view: null, vctx: null, buf: null, ctx: null, bar: null,
  time: 0, last: 0, running: false, raf: 0,
  k: 1, left: 0, top: 0,
  place: 'camp', fade: 0,   // 지금 보고 있는 곳, 화면 전환 때 어두워지는 정도(0~1)

  init() {
    this.view = document.getElementById('view');
    this.vctx = this.view.getContext('2d');
    this.bar = document.getElementById('bar');
    this.buf = makeCanvas(W, H);                 // 작은 내부 캔버스
    this.ctx = this.buf.getContext('2d');

    // 움직임 줄이기 설정 따라가기
    if (window.matchMedia) {
      const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      Motion.reduced = mq.matches;
      const onChange = e => { Motion.reduced = e.matches; };
      if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
    }

    Sky.init(); Forest.init(); Campfire.init(); Lake.init(); Items.init();
    Me = new Actor(true);
    Net.init(); UI.init(); Setup.init(); Merchant.init(); Buddy.init();

    window.addEventListener('resize', () => this.layout());
    window.addEventListener('orientationchange', () => this.layout());
    this.layout();

    // 꽂힌 마시멜로, 고구마 누르기
    this.view.addEventListener('pointerdown', e => {
      // 표지판: 모닥불 ↔ 호수
      if (this.signAt(e)) { UI.travel(this.place === 'camp' ? 'lake' : 'camp'); return; }
      if (this.place === 'camp' && this.fade === 0 && Merchant.hit(...this.toScene(e))) { UI.openShop(); return; }
      if (this.place === 'camp' && this.fade === 0 && Setup.started && Buddy.hit(...this.toScene(e))) { Buddy.poke(this.time); return; }
      const hit = this.pick(e);
      if (!hit || !UI.canAct()) return;
      if (hit.type === 'marsh') UI.take('marsh', 'eatMarsh', hit.index);
      else if (hit.type === 'potato') UI.take('potato', 'eatPotato', hit.index);
      else { Net.act('notYet'); Me.notYet(); }
      UI.refresh();
    });
    this.view.addEventListener('pointermove', e => {
      const shop = this.place === 'camp' && ((UI.canAct() && Merchant.hit(...this.toScene(e))) || Buddy.hit(...this.toScene(e)));
      this.view.style.cursor = (shop || (UI.canGo() && this.signAt(e)) || (UI.canAct() && this.pick(e))) ? 'pointer' : 'default';
    });

    // 탭이 숨겨지면 애니메이션을 멈추고, 돌아오면 다시 시작
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.stop(); else this.start(); });

    // 처음부터 불이 타고 있도록 미리 조금 돌려 둠
    for (let i = 0; i < 90; i++) { this.time += 1 / 30; Campfire.update(1 / 30, this.time); }
    this.start();
  },

  // 화면 좌표 → 내부 해상도 좌표로 바꿔 아이템 찾기
  pick(e) {
    if (this.place !== 'camp') return null;   // 굽는 것은 모닥불에서만
    const r = this.view.getBoundingClientRect();
    return Items.hitTest((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
  },

  toScene(e) { const r = this.view.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; },
  signAt(e) {
    const r = this.view.getBoundingClientRect();
    return this.fade === 0 && Lake.signHit(this.place, (e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
  },

  // 창 크기에 맞춰 정수 배율과 위치를 다시 계산(장면이 잘리지 않게, 가운데 정렬)
  layout() {
    const dpr = window.devicePixelRatio || 1, vw = window.innerWidth, vh = window.innerHeight;
    const barH = this.bar.offsetHeight + 16;
    // 가로·세로에 다 들어가고, 버튼이 캐릭터와 모닥불(내부 y 160 위쪽)을 가리지 않는 가장 큰 정수 배율
    let s = Math.floor(Math.min(vw * dpr / W, vh * dpr / H, (vh - barH) * dpr / 160));
    s = Math.max(1, s);
    if (this.view.width !== W * s) { this.view.width = W * s; this.view.height = H * s; }
    const cw = W * s / dpr, ch = H * s / dpr;
    const left = (vw - cw) / 2;
    const top = Math.max(0, Math.min((vh - ch) / 2, vh - barH - 160 * s / dpr));
    this.view.style.width = cw + 'px'; this.view.style.height = ch + 'px';
    this.view.style.left = left + 'px'; this.view.style.top = top + 'px';
    // 버튼 줄: 장면 바로 아래, 화면 밖으로는 나가지 않게
    this.bar.style.top = Math.min(vh - barH + 8, top + ch + 8) + 'px';
    this.vctx.imageSmoothingEnabled = false;
    this.k = s / dpr; this.left = left; this.top = top;
    this.eachActor(a => { a.tagKey = ''; });
    if (Merchant.npc) Merchant.npc.tagKey = '';
    Buddy.tagKey = '';
    if (!this.running) this.draw();
  },

  eachActor(fn) { for (const a of Net.others.values()) fn(a); if (Me) fn(Me); },

  // 이름표와 말풍선을 캐릭터 머리 위에 붙여 둠(바뀔 때만 DOM을 건드림)
  placeTags() {
    const all = [];
    this.eachActor(a => all.push(a));
    if (Merchant.npc) all.push(Merchant.npc);
    if (Buddy.tag) all.push(Buddy);
    for (const a of all) {
      if (!a.bubble.hidden && this.time >= a.bubbleUntil) { a.bubble.hidden = true; a.tagKey = ''; }
      const here = a === Merchant.npc ? Merchant.state !== 'away' : a.seated;
      const show = Setup.started && here && a.place === this.place && this.fade < 0.5 && (a.name !== '' || !a.bubble.hidden);
      const x = Math.round(this.left + (Math.round(a.x) + 7.5) * this.k);
      const y = Math.round(this.top + (a.tagY || CHAR_Y - 5) * this.k);
      const key = show ? x + ',' + y : 'off';
      if (key === a.tagKey) continue;
      a.tagKey = key;
      a.tag.hidden = !show;
      if (show) { a.tag.style.left = x + 'px'; a.tag.style.top = y + 'px'; }
    }
  },

  start() {
    if (this.running) return;
    this.running = true;
    this.last = performance.now();
    AudioFx.resume();
    this.raf = requestAnimationFrame(now => this.frame(now));
  },
  stop() {
    this.running = false;
    cancelAnimationFrame(this.raf);
    AudioFx.pause();
  },

  frame(now) {
    if (!this.running) return;
    // delta time 기반: 주사율이 달라도 속도가 같음(너무 큰 간격은 잘라 냄)
    const dt = Math.min(0.1, Math.max(0, (now - this.last) / 1000));
    this.last = now;
    this.update(dt);
    this.draw();
    this.raf = requestAnimationFrame(n => this.frame(n));
  },

  update(dt) {
    this.time += dt;
    const t = this.time;
    Sky.update(dt);
    Campfire.update(dt, t);
    Items.update(dt);
    this.eachActor(a => a.update(dt, t));
    Merchant.update(dt);
    Buddy.update(dt);
    AudioFx.update(dt);
    UI.refresh();
  },

  // 뒤에서 앞 순서로 그리기
  draw() {
    const ctx = this.ctx, t = this.time;
    const here = fn => this.eachActor(a => { if (a.place === this.place) fn(a); });   // 같은 곳에 있는 캐릭터만
    Sky.draw(ctx, t);                       // 1. 밤하늘
    if (this.place === 'lake') {
      Lake.draw(ctx, t);                    // 호수: 달, 건너편 숲, 물결, 낚시터
      here(a => a.drawLog(ctx));
      here(a => a.draw(ctx, t));
      Forest.drawFlies(ctx, t);
    } else {
      Forest.drawFar(ctx);                    // 2. 먼 숲
      Forest.drawNear(ctx, Campfire.flick);   // 3. 가까운 숲과 땅(불빛 범위만 따뜻하게)
      Lake.drawSign(ctx, 'camp');             //    호수로 가는 표지판
      Buddy.draw(ctx, t);                     //    구석의 깨알 손님
      here(a => a.drawLog(ctx));              // 5. 통나무 의자
      Campfire.drawBack(ctx, t);              // 4. 모닥불
      Campfire.drawFlames(ctx);
      Items.drawPotatoes(ctx, t);
      Campfire.drawFront(ctx);
      Items.drawSkewers(ctx);
      Merchant.draw(ctx, t);                  //    떠돌이 상인
      here(a => a.draw(ctx, t));              // 5. 캐릭터(내 캐릭터가 맨 앞)
      Items.drawFly(ctx, t);
      Campfire.drawParticles(ctx);            //    불티, 연기, 김
      Forest.drawFlies(ctx, t);               // 6. 반딧불이
      Campfire.drawGlow(ctx);                 //    따뜻한 빛 번짐
      Merchant.drawGlow(ctx, t);
      Buddy.drawGlow(ctx);
    }
    if (this.fade > 0) { ctx.globalAlpha = this.fade; ctx.fillStyle = '#05071a'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }

    // 작은 캔버스를 큰 캔버스로 정수 배율 확대
    this.vctx.imageSmoothingEnabled = false;
    this.vctx.drawImage(this.buf, 0, 0, this.view.width, this.view.height);
    this.placeTags();
  },
};

Scene.init();
</script>
</body>
</html>
