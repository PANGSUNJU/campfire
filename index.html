<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모닥불 멍</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05071a; }
  body { position: fixed; inset: 0; touch-action: manipulation; -webkit-user-select: none; user-select: none;
         -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  /* 확대해서 보여 주는 큰 캔버스: 픽셀이 뭉개지지 않게 */
  #view { position: absolute; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
  /* 하단 버튼 줄 */
  #bar { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; width: max-content; max-width: calc(100vw - 8px); }
  .btns { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; }
  /* 채팅 입력 줄(함께 보기일 때만 보임) */
  #chatRow { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  #chatRow[hidden] { display: none; }
  #chatInput { box-sizing: border-box; width: 200px; margin: 3px; padding: 8px; border: 0; border-radius: 0; background: #0e0d22; color: #f4e6c8;
               font: 16px/1.2 inherit; font-family: inherit; box-shadow: 0 0 0 2px #3b3364; }
  #chatInput:focus { outline: 2px solid #ffd84a; }
  #chatSend { padding: 6px 12px; }
  /* 대화 기록 창(이 탭을 닫으면 사라짐) */
  #chatLog { position: absolute; left: 14px; top: 38px; z-index: 3; box-sizing: border-box; width: min(250px, 72vw); max-height: 42vh; overflow-y: auto;
             padding: 8px 10px; background: rgba(29, 27, 56, .92); color: #f4e6c8; font: 13px/1.45 inherit; font-family: inherit; word-break: break-all;
             box-shadow: 0 -3px 0 #7c70b0, -3px 0 0 #7c70b0, 3px 0 0 #3b3364, 0 3px 0 #3b3364; }
  #chatLog[hidden] { display: none; }
  #chatLog .who { color: #ffd84a; font-weight: bold; }
  #chatLog .when { color: #9a90b8; font-size: 11px; margin-right: 5px; }
  #chatLog .empty { color: #9a90b8; }
  #chatLogBtn { padding: 6px 12px; }
  #status { position: absolute; top: 14px; left: 14px; color: #c8c0e0; font: 12px/1.2 inherit; font-family: inherit; text-shadow: 1px 1px 0 #05071a; pointer-events: none; }
  .px { display: flex; align-items: center; gap: 6px; min-height: 44px; margin: 3px; padding: 6px 12px 6px 8px;
        border: 0; border-radius: 0; background: #1d1b38; color: #f4e6c8; font: bold 14px/1 inherit; font-family: inherit;
        cursor: pointer; transition: opacity .35s;
        /* 도트 테두리: 모서리가 한 칸 비는 픽셀 테두리 */
        box-shadow: 0 -3px 0 #7c70b0, -3px 0 0 #7c70b0, 3px 0 0 #3b3364, 0 3px 0 #3b3364; }
  .px canvas { width: 28px; height: 28px; image-rendering: crisp-edges; image-rendering: pixelated; }
  .px:active:not(:disabled) { transform: translateY(2px); }
  .px:disabled { opacity: .4; cursor: default; }
  .px[hidden], .badge[hidden] { display: none; }
  /* 들고 있는 물고기 수 */
  .badge { display: flex; align-items: center; gap: 4px; min-height: 44px; margin: 3px; padding: 0 4px; color: #f4e6c8; font: bold 14px/1 inherit; font-family: inherit; }
  .badge canvas { width: 28px; height: 28px; image-rendering: crisp-edges; image-rendering: pixelated; }
  .px:focus-visible { outline: 2px solid #ffd84a; outline-offset: 4px; }
  #sound { position: absolute; top: 10px; right: 10px; min-height: 40px; padding: 6px; margin: 3px; }
  #sound canvas { width: 24px; height: 24px; }
  /* 캐릭터 머리 위 이름표 */
  .tag { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; pointer-events: none; }
  .tag[hidden] { display: none; }
  .tag .name { color: #f4e6c8; font: bold 12px/1.2 inherit; font-family: inherit; text-shadow: 1px 1px 0 #05071a, -1px 0 0 #05071a, 0 -1px 0 #05071a; }
  .tag .bubble { display: inline-block; max-width: 170px; margin-bottom: 4px; padding: 4px 7px; white-space: normal; word-break: break-all;
                 background: #f4e6c8; color: #1d1b38; font: bold 12px/1.3 inherit; font-family: inherit;
                 box-shadow: 0 -2px 0 #f4e6c8, -2px 0 0 #f4e6c8, 2px 0 0 #b8a888, 0 2px 0 #b8a888; }
  .tag .bubble[hidden] { display: none; }
  /* 첫 진입 설정 창 */
  #setup { position: absolute; inset: 0; z-index: 5; display: flex; overflow: auto; background: rgba(5, 7, 26, .72); }
  #setup[hidden] { display: none; }
  /* 상인 가게 창 */
  #shop { position: absolute; inset: 0; z-index: 4; display: flex; overflow: auto; background: rgba(5, 7, 26, .55); }
  #shop[hidden] { display: none; }
  #shop .panel { margin: auto; width: min(300px, calc(100% - 40px)); padding: 14px 16px 16px; background: #1d1b38; color: #f4e6c8;
                 box-shadow: 0 -3px 0 #7c70b0, -3px 0 0 #7c70b0, 3px 0 0 #3b3364, 0 3px 0 #3b3364; }
  #shop h1 { margin: 0 0 4px; font-size: 17px; text-align: center; }
  #shopFish { margin: 0 0 10px; text-align: center; font-size: 13px; color: #c8c0e0; }
  .shopItem { display: block; width: calc(100% - 6px); margin: 3px 3px 12px; padding: 9px 10px; text-align: left; white-space: normal; }
  .shopItem b { display: block; font-size: 14px; margin-bottom: 4px; }
  .shopItem small { font-size: 12px; font-weight: normal; color: #c8c0e0; }
  #shopClose { margin: 4px auto 0; padding: 6px 22px; justify-content: center; }
  #setup .panel { margin: auto; width: min(330px, calc(100% - 40px)); padding: 14px 16px 16px; background: #1d1b38; color: #f4e6c8;
                  box-shadow: 0 -3px 0 #7c70b0, -3px 0 0 #7c70b0, 3px 0 0 #3b3364, 0 3px 0 #3b3364; }
  #setup h1 { margin: 0 0 8px; font-size: 18px; text-align: center; }
  #preview { display: block; margin: 0 auto 8px; width: 64px; height: 96px; image-rendering: crisp-edges; image-rendering: pixelated; }
  #setup label, #setup .lab { display: block; margin: 8px 0 4px; font-size: 13px; font-weight: bold; }
  #nameInput { box-sizing: border-box; width: 100%; padding: 8px; border: 0; border-radius: 0; background: #0e0d22; color: #f4e6c8;
               font: 16px/1.2 inherit; font-family: inherit; box-shadow: 0 0 0 2px #3b3364; }
  #nameInput:focus { outline: 2px solid #ffd84a; }
  .sws { display: flex; flex-wrap: wrap; gap: 7px; }
  .sw { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 0; cursor: pointer; box-shadow: 0 0 0 2px #3b3364; }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px #1d1b38, 0 0 0 4px #ffd84a; }
  .sw:focus-visible { outline: 2px solid #ffffff; outline-offset: 4px; }
  #btnStart { margin: 16px auto 0; padding: 6px 22px; justify-content: center; }
  @media (max-width: 380px) { .btns { gap: 9px; } #chatInput { width: 160px; } .px { font-size: 12px; padding: 6px 8px 6px 6px; gap: 4px; } .px canvas { width: 24px; height: 24px; } }
</style>
</head>
<body>
<canvas id="view" aria-label="밤 숲속 모닥불 장면"></canvas>
<button id="sound" class="px" aria-label="소리 켜기/끄기" aria-pressed="false"><canvas width="12" height="12"></canvas></button>
<div id="tags"></div>
<div id="status" aria-live="polite"></div>
<div id="chatLog" hidden aria-label="대화 기록"></div>
<div id="bar" style="visibility:hidden">
  <div class="btns">
    <button id="btnPotato" class="px"><canvas width="16" height="16"></canvas><span>고구마</span></button>
    <button id="btnMarsh" class="px"><canvas width="16" height="16"></canvas><span>마시멜로</span></button>
    <button id="btnTea" class="px"><canvas width="16" height="16"></canvas><span>차 마시기</span></button>
    <button id="btnGrill" class="px" hidden><canvas width="16" height="16"></canvas><span id="grillCount">물고기 ×0</span></button>
    <button id="btnFish" class="px" hidden><canvas width="16" height="16"></canvas><span>낚시하기</span></button>
    <button id="btnBack" class="px" hidden><canvas width="16" height="16"></canvas><span>모닥불로</span></button>
    <div id="fishBadge" class="badge" hidden aria-label="들고 있는 물고기"><canvas width="16" height="16"></canvas><span id="fishCount">×0</span></div>
  </div>
  <div id="chatRow" hidden>
    <input id="chatInput" type="text" placeholder="한마디 건네기" autocomplete="off" aria-label="채팅 입력">
    <button id="chatSend" class="px">보내기</button>
    <button id="chatLogBtn" class="px" aria-expanded="false">기록</button>
  </div>
</div>
<div id="shop" hidden role="dialog" aria-label="떠돌이 상인">
  <div class="panel">
    <h1>떠돌이 상인</h1>
    <p id="shopFish"></p>
    <div id="shopItems"></div>
    <button id="shopClose" class="px">닫기</button>
  </div>
</div>
<div id="setup" role="dialog" aria-label="캐릭터 설정">
  <div class="panel">
    <h1>모닥불 멍</h1>
    <canvas id="preview" width="16" height="24" aria-label="캐릭터 미리 보기"></canvas>
    <label for="nameInput">이름</label>
    <input id="nameInput" type="text" placeholder="이름을 적어 주세요" autocomplete="off">
    <span class="lab">모자</span><div id="swHat" class="sws"></div>
    <span class="lab">옷</span><div id="swCoat" class="sws"></div>
    <span class="lab">바지</span><div id="swPants" class="sws"></div>
    <button id="btnStart" class="px">시작하기</button>
  </div>
</div>
<!-- 함께 보기용 Supabase 라이브러리. 불러오지 못하면 혼자 보기로 동작 -->

'use strict';

/* =====================================================================

const CONFIG = {
  // ── 화면 ──
  width: 320,                    // 내부 해상도 가로(px)

    coat:  [['#3f7a78', '청록'], ['#4a6ab0', '파랑'], ['#8a4a6a', '자주'], ['#b0523c', '벽돌'], ['#6a8a3a', '올리브'], ['#c8a03a', '겨자'], ['#7a7a8a', '회색'], ['#d8cfc0', '아이보리']],
    pants: [['#4a4668', '남색'], ['#3a5a7a', '청바지'], ['#5a4a3a', '갈색'], ['#3a5a44', '숲색'], ['#6a3a4a', '와인'], ['#6a6a72', '회색'], ['#2e2e3a', '먹색'], ['#b8a888', '베이지']],
  },

  // ── 아이템 ──
  potatoCookTime: 40,            // 고구마 익는 시간(초)
  potatoMax: 3,                  // 불 속 고구마 최대 개수(최대 3)
  marshmallowGoldenTime: 25,     // 마시멜로가 노릇해지는 시간(초)
  marshmallowBurnTime: 60,       // 마시멜로가 타기 직전이 되는 시간(초)

  // ── 호수와 낚시 ──
  fishMax: 5,                    // 들고 다닐 수 있는 물고기 수(탭을 닫으면 0으로 돌아감)
  fishWait: [5, 20],             // 입질이 올 때까지 기다리는 시간(초, 최소~최대)
  fishCookTime: 35,              // 꼬챙이 물고기가 노릇하게 익는 시간(초)
  fishBurnTime: 80,              // 물고기가 타기 직전이 되는 시간(초)

  volume: 0.5,                   // 전체 음량(0~1)

  // ── 움직임 줄이기(prefers-reduced-motion) ──
  reducedMotionFactor: 0.3,      // 별 회전 속도와 파티클 양에 곱하는 비율

    constellation: '#cfd8ff',
    forestFar: ['#241e4a', '#181a3a', '#0e1428'],   // 먼 숲 3겹(뒤 → 앞)

    dark: { ground: '#0a100f', ground2: '#0e1614', dirt: '#0c0e0e', grass: '#11201a', stone: '#161b20', stoneHi: '#1e252c', tree: '#050b0b', tree2: '#081210', trunk: '#080909' },
    lit:  { ground: '#3b2c1a', ground2: '#4a3a20', dirt: '#4e3420', grass: '#5c6a26', stone: '#7c6c5c', stoneHi: '#a89078', tree: '#22361c', tree2: '#182a16', trunk: '#5a3a22' },

      C: '#e8b03a', c: '#8a6234',   // 목도리
      B: '#3f7a78', b: '#1f3e4e',   // 외투
      D: '#56928c', d: '#2c5560',   // 소매
      L: '#4a4668', l: '#26243e',   // 바지

/* =====================================================================
 * 공통 도구
 * ===================================================================== */
const W = CONFIG.width, H = CONFIG.height;
const SKY_H = 132;                       // 하늘이 보이는 높이(그 아래는 숲과 땅)
const P = CONFIG.palette;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

// 움직임 줄이기 설정
const Motion = { reduced: false, get factor() { return this.reduced ? CONFIG.reducedMotionFactor : 1; } };

// 시드 고정 난수(숲 모양이 매번 같게)
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hexRgb(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(c1, c2, t) {
  const a = hexRgb(c1), b = hexRgb(c2); t = clamp01(t);
  return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
}

// 두 색을 섞어 #rrggbb로 돌려줌(옷 색의 그늘 쪽 색을 만들 때 씀)
function shade(c1, c2, t) {
  const a = hexRgb(c1), b = hexRgb(c2);
  return '#' + [0, 1, 2].map(i => Math.round(lerp(a[i], b[i], t)).toString(16).padStart(2, '0')).join('');
}

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// 픽셀 선(브레젠험)
function plotLine(ctx, x0, y0, x1, y1, size) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const s = size || 1;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (let i = 0; i < 600; i++) {
    ctx.fillRect(x0, y0, s, s);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

// 가로줄로 채우는 픽셀 타원
function fillEllipse(ctx, cx, cy, rx, ry) {
  ry = Math.max(1, Math.round(ry));
  for (let dy = -ry; dy <= ry; dy++) {
    const w = rx * Math.sqrt(1 - (dy * dy) / (ry * ry));
    ctx.fillRect(Math.round(cx - w), cy + dy, Math.round(w * 2), 1);
  }
}

// 문자열 스프라이트 그리기. flip이면 좌우를 뒤집고, swap이면 밝은 쪽(대문자)/그늘 쪽(소문자) 색을 맞바꿈
function drawSprite(ctx, rows, pal, x, y, flip, swap) {
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r], n = row.length;
    for (let c = 0; c < n; c++) {
      let ch = row[c];
      if (ch === '.') continue;
      let cx = c;
      if (flip) cx = n - 1 - c;
      if (swap) { const u = ch.toUpperCase(); ch = (ch === u) ? ch.toLowerCase() : u; }
      ctx.fillStyle = pal[ch];
      ctx.fillRect(x + cx, y + r, 1, 1);
    }
  }
}

// 파티클 재사용 풀(object pool): 미리 만들어 두고 꺼졌다 켜졌다만 함
class Pool {
  constructor(n) {
    this.items = [];
    for (let i = 0; i < n; i++) this.items.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, age: 0, life: 1, ph: 0, s0: 1, s1: 1, a: 1, col: '#fff' });
    this.cursor = 0;
  }
  spawn() {
    const n = this.items.length;
    for (let i = 0; i < n; i++) {
      const p = this.items[this.cursor];
      this.cursor = (this.cursor + 1) % n;
      if (!p.active) { p.active = true; p.age = 0; return p; }
    }
    return null; // 풀이 꽉 차면 그냥 건너뜀
  }
}

/* =====================================================================
 * Sky — 밤하늘, 별, 별자리, 은하수, 별똥별
 * ===================================================================== */
const Sky = {
  angle: 0, stars: [], dust: [], consts: [], bg: null,
  meteors: [], meteorTimer: 12,                 // 별똥별(여러 개가 함께 떨어질 수 있음)
  clock: 0, showerLeft: 0, showerT: 0,          // 별똥별 무리
  auroraT: 0,                                   // 오로라가 남은 시간(초)
  rockets: [], sparks: new Pool(150),           // 폭죽

  init() {
    // 배경 그라데이션(위는 진하고 아래로 갈수록 살짝 밝게)을 한 번만 그려 둠
    this.bg = makeCanvas(W, H);
    const g = this.bg.getContext('2d');
    for (let y = 0; y < H; y++) {
      const t = Math.min(1, y / SKY_H);
      g.fillStyle = t < 0.55 ? mix(P.skyTop, P.skyMid, t / 0.55) : mix(P.skyMid, P.skyHorizon, (t - 0.55) / 0.45);
      g.fillRect(0, y, W, 1);
    }

    // 별: 회전 중심을 둘러싼 큰 원 안에 고르게 뿌림(화면에 보이는 수가 starCount쯤 되게)
    const px = CONFIG.poleX, py = CONFIG.poleY;
    const R = Math.hypot(Math.max(px, W - px), SKY_H - py);
    const total = Math.round(CONFIG.starCount * (Math.PI * R * R) / (W * SKY_H));
    const rng = mulberry32(20240607);
    for (let i = 0; i < total; i++) {
      const r = R * Math.sqrt(rng()), a = rng() * TAU;
      this.stars.push({
        vx: Math.cos(a) * r, vy: Math.sin(a) * r,
        size: rng() < 0.08 ? 2 : 1,
        b: 0.3 + rng() * 0.7,                 // 기본 밝기
        sp: 0.4 + rng() * 1.6, ph: rng() * TAU, // 반짝임 주기와 위상
        col: P.stars[(rng() * P.stars.length) | 0],
      });
    }

    // 은하수: 회전 중심에서 조금 떨어진 곳을 지나는 띠
    const phi = 1.05, d = 70, nx = Math.cos(phi), ny = Math.sin(phi), ux = -ny, uy = nx;
    for (let i = 0; i < CONFIG.milkyWayDust; i++) {
      const s = (rng() * 2 - 1) * R, gz = (rng() + rng() + rng() - 1.5) * 15;
      this.dust.push({ vx: nx * (d + gz) + ux * s, vy: ny * (d + gz) + uy * s, a: 0.05 + rng() * 0.13, s: rng() < 0.12 ? 2 : 1 });
    }

    // 별자리: r, a는 회전 중심에서의 거리와 방향(도). 90도가 중심 바로 아래
    const defs = [
      { name: '북두칠성', r: 82, a: 95, pts: [[0, 0], [1, 7], [10, 8], [11, 2], [18, 0], [25, -3], [32, 0]], lines: [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 5], [5, 6]] },
      { name: '카시오페이아', r: 80, a: 275, pts: [[0, 0], [7, 7], [14, 1], [21, 8], [28, 2]], lines: [[0, 1], [1, 2], [2, 3], [3, 4]] },
      { name: '오리온', r: 140, a: 140, pts: [[0, 0], [13, 1], [4, 12], [7, 11], [10, 10], [2, 23], [14, 22]], lines: [[0, 1], [0, 2], [1, 4], [2, 3], [3, 4], [2, 5], [4, 6]] },
      { name: '백조', r: 132, a: 42, pts: [[0, 0], [5, 8], [12, 22], [14, 3], [-5, 12]], lines: [[0, 1], [1, 2], [3, 1], [1, 4]] },
    ];
    for (const def of defs) {
      const a = def.a * Math.PI / 180, rot = a - Math.PI / 2;
      let mx = 0, my = 0;
      for (const p of def.pts) { mx += p[0]; my += p[1]; }
      mx /= def.pts.length; my /= def.pts.length;
      const cr = Math.cos(rot), sr = Math.sin(rot);
      const pts = def.pts.map(p => {
        const lx = p[0] - mx, ly = p[1] - my;
        return { vx: Math.cos(a) * def.r + lx * cr - ly * sr, vy: Math.sin(a) * def.r + lx * sr + ly * cr, x: 0, y: 0, ph: rng() * TAU };
      });
      this.consts.push({ pts, lines: def.lines });
    }
  },

  update(dt) {
    // 실제 하늘처럼 북극성 둘레를 반시계 방향으로 천천히 회전
    this.angle -= dt * TAU / CONFIG.starRotationPeriod * Motion.factor;

    this.clock += dt;
    // 별똥별: 평소에는 가끔 하나씩
    for (const m of this.meteors) {
      if (!m.active) continue;
      m.age += dt; m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.age >= m.life) m.active = false;
    }
    if (!Motion.reduced) {
      this.meteorTimer -= dt;
      if (this.meteorTimer <= 0) { this.spawnMeteor(); this.meteorTimer = rand(CONFIG.shootingStarInterval[0], CONFIG.shootingStarInterval[1]); }
    }
    // 별똥별 무리(상인에게서 산 것)
    if (this.showerLeft > 0) {
      this.showerT -= dt;
      if (this.showerT <= 0) { this.spawnMeteor(); this.showerLeft--; this.showerT = rand(0.8, 2.2); }
    }
    if (this.auroraT > 0) this.auroraT -= dt;

    // 폭죽: 천천히 올라가 조용히 퍼짐
    for (const r of this.rockets) {
      if (r.done) continue;
      r.wait -= dt; if (r.wait > 0) continue;
      r.y -= 42 * dt;
      if (r.y <= r.ty) {
        r.done = true;
        const n = Motion.reduced ? 14 : 34;
        for (let i = 0; i < n; i++) {
          const p = this.sparks.spawn(); if (!p) break;
          const a = TAU * i / n + rand(-0.08, 0.08), sp = rand(10, 24);
          p.x = r.x; p.y = r.y; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp; p.life = rand(1.8, 2.8); p.col = i % 3 ? r.col : '#ffffff';
        }
      }
    }
    if (this.rockets.length && this.rockets.every(r => r.done)) this.rockets.length = 0;
    for (const p of this.sparks.items) {
      if (!p.active) continue;
      p.age += dt;
      if (p.age >= p.life) { p.active = false; continue; }
      p.vx *= (1 - 0.9 * dt); p.vy = p.vy * (1 - 0.9 * dt) + 5 * dt;   // 서서히 느려지며 살짝 내려앉음
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
  },

  spawnMeteor() {
    let m = this.meteors.find(v => !v.active);
    if (!m) { if (this.meteors.length >= 8) return; m = { active: false }; this.meteors.push(m); }
    const dir = Math.random() < 0.5 ? 1 : -1, ang = rand(0.35, 0.7), sp = rand(110, 150);
    m.active = true; m.age = 0; m.life = rand(0.55, 0.8);
    m.x = rand(60, 260); m.y = rand(6, 50);
    m.vx = Math.cos(ang) * sp * dir; m.vy = Math.sin(ang) * sp;
  },

  // 상인에게서 산 구경거리를 하늘에 띄움(모두의 화면에서 함께)
  play(kind) {
    if (kind === 'firework') {
      const cols = ['#ffd84a', '#ff8ab0', '#8ad8ff', '#a8ffb0', '#d0a8ff'];
      for (let i = 0; i < 3; i++) this.rockets.push({ x: rand(70, 250), y: SKY_H - 16, ty: rand(26, 58), wait: i * 1.3, col: cols[(Math.random() * cols.length) | 0], done: false });
    } else if (kind === 'meteor') { this.showerLeft = Motion.reduced ? 5 : 12; this.showerT = 0.5; }
    else if (kind === 'aurora') this.auroraT = CONFIG.auroraSeconds;
  },

  draw(ctx, t) {
    ctx.drawImage(this.bg, 0, 0);
    const c = Math.cos(this.angle), s = Math.sin(this.angle), px = CONFIG.poleX, py = CONFIG.poleY;

    // 은하수
    ctx.fillStyle = P.milky;
    for (let i = 0; i < this.dust.length; i++) {
      const d = this.dust[i];
      const x = px + d.vx * c - d.vy * s, y = py + d.vx * s + d.vy * c;
      if (x < 0 || x >= W || y < 0 || y >= SKY_H) continue;
      ctx.globalAlpha = d.a;
      ctx.fillRect(x | 0, y | 0, d.s, d.s);
    }

    // 별(각자 다른 주기로 은은하게 반짝임)
    for (let i = 0; i < this.stars.length; i++) {
      const st = this.stars[i];
      const x = px + st.vx * c - st.vy * s, y = py + st.vx * s + st.vy * c;
      if (x < 0 || x >= W || y < 0 || y >= SKY_H) continue;
      ctx.globalAlpha = st.b * (0.65 + 0.35 * Math.sin(t * st.sp + st.ph));
      ctx.fillStyle = st.col;
      ctx.fillRect(x | 0, y | 0, st.size, st.size);
    }

    // 별자리(같은 회전에 맞춰 함께 움직임)
    for (const k of this.consts) {
      let visible = false;
      for (const p of k.pts) {
        p.x = px + p.vx * c - p.vy * s; p.y = py + p.vx * s + p.vy * c;
        if (p.x > -4 && p.x < W + 4 && p.y > -4 && p.y < SKY_H + 4) visible = true;
      }
      if (!visible) continue;
      ctx.fillStyle = P.constellation;
      ctx.globalAlpha = CONFIG.constellationLineAlpha;
      for (const l of k.lines) plotLine(ctx, k.pts[l[0]].x, k.pts[l[0]].y, k.pts[l[1]].x, k.pts[l[1]].y);
      for (const p of k.pts) {
        const x = Math.round(p.x), y = Math.round(p.y);
        const tw = 0.8 + 0.2 * Math.sin(t * 1.1 + p.ph);
        ctx.globalAlpha = 0.3 * tw;
        ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3);
        ctx.globalAlpha = tw; ctx.fillStyle = '#ffffff';
        ctx.fillRect(x, y, 1, 1);
        ctx.fillStyle = P.constellation;
      }
    }

    // 오로라: 천천히 일렁이는 빛의 장막(처음과 끝은 서서히)
    if (this.auroraT > 0) {
      const tt = this.clock * (Motion.reduced ? 0.3 : 1), total = CONFIG.auroraSeconds;
      const fade = Math.min(1, this.auroraT / 6, (total - this.auroraT) / 6 + 0.02);
      for (let x = 0; x < W; x += 2) {
        const top = Math.round(14 + 9 * Math.sin(x * 0.031 + tt * 0.16) + 4 * Math.sin(x * 0.083 - tt * 0.11));
        const h = Math.round(20 + 12 * Math.sin(x * 0.052 + tt * 0.31) + 7 * Math.sin(x * 0.13 - tt * 0.2));
        const a = 0.22 * fade * (0.55 + 0.45 * Math.sin(x * 0.09 + tt * 0.5));
        if (a <= 0.005 || h < 3) continue;
        ctx.fillStyle = mix('#5cffb0', '#a070ff', 0.5 + 0.5 * Math.sin(x * 0.02 + tt * 0.07));
        const h3 = Math.max(1, (h / 3) | 0);
        ctx.globalAlpha = a * 0.45; ctx.fillRect(x, top, 2, h3);
        ctx.globalAlpha = a * 0.8; ctx.fillRect(x, top + h3, 2, h3);
        ctx.globalAlpha = a; ctx.fillRect(x, top + h3 * 2, 2, h3);
      }
    }

    // 별똥별(짧고 옅게)
    ctx.fillStyle = '#ffffff';
    for (const sh of this.meteors) {
      if (!sh.active) continue;
      const k = sh.age / sh.life, a = Math.sin(Math.PI * k) * 0.8;
      const len = Math.hypot(sh.vx, sh.vy), ux = sh.vx / len, uy = sh.vy / len;
      for (let i = 0; i < 9; i++) {
        const x = sh.x - ux * i * 1.6, y = sh.y - uy * i * 1.6;
        if (y >= SKY_H) continue;
        ctx.globalAlpha = a * (1 - i / 9);
        ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
      }
    }

    // 폭죽
    for (const r of this.rockets) {
      if (r.done || r.wait > 0) continue;
      ctx.fillStyle = '#ffe9c4';
      ctx.globalAlpha = 0.9; ctx.fillRect(Math.round(r.x), Math.round(r.y), 1, 1);
      ctx.globalAlpha = 0.4; ctx.fillRect(Math.round(r.x), Math.round(r.y) + 1, 1, 2);
    }
    for (const p of this.sparks.items) {
      if (!p.active) continue;
      const k = p.age / p.life;
      ctx.globalAlpha = (1 - k) * (k > 0.5 && ((p.age * 9) | 0) % 2 ? 0.5 : 1);   // 꺼질 무렵 반짝임
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
    }
    ctx.globalAlpha = 1;
  },
};

/* =====================================================================
 * Forest — 먼 숲, 가까운 숲과 땅, 불빛 받는 범위, 반딧불이
 * ===================================================================== */
const Forest = {
  far: null, nearDark: null, nearLit: null, lightCv: null, lctx: null, flies: [],

  // 침엽수 한 그루(층층이 톱니 모양)
  tree(g, rng, x, baseY, h, w, col, col2) {
    for (let i = 0; i < h; i++) {
      const frac = i / h, tier = (i % 6) / 6;
      const hw = i < 2 ? 0 : Math.round((0.2 + 0.8 * frac) * w / 2 * (0.5 + 0.5 * tier));
      g.fillStyle = col;
      g.fillRect(x - hw, baseY - h + i, hw * 2 + 1, 1);
      const r1 = rng(), r2 = rng();
      if (col2 && hw > 2 && r1 < 0.45) { // 잎 사이 그늘
        g.fillStyle = col2;
        const sw = 1 + Math.floor(r2 * hw);
        g.fillRect(x - hw + Math.floor(r2 * hw), baseY - h + i, sw, 1);
      }
    }
  },

  // 가까운 숲과 땅. 팔레트만 바꿔 어두운 판/밝은 판을 똑같은 모양으로 그림
  paintNear(g, pal) {
    const rng = mulberry32(777);
    g.fillStyle = pal.ground;
    g.fillRect(0, 128, W, H - 128);
    for (let x = 0; x < W; x++) if (rng() < 0.5) g.fillRect(x, 127, 1, 1);
    g.fillStyle = pal.ground2;
    for (let i = 0; i < 300; i++) g.fillRect((rng() * W) | 0, 129 + ((rng() * 50) | 0), 1 + ((rng() * 2) | 0), 1);
    // 모닥불 둘레 맨흙
    g.fillStyle = pal.dirt;
    fillEllipse(g, CONFIG.fireX, CONFIG.fireY + 1, 25, 7);
    // 어두운 나무 몇 그루: [x, 밑동 y, 높이, 너비]
    const trees = [[18, 151, 128, 60], [72, 147, 98, 46], [250, 147, 102, 48], [304, 152, 132, 62]];
    for (const tr of trees) {
      g.fillStyle = pal.trunk;
      g.fillRect(tr[0] - 1, tr[1] - 10, 3, 12);
      this.tree(g, rng, tr[0], tr[1] - 7, tr[2], tr[3], pal.tree, pal.tree2);
    }
    // 풀
    g.fillStyle = pal.grass;
    for (let i = 0; i < 90; i++) {
      const x = (rng() * W) | 0, y = 130 + ((rng() * 48) | 0);
      if (Math.abs(x - CONFIG.fireX) < 27 && Math.abs(y - CONFIG.fireY) < 9) continue;
      g.fillRect(x, y - 2, 1, 3); g.fillRect(x + 2, y - 1, 1, 2); g.fillRect(x - 1, y - 1, 1, 2);
    }
    // 작은 돌
    for (let i = 0; i < 12; i++) {
      const x = (rng() * W) | 0, y = 134 + ((rng() * 42) | 0);
      if (Math.abs(x - CONFIG.fireX) < 27 && Math.abs(y - CONFIG.fireY) < 9) continue;
      g.fillStyle = pal.stone; g.fillRect(x, y, 3, 2);
      g.fillStyle = pal.stoneHi; g.fillRect(x, y, 2, 1);
    }
  },

  init() {
    // 먼 숲 2~3겹: 뒤쪽일수록 하늘색에 가깝고 흐리게
    this.far = makeCanvas(W, H);
    const g = this.far.getContext('2d');
    const rng = mulberry32(4242);
    const layers = [[120, 10, 22, 9], [125, 16, 32, 12], [129, 24, 44, 16]]; // [밑선 y, 최소 높이, 최대 높이, 간격]
    layers.forEach((L, i) => {
      const col = P.forestFar[i];
      for (let x = -10; x < W + 10; x += L[3] * (0.6 + rng() * 0.8)) {
        const h = L[1] + rng() * (L[2] - L[1]);
        this.tree(g, rng, Math.round(x), L[0], Math.round(h), h * (0.45 + rng() * 0.15), col, null);
      }
      g.fillStyle = col;
      g.fillRect(0, L[0], W, H - L[0]);
    });

    this.nearDark = makeCanvas(W, H); this.paintNear(this.nearDark.getContext('2d'), P.dark);
    this.nearLit = makeCanvas(W, H); this.paintNear(this.nearLit.getContext('2d'), P.lit);
    this.lightCv = makeCanvas(W, H); this.lctx = this.lightCv.getContext('2d');

    // 반딧불이: 숲 가장자리 근처
    for (let i = 0; i < CONFIG.fireflyCount; i++) {
      this.flies.push({
        hx: i % 2 ? rand(215, 300) : rand(20, 105), hy: rand(104, 138),
        a: rand(0.15, 0.4), b: rand(0.2, 0.5), p: rand(0, TAU), q: rand(0, TAU), c: rand(0.5, 1.1), ph: rand(0, TAU),
      });
    }
  },

  drawFar(ctx) { ctx.drawImage(this.far, 0, 0); },

  // 어두운 판 위에, 불빛이 닿는 범위만 밝은 판을 겹쳐 그림(빛의 원이 계단식으로 옅어짐)
  drawNear(ctx, flick) {
    ctx.drawImage(this.nearDark, 0, 0);
    const l = this.lctx, R = CONFIG.lightRadius * flick;
    const bandR = [1, 0.78, 0.56, 0.34], bandA = [0.18, 0.27, 0.42, 0.71];
    l.globalCompositeOperation = 'source-over';
    l.clearRect(0, 0, W, H);
    l.fillStyle = '#ffffff';
    for (let i = 0; i < 4; i++) {
      l.globalAlpha = bandA[i];
      fillEllipse(l, CONFIG.fireX, CONFIG.fireY, R * bandR[i], R * bandR[i] * 0.6);
    }
    l.globalAlpha = 1;
    l.globalCompositeOperation = 'source-in';
    l.drawImage(this.nearLit, 0, 0);
    ctx.drawImage(this.lightCv, 0, 0);
  },

  drawFlies(ctx, t) {
    const sp = Motion.reduced ? 0.4 : 1;
    ctx.fillStyle = P.firefly;
    for (const f of this.flies) {
      const glow = Math.sin(t * f.c + f.ph);
      if (glow < 0.05) continue;
      const x = Math.round(f.hx + Math.sin(t * f.a * sp + f.p) * 14 + Math.sin(t * f.a * 2.3 * sp + f.q) * 4);
      const y = Math.round(f.hy + Math.sin(t * f.b * sp + f.q) * 7);
      ctx.globalAlpha = glow * 0.2;
      ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3);
      ctx.globalAlpha = glow;
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.globalAlpha = 1;
  },
};

/* =====================================================================
 * Campfire — 돌, 장작, 불꽃·불티·연기 파티클, 불빛
 * ===================================================================== */
const STONE_BACK = ['.TT.', 'LLLL', 'LLLl'];   // 불 뒤쪽 돌: 불빛을 받는 면이 보임
const STONE_FRONT = ['.RR.', 'DDDD', 'DDDd'];  // 불 앞쪽 돌: 어둡고 윗부분만 빛남
const STONE_PAL = { T: '#7a6860', L: '#a8866a', l: '#8a6a58', R: '#b8845a', D: '#3a3038', d: '#2a2228' };

const Campfire = {
  flames: new Pool(160), sparks: new Pool(56), smoke: new Pool(72),
  flick: 1, noise: 0, noiseTarget: 0, noiseT: 0,
  accF: 0, accS: 0, accM: 0, embers: [],

  init() {
    // 장작 위 숯불 자리
    const rng = mulberry32(99);
    for (let i = 0; i < 14; i++) this.embers.push({ x: 152 + ((rng() * 16) | 0), y: 145 + ((rng() * 4) | 0), ph: rng() * TAU, sp: 1 + rng() * 2 });
  },

  // 불티를 한꺼번에 튀기기(고구마가 들어갈 때)
  burst(n, x, y) {
    n = Math.max(2, Math.round(n * Motion.factor));
    for (let i = 0; i < n; i++) {
      const p = this.sparks.spawn(); if (!p) return;
      p.x = x + rand(-3, 3); p.y = y; p.vx = rand(-20, 20); p.vy = rand(-48, -18); p.life = rand(0.8, 1.8); p.ph = rand(0, TAU);
    }
  },

  // 연기·김·입김 공통 파티클
  puff(x, y, vx, vy, life, s0, s1, a, col) {
    const p = this.smoke.spawn(); if (!p) return;
    p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.s0 = s0; p.s1 = s1; p.a = a; p.col = col; p.ph = rand(0, TAU);
  },

  update(dt, t) {
    // 불빛 깜빡임: 느린 물결 + 부드럽게 따라가는 잡음
    this.noiseT -= dt;
    if (this.noiseT <= 0) { this.noiseT = rand(0.08, 0.2); this.noiseTarget = rand(-0.06, 0.05); }
    this.noise += (this.noiseTarget - this.noise) * Math.min(1, dt * 9);
    this.flick = 0.92 + 0.05 * Math.sin(t * 5.3) + 0.03 * Math.sin(t * 12.7 + 1.3) + this.noise;

    const fx = CONFIG.fireX, mf = Motion.factor;
    // 불꽃 만들기
    this.accF += CONFIG.flameRate * dt * (Motion.reduced ? 0.5 : 1);
    while (this.accF >= 1) {
      this.accF -= 1;
      const p = this.flames.spawn(); if (!p) break;
      p.x = fx + rand(-6, 6); p.y = 146 + rand(-1, 1); p.vy = -rand(16, 30); p.life = rand(0.5, 1.0); p.ph = rand(0, TAU);
    }
    // 가끔 날아오르는 불티
    this.accS += CONFIG.sparkRate * dt * mf;
    while (this.accS >= 1) {
      this.accS -= 1;
      const p = this.sparks.spawn(); if (!p) break;
      p.x = fx + rand(-4, 4); p.y = 138; p.vx = rand(-8, 8); p.vy = rand(-38, -20); p.life = rand(1.5, 3); p.ph = rand(0, TAU);
    }
    // 얇은 연기
    this.accM += CONFIG.smokeRate * dt * mf;
    while (this.accM >= 1) {
      this.accM -= 1;
      this.puff(fx + rand(-3, 3), 127, rand(-1.5, 1.5), -rand(6, 10), rand(4, 6.5), 1, 4, 0.11, P.smoke);
    }

    // 파티클 움직이기
    for (const p of this.flames.items) {
      if (!p.active) continue;
      p.age += dt;
      if (p.age >= p.life) { p.active = false; continue; }
      p.x += ((fx - p.x) * 1.6 + Math.sin(t * 8 + p.ph) * 6) * dt; // 위로 갈수록 가운데로 모이며 일렁임
      p.y += p.vy * dt;
    }
    for (const p of this.sparks.items) {
      if (!p.active) continue;
      p.age += dt;
      if (p.age >= p.life) { p.active = false; continue; }
      p.vx += Math.sin(t * 3 + p.ph) * 18 * dt;
      p.vy *= (1 - 0.35 * dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (const p of this.smoke.items) {
      if (!p.active) continue;
      p.age += dt;
      if (p.age >= p.life) { p.active = false; continue; }
      p.x += (p.vx + Math.sin(t * 1.3 + p.ph) * 2.5) * dt;
      p.y += p.vy * dt;
    }
  },

  // 불 뒤쪽: 돌과 엇갈려 쌓은 장작
  drawBack(ctx, t) {
    for (const x of [148, 153, 158, 163, 168]) drawSprite(ctx, STONE_BACK, STONE_PAL, x, 142);
    drawSprite(ctx, STONE_BACK, STONE_PAL, 144, 145);
    drawSprite(ctx, STONE_BACK, STONE_PAL, 172, 145);
    ctx.fillStyle = '#241612'; ctx.fillRect(152, 146, 16, 3);
    ctx.fillStyle = '#3a2218'; plotLine(ctx, 151, 147, 166, 141, 2);
    ctx.fillStyle = '#4a2c1c'; plotLine(ctx, 168, 147, 153, 141, 2);
    for (const e of this.embers) {
      const v = Math.sin(t * e.sp + e.ph);
      ctx.fillStyle = v > 0.5 ? '#ffb84a' : v > -0.2 ? '#ff6a1a' : '#9a2c12';
      ctx.fillRect(e.x, e.y, 1, 1);
    }
  },

  // 불꽃: 아래는 흰색·노랑, 위로 갈수록 주황·빨강
  drawFlames(ctx) {
    const F = P.flame;
    for (let pass = 0; pass < 2; pass++) { // 위쪽(식은) 불꽃 먼저, 뜨거운 속불을 나중에
      for (const p of this.flames.items) {
        if (!p.active) continue;
        const k = p.age / p.life;
        if ((k < 0.4) !== (pass === 1)) continue;
        const s = k < 0.35 ? 3 : k < 0.7 ? 2 : 1;
        ctx.fillStyle = k < 0.15 ? F[0] : k < 0.35 ? F[1] : k < 0.6 ? F[2] : k < 0.82 ? F[3] : F[4];
        ctx.globalAlpha = k > 0.85 ? (1 - k) / 0.15 : 1;
        ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
      }
    }
    ctx.globalAlpha = 1;
  },

  // 불 앞쪽 돌
  drawFront(ctx) {
    for (const x of [146, 151, 156, 161, 166, 171]) drawSprite(ctx, STONE_FRONT, STONE_PAL, x, 150);
  },

  drawParticles(ctx) {
    for (const p of this.smoke.items) {
      if (!p.active) continue;
      const k = p.age / p.life, s = Math.round(lerp(p.s0, p.s1, k));
      ctx.globalAlpha = p.a * (1 - k) * Math.min(1, k * 8);
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
    }
    for (const p of this.sparks.items) {
      if (!p.active) continue;
      const k = p.age / p.life;
      ctx.globalAlpha = 1 - k * k;
      ctx.fillStyle = k < 0.5 ? P.spark[0] : P.spark[1];
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
    }
    ctx.globalAlpha = 1;
  },

  // 불 주위 공기와 캐릭터에 더해지는 따뜻한 빛
  drawGlow(ctx) {
    const f = this.flick, radii = [40, 29, 19, 10], alphas = [0.022, 0.04, 0.06, 0.09];
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = P.glow;
    for (let i = 0; i < 4; i++) {
      ctx.globalAlpha = alphas[i] * f;
      fillEllipse(ctx, CONFIG.fireX, 138, radii[i] * f, radii[i] * f);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  },
};

/* =====================================================================
 * Lake — 밤호수 장면: 달, 건너편 숲, 물결, 낚시터, 표지판
 * ===================================================================== */
const SHORE_Y = 112;                                  // 건너편 물가 높이
const LAKE_SEATS = [60, 94, 128, 162, 196, 230];      // 낚시터에 앉는 자리(모두 오른쪽을 봄)
const SIGN_SPR = [
  '.WWWWWWWWWW..',
  'WWWWWWWWAWWW.',
  'WWAAAAAAAAWWW',
  'WWWWWWWWAWWW.',
  '.WWWWWWWWWW..',
  '..wwwwwwwww..',
  '.....pp......', '.....pp......', '.....pp......', '.....pp......', '.....pp......',
  '.....pp......', '.....pp......', '.....pp......', '.....pp......',
];
const SIGN_PAL = { W: '#7a5a38', w: '#3e2c1c', A: '#f4e6c8', p: '#4a3422' };
// 표지판 위치: 모닥불 쪽은 오른쪽 끝(호수로), 호수 쪽은 왼쪽 끝(모닥불로)
const SIGNS = { camp: { x: 279, y: 137, flip: false }, lake: { x: 5, y: 126, flip: true } };
const FISH_SPR = ['.FFFF.T', 'FEFFFTT', '.BBBB.T'];
const FISH_PAL = { F: '#8fb4d0', B: '#d8e8f0', E: '#1a2030', T: '#6a90b0' };

const Lake = {
  water: null, front: null, ripples: [], glints: [],

  init() {
    const rng = mulberry32(31337);
    // 건너편 숲과 물(달빛 반사보다 뒤)
    this.water = makeCanvas(W, H);
    let g = this.water.getContext('2d');
    for (let x = -6; x < W + 6; x += 5 + rng() * 6) Forest.tree(g, rng, Math.round(x), SHORE_Y - 2, Math.round(6 + rng() * 7), 5 + rng() * 3, '#1c1e44', null);
    g.fillStyle = '#1c1e44'; g.fillRect(0, SHORE_Y - 2, W, 2);
    for (let x = -8; x < W + 8; x += 7 + rng() * 9) Forest.tree(g, rng, Math.round(x), SHORE_Y, Math.round(9 + rng() * 12), 7 + rng() * 4, '#10142e', null);
    for (let y = SHORE_Y; y < H; y++) { g.fillStyle = mix('#182050', '#060a1e', (y - SHORE_Y) / (H - SHORE_Y)); g.fillRect(0, y, W, 1); }
    g.fillStyle = '#0c1028'; g.globalAlpha = 0.55; g.fillRect(0, SHORE_Y, W, 9); g.globalAlpha = 1;   // 물에 비친 숲 그림자

    // 앞쪽: 왼쪽 물가 언덕, 갈대, 나무 낚시터
    this.front = makeCanvas(W, H);
    g = this.front.getContext('2d');
    for (let x = 0; x < 76; x++) {
      const top = Math.round(138 + Math.pow(x / 76, 2) * 22);
      g.fillStyle = '#0a100f'; g.fillRect(x, top, 1, H - top);
      g.fillStyle = '#1c2a2c'; g.fillRect(x, top, 1, 1);
    }
    g.fillStyle = '#12221c';
    for (let i = 0; i < 16; i++) { const x = (rng() * 60) | 0, y = 144 + ((rng() * 30) | 0); g.fillRect(x, y - 2, 1, 3); g.fillRect(x + 2, y - 1, 1, 2); }
    for (let i = 0; i < 9; i++) {   // 갈대
      const x = 50 + ((rng() * 30) | 0), h = 7 + ((rng() * 6) | 0), y = 150 + ((rng() * 14) | 0);
      g.fillStyle = '#14261c'; g.fillRect(x, y - h, 1, h);
      g.fillStyle = '#3a3424'; g.fillRect(x, y - h - 2, 1, 2);
    }
    for (let x = 38; x < 300; x += 42) {   // 낚시터 기둥
      g.fillStyle = '#2a2018'; g.fillRect(x, 155, 3, 19);
      g.fillStyle = '#1a1410'; g.fillRect(x + 2, 155, 1, 19);
    }
    g.fillStyle = '#6a5440'; g.fillRect(24, 152, 278, 1);   // 널빤지
    g.fillStyle = '#4a3828'; g.fillRect(24, 153, 278, 1);
    g.fillStyle = '#2e2219'; g.fillRect(24, 154, 278, 1);
    g.fillStyle = '#3a2c20'; for (let x = 31; x < 302; x += 9) g.fillRect(x, 152, 1, 2);

    for (let i = 0; i < 46; i++) this.ripples.push({ x: (rng() * W) | 0, y: SHORE_Y + 4 + ((rng() * 62) | 0), w: 2 + ((rng() * 5) | 0), ph: rng() * TAU, sp: 0.4 + rng() * 0.9 });
    for (let i = 0; i < 30; i++) this.glints.push({ x: (rng() * W) | 0, y: SHORE_Y + 3 + ((rng() * 50) | 0), ph: rng() * TAU, sp: 0.5 + rng() * 1.5 });
  },

  drawSign(ctx, place) { const s = SIGNS[place]; drawSprite(ctx, SIGN_SPR, SIGN_PAL, s.x, s.y, s.flip); },
  signHit(place, x, y) { const s = SIGNS[place]; return Math.abs(x - (s.x + 6)) < 13 && Math.abs(y - (s.y + 6)) < 14; },

  draw(ctx, t) {
    const mxx = 236, my = 36, slow = Motion.reduced ? 0.3 : 1;
    // 달과 달무리
    ctx.fillStyle = '#c8d0ff';
    ctx.globalAlpha = 0.04; fillEllipse(ctx, mxx, my, 21, 21);
    ctx.globalAlpha = 0.07; fillEllipse(ctx, mxx, my, 13, 13);
    ctx.globalAlpha = 1; ctx.fillStyle = '#f4f0d8'; fillEllipse(ctx, mxx, my, 7, 7);
    ctx.fillStyle = '#d8d2b4'; ctx.fillRect(mxx - 3, my - 2, 2, 2); ctx.fillRect(mxx + 2, my + 1, 2, 1); ctx.fillRect(mxx - 1, my + 3, 1, 1);

    ctx.drawImage(this.water, 0, 0);

    // 물에 비친 별빛과 잔물결
    ctx.fillStyle = '#dfe8ff';
    for (const s of this.glints) { const a = Math.sin(t * s.sp * slow + s.ph); if (a > 0) { ctx.globalAlpha = a * 0.28; ctx.fillRect(s.x, s.y, 1, 1); } }
    ctx.fillStyle = '#8aa0e0';
    for (const r of this.ripples) { const a = Math.sin(t * r.sp * slow + r.ph); if (a > 0) { ctx.globalAlpha = a * 0.11; ctx.fillRect(r.x, r.y, r.w, 1); } }
    // 물에 비친 달빛 기둥(일렁임)
    ctx.fillStyle = '#f4f0d8';
    for (let y = SHORE_Y + 4; y < H - 2; y += 2) {
      const w = 3 + 5 * Math.abs(Math.sin(t * 1.3 * slow + y * 0.7)), off = Math.sin(t * 0.9 * slow + y * 0.45) * 3;
      ctx.globalAlpha = 0.08 + 0.42 * (1 - (y - SHORE_Y) / (H - SHORE_Y));
      ctx.fillRect(Math.round(mxx + off - w / 2), y, Math.round(w), 1);
    }
    ctx.globalAlpha = 1;

    ctx.drawImage(this.front, 0, 0);
    this.drawSign(ctx, 'lake');
  },
};

/* =====================================================================
 * Items — 고구마(불 속)와 마시멜로 꼬챙이(불 둘레). 모두가 함께 보는 상태
 * ===================================================================== */
const HALF_SPR = ['FYy', 'FYY', '.FF'];
const HALF_PAL = { F: P.foil, Y: P.potatoIn, y: P.potatoInHi };
const MUG_SPR = ['MMM.', 'RRRm', 'MMMm', 'MMM.'];
const MUG_PAL = { M: '#e8dcc8', R: '#c8463c', m: '#a89c8c' };

// 시계: 익는 시간은 서버 시각 기준으로 계산해야 모두에게 똑같이 보임
const Clock = { offset: 0, now() { return Date.now() + this.offset; } };

const Items = {
  // 불 속 고구마 자리(왼쪽 위 좌표)
  potatoSlots: [[151, 147], [158, 148], [165, 147]].slice(0, Math.max(1, Math.min(3, CONFIG.potatoMax))),
  // 꼬챙이 자리: 땅에 꽂는 곳(b) → 마시멜로가 있는 끝(t). side는 불의 왼쪽(-1)/오른쪽(1)
  marshSlots: [
    { bx: 143, by: 152, tx: 149, ty: 143, side: -1 },
    { bx: 177, by: 152, tx: 171, ty: 143, side: 1 },
    { bx: 136, by: 150, tx: 145, ty: 136, side: -1 },
    { bx: 184, by: 150, tx: 175, ty: 136, side: 1 },
  ].slice(0, Math.max(1, Math.min(4, CONFIG.marshmallowMax))),
  // 자리마다: at = 올린 시각(ms, 없으면 null), hide = 캐릭터가 올리는 중이라 아직 안 보임,
  //          ghost = 누가 집어 가는 중이라 잠깐 남겨 둔 모습
  slots: { potato: [], marsh: [] },
  fly: null, accSteam: 0,

  init() {
    const mk = () => ({ at: null, showAt: 0, hide: false, ghost: null, claim: false, item: 'marshmallow' });   // item: 꼬챙이에 꽂힌 것
    this.slots.potato = this.potatoSlots.map(mk);
    this.slots.marsh = this.marshSlots.map(mk);
  },

  slot(kind, i) { const a = this.slots[kind]; return a ? a[i] : undefined; },

  // 자리에 올라감(서버 알림 또는 내가 올림). delay는 남이 올리는 동작이 도착하길 잠깐 기다리는 시간
  setRow(kind, i, at, delay, item) {
    const s = this.slot(kind, i); if (!s) return;
    if (s.at === null) s.showAt = Clock.now() + (delay || 0);
    s.at = at; s.ghost = null; s.claim = false;
    s.item = item === 'fish' ? 'fish' : 'marshmallow';
  },
  itemOf(kind, i) { const s = this.slot(kind, i); return s ? s.item : 'marshmallow'; },
  // 꼬챙이에 꽂힌 것의 색(익은 정도)과 타기 시작하는 시간
  skewerColor(item, age) {
    if (item !== 'fish') return this.marshColor(age);
    const c = CONFIG.fishCookTime, b = CONFIG.fishBurnTime;
    return age < c ? mix(P.fishRaw, P.fishCooked, age / c) : mix(P.fishCooked, P.fishBurnt, (age - c) / (b - c));
  },
  burnTime(item) { return item === 'fish' ? CONFIG.fishBurnTime : CONFIG.marshmallowBurnTime; },
  // 자리에서 사라짐. 누가 가지러 오는 중일 수 있어 보이던 것은 잠깐 남겨 둠
  removeRow(kind, i) {
    const s = this.slot(kind, i); if (!s || s.at === null) return;
    if (this.visible(kind, i)) s.ghost = { age: this.age(kind, i), exp: Clock.now() + (s.claim ? 20000 : 1500), claimed: s.claim };
    s.claim = false; s.at = null; s.hide = false;
  },
  // 어떤 캐릭터가 이 자리 것을 가지러 감
  claim(kind, i) {
    const s = this.slot(kind, i); if (!s) return;
    if (s.ghost) { s.ghost.claimed = true; s.ghost.exp = Clock.now() + 20000; } else if (s.at !== null) s.claim = true;
  },
  clearGhost(kind, i) { const s = this.slot(kind, i); if (s) { s.ghost = null; s.claim = false; } },
  hide(kind, i) { const s = this.slot(kind, i); if (s) s.hide = true; },
  land(kind, i) { const s = this.slot(kind, i); if (s) s.hide = false; },

  visible(kind, i) {
    const s = this.slot(kind, i); if (!s) return false;
    if (s.ghost) return true;
    return s.at !== null && !s.hide && Clock.now() >= s.showAt;
  },
  age(kind, i) {
    const s = this.slot(kind, i); if (!s) return 0;
    if (s.ghost) return s.ghost.age;
    return s.at === null ? 0 : Math.max(0, (Clock.now() - s.at) / 1000);
  },
  free(kind) { return this.slots[kind].findIndex(s => s.at === null && !s.ghost && !s.hide); },
  // 집을 수 있는 상태인지(실제로 자리에 있고 화면에 보임)
  pickable(kind, i) { const s = this.slot(kind, i); return !!s && s.at !== null && !s.ghost && !s.claim && this.visible(kind, i); },
  isRipe(i) { return this.pickable('potato', i) && this.age('potato', i) >= CONFIG.potatoCookTime; },

  // 마시멜로 색: 흰색 → 노릇한 갈색 → 짙은 갈색
  marshColor(age) {
    const g = CONFIG.marshmallowGoldenTime, b = CONFIG.marshmallowBurnTime;
    if (age < g) return mix(P.marshWhite, P.marshGolden, age / g);
    if (age < b) return mix(P.marshGolden, P.marshBrown, (age - g) / (b - g));
    return mix(P.marshBrown, P.marshBurnt, (age - b) / 20);
  },

  // 고구마를 포물선으로 날리기(불에 넣을 때, 꺼낼 때)
  startFly(x0, y0, x1, y1, d, onDone) { this.fly = { x0, y0, x1, y1, d, age: 0, onDone }; },

  update(dt) {
    if (this.fly) {
      this.fly.age += dt;
      if (this.fly.age >= this.fly.d) { const f = this.fly; this.fly = null; if (f.onDone) f.onDone(); }
    }
    // 아무도 가지러 오지 않는 잔상은 곧 지움
    const now = Clock.now();
    for (const kind of ['potato', 'marsh']) for (const s of this.slots[kind]) if (s.ghost && now >= s.ghost.exp) s.ghost = null;

    // 다 익은 고구마의 김, 타기 직전 마시멜로의 작은 연기
    this.accSteam += dt * Motion.factor;
    if (this.accSteam > 0.4) {
      this.accSteam = 0;
      this.potatoSlots.forEach((p, i) => {
        if (this.isRipe(i)) Campfire.puff(p[0] + 2 + rand(-1, 1), p[1] - 1, rand(-1, 1), -rand(7, 10), 1.6, 1, 2, 0.55, '#ffffff');
      });
      this.marshSlots.forEach((s, i) => {
        if (this.visible('marsh', i) && this.age('marsh', i) > this.burnTime(this.itemOf('marsh', i)) && Math.random() < 0.6)
          Campfire.puff(s.tx, s.ty - 2, rand(-1, 1), -rand(5, 8), 1.8, 1, 2, 0.4, '#b0acc0');
      });
    }
  },

  // 은박지 고구마(반짝이는 하이라이트가 불빛에 따라 옮겨 다님)
  drawPotato(ctx, x, y, t, seed) {
    ctx.fillStyle = P.foil;
    ctx.fillRect(x + 1, y, 3, 1); ctx.fillRect(x, y + 1, 5, 1);
    ctx.fillStyle = P.foilShade; ctx.fillRect(x + 1, y + 2, 3, 1);
    ctx.fillStyle = '#ffb070'; ctx.fillRect(x + 2, y + 2, 1, 1);        // 불빛이 비친 자리
    const hl = [[1, 0], [2, 1], [3, 0], [3, 1]][((t * 2.5 + seed * 1.7) | 0) % 4];
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x + hl[0], y + hl[1], 1, 1);
  },

  drawPotatoes(ctx, t) {
    this.potatoSlots.forEach((s, i) => {
      if (!this.visible('potato', i)) return;
      this.drawPotato(ctx, s[0], s[1], t, i);
      if (this.isRipe(i)) { // "다 익었다" 반짝임
        const k = Math.sin(t * 4 + i);
        if (k > -0.3) {
          const cx = s[0] + 2, cy = s[1] - 3;
          ctx.fillStyle = '#fff8d0';
          ctx.fillRect(cx, cy, 1, 1);
          if (k > 0.3) { ctx.fillRect(cx - 1, cy, 3, 1); ctx.fillRect(cx, cy - 1, 1, 3); }
          if (k > 0.8) { ctx.fillRect(cx - 2, cy, 5, 1); ctx.fillRect(cx, cy - 2, 1, 5); }
        }
      }
    });
  },

  // 꼬챙이 하나(col이 없으면 나뭇가지만, item이 'fish'면 물고기)
  drawSkewer(ctx, bx, by, tx, ty, col, item) {
    ctx.fillStyle = P.stick;
    plotLine(ctx, bx, by, tx, ty);
    if (!col) return;
    tx = Math.round(tx); ty = Math.round(ty);
    if (item === 'fish') {   // 꼬챙이에 꿴 물고기: 몸통 5×3, 꼬리, 눈
      const dir = tx >= bx ? 1 : -1;   // 머리가 꼬챙이 끝 쪽
      ctx.fillStyle = col; ctx.fillRect(tx - 2, ty - 1, 5, 3);
      ctx.fillRect(tx - dir * 3, ty - 2, 1, 2); ctx.fillRect(tx - dir * 4, ty - 3, 1, 2);
      ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.35; ctx.fillRect(tx - 2, ty + 1, 5, 1);
      ctx.fillStyle = '#000000'; ctx.globalAlpha = 0.3; ctx.fillRect(tx - 2, ty - 1, 1, 1); ctx.fillRect(tx + 2, ty - 1, 1, 1);
      ctx.globalAlpha = 1; ctx.fillStyle = '#1a2030'; ctx.fillRect(tx + dir, ty, 1, 1);
      return;
    }
    ctx.fillStyle = col; ctx.fillRect(tx - 1, ty - 1, 3, 3);
    ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.45; ctx.fillRect(tx - 1, ty - 1, 1, 1);
    ctx.fillStyle = '#000000'; ctx.globalAlpha = 0.25; ctx.fillRect(tx + 1, ty + 1, 1, 1);
    ctx.globalAlpha = 1;
  },

  drawSkewers(ctx) {
    this.marshSlots.forEach((s, i) => {
      if (this.visible('marsh', i)) { const it = this.itemOf('marsh', i); this.drawSkewer(ctx, s.bx, s.by, s.tx, s.ty, this.skewerColor(it, this.age('marsh', i)), it); }
    });
  },

  drawFly(ctx, t) {
    const f = this.fly; if (!f) return;
    const k = f.age / f.d;
    this.drawPotato(ctx, Math.round(lerp(f.x0, f.x1, k)), Math.round(lerp(f.y0, f.y1, k) - Math.sin(Math.PI * k) * 10), t, 0);
  },

  // 누른 자리에 있는 아이템 찾기(손가락으로도 누르기 쉽게 넉넉한 범위)
  hitTest(x, y) {
    let best = null, bd = 9;
    this.marshSlots.forEach((s, i) => {
      if (!this.pickable('marsh', i)) return;
      const d = Math.hypot(x - s.tx, y - s.ty);
      if (d < bd) { bd = d; best = { type: 'marsh', index: i }; }
    });
    this.potatoSlots.forEach((s, i) => {
      if (!this.pickable('potato', i)) return;
      const d = Math.hypot(x - (s[0] + 2), y - (s[1] - 1));
      if (d < bd) { bd = d; best = { type: this.isRipe(i) ? 'potato' : 'potatoRaw', index: i }; } // 덜 익은 고구마는 따로 구분
    });
    return best;
  },
};

const CHAR_Y = 128;   // 앉은 스프라이트 위쪽 y(발끝이 152)
// 앉는 자리(스프라이트 왼쪽 x). 불 왼쪽·오른쪽을 번갈아 채움. 오른쪽 자리는 좌우를 뒤집어 불을 봄
const SEATS = [112, 192, 90, 214, 68, 236].slice(0, Math.max(1, Math.min(6, CONFIG.maxPlayers)));
const DEFAULT_OUTFIT = { hat: CONFIG.outfitColors.hat[0][0], coat: CONFIG.outfitColors.coat[0][0], pants: CONFIG.outfitColors.pants[0][0] };

// 캐릭터 한 명. 나(isMe)와 다른 접속자가 같은 클래스를 씀
class Actor {
  constructor(isMe) {
    this.isMe = isMe; this.id = ''; this.name = '';
    this.seat = 0; this.seated = true; this.homeX = SEATS[0]; this.homeFlip = false;
    this.place = 'camp';     // 지금 있는 곳: 'camp'(모닥불) 또는 'lake'(호수)
    this.fishing = null;     // 낚시 중일 때 찌 상태 { phase, p }
    this.pal = Object.assign({}, P.char);
    this.x = this.homeX; this.pose = 'sit'; this.flip = false; this.arm = 'rest'; this.eyes = 'open';
    this.headDx = 0; this.chew = 0; this.rise = 0;
    this.held = null; this.heldAge = 0; this.heldItem = 'marshmallow'; this.plant = null; this.plantSlot = null; this.mugOnLog = true;
    this.busy = false; this.waiting = false; this.state = 'idle'; this.script = null; this.si = 0; this.st = 0; this.stepDone = false;
    this.target = null;      // 지금 동작이 다루는 자리 { kind, slot, eat }
    this.walking = false; this.walkT = 0; this.bob = 0;
    this.blinkT = rand(CONFIG.blinkInterval[0], CONFIG.blinkInterval[1]); this.blinkHold = 0;
    this.warmT = rand(6, 12); this.warming = 0; this.steamAcc = 0;
    // 머리 위 이름표와 말풍선
    this.tag = document.createElement('div'); this.tag.className = 'tag';
    this.bubble = document.createElement('div'); this.bubble.className = 'bubble'; this.bubble.hidden = true;
    this.label = document.createElement('div'); this.label.className = 'name';
    this.tag.appendChild(this.bubble); this.tag.appendChild(this.label);
    this.tag.hidden = true; this.tagKey = ''; this.bubbleUntil = 0;
    document.getElementById('tags').appendChild(this.tag);
  }

  // 고른 색을 팔레트에 반영(밝은 쪽 색에서 그늘 쪽 색을 만들어 냄)
  setOutfit(o) {
    const c = this.pal;
    c.H = o.hat;   c.h = shade(o.hat, '#1a1030', 0.5);
    c.B = o.coat;  c.b = shade(o.coat, '#0a1028', 0.55);
    c.D = shade(o.coat, '#ffffff', 0.18); c.d = shade(c.b, '#ffffff', 0.12);
    c.L = o.pants; c.l = shade(o.pants, '#0a0a20', 0.5);
  }

  // 자리 정하기. null이면 자리가 없어 구경만 함
  setSeat(seat) {
    if (this.script) this.finish();
    this.seat = seat; this.seated = seat !== null && seat !== undefined && seat < SEATS.length;
    if (!this.seated) return;
    this.applyHome();
    this.x = this.homeX; this.flip = this.homeFlip; this.tagKey = '';
  }

  // 지금 있는 곳과 자리 번호로 앉을 위치를 정함
  applyHome() {
    if (!this.seated) return;
    if (this.place === 'lake') { this.homeX = LAKE_SEATS[this.seat]; this.homeFlip = false; }
    else { this.homeX = SEATS[this.seat]; this.homeFlip = this.homeX + 8 > CONFIG.fireX; }
  }

  // 걷는 과정 없이 바로 장소를 바꿈(다른 접속자의 위치를 맞출 때)
  setPlace(place) {
    if (this.script) this.finish();
    this.place = place; this.applyHome();
    this.x = this.homeX; this.flip = this.homeFlip; this.tagKey = '';
  }

  setName(name) { this.name = name; this.label.textContent = name; this.tagKey = ''; }
  say(text, time) { this.bubble.textContent = text; this.bubble.hidden = false; this.bubbleUntil = time + CONFIG.chatBubbleSeconds; this.tagKey = ''; }
  remove() { if (this.script) this.finish(); this.tag.remove(); }

  // ── 좌표 도우미 ──
  lx(col) { return Math.round(this.x) + (this.flip ? 15 - col : col); }       // 캐릭터 안쪽 열 → 화면 x
  mx(x) { return this.homeFlip ? 304 - x : x; }                               // 불 오른쪽 자리면 좌우 대칭 위치
  originY() { return this.pose === 'stand' ? CHAR_Y - 2 + this.rise + this.walkBob() : CHAR_Y + this.bob; }
  walkBob() { return (this.walking && ((this.walkT * 5) | 0) % 2 === 0) ? 1 : 0; }

  // ── 상태 머신: 동작은 "단계(step)" 목록이고, 다 끝나면 기본 상태로 돌아감 ──
  run(name, steps, target) {
    if (this.script) this.finish();
    this.state = name; this.script = steps; this.si = 0; this.st = 0; this.stepDone = false;
    this.target = target || null;
    this.busy = true; this.warming = 0; this.eyes = 'open';
    if (steps[0].enter) steps[0].enter();
  }
  finish() {
    // 동작이 중간에 끊겨도 자리 상태가 꼬이지 않게 정리
    if (this.target) { if (this.target.eat) Items.clearGhost(this.target.kind, this.target.slot); else Items.land(this.target.kind, this.target.slot); }
    this.target = null;
    this.script = null; this.state = 'idle'; this.busy = false;
    this.x = this.homeX; this.pose = 'sit'; this.flip = this.homeFlip; this.arm = 'rest'; this.eyes = 'open';
    this.headDx = 0; this.chew = 0; this.rise = 0; this.held = null; this.plant = null; this.walking = false; this.mugOnLog = true;
    this.fishing = null;
    if (this.isMe) { Scene.fade = 0; Scene.place = this.place; }
    this.warmT = rand(CONFIG.warmHandsInterval[0], CONFIG.warmHandsInterval[1]);
  }

  // 단계 만들기 도우미
  set(d, props, extra) { const s = { d, enter: () => Object.assign(this, props) }; return Object.assign(s, extra || {}); }
  standUp() { return { d: 0.4, enter: () => { this.pose = 'stand'; }, update: p => { this.rise = p < 0.5 ? 1 : 0; } }; }
  sitDown(arm) { return { d: 0.35, enter: () => { this.pose = 'sit'; this.flip = this.homeFlip; this.walking = false; this.x = this.homeX; this.arm = arm || 'rest'; } }; }
  walkTo(target, speed) {   // target은 x좌표 또는 x좌표를 돌려주는 함수(도착할 때 정해지는 자리용)
    let tx = 0;
    return {
      d: Infinity,
      enter: () => { tx = typeof target === 'function' ? target() : target; this.pose = 'stand'; this.walking = true; this.walkT = 0; if (tx !== this.x) this.flip = tx < this.x; },
      update: (p, dt) => {
        const dir = Math.sign(tx - this.x), step = (speed || CONFIG.walkSpeed) * dt;
        if (Math.abs(tx - this.x) <= step) { this.x = tx; this.stepDone = true; }
        else this.x += dir * step;
        this.walkT += dt;
      },
      exit: () => { this.walking = false; },
    };
  }

  // 다른 접속자의 동작을 이름으로 실행
  perform(kind, slot) {
    if (kind === 'tea') this.drinkTea();
    else if (kind === 'notYet') this.notYet();
    else if (kind === 'putPotato') this.putPotato(slot);
    else if (kind === 'eatPotato') this.eatPotato(slot);
    else if (kind === 'plantMarsh') this.plantMarsh(slot);
    else if (kind === 'plantFish') this.plantMarsh(slot, 'fish');
    else if (kind === 'eatMarsh') this.eatMarsh(slot);
    else if (kind === 'go') this.goTo(slot);
    else if (kind === 'fish') this.goFishing(slot / 10);
  }

  // ── 표지판을 따라 다른 곳으로 걸어가기(화면 전환) ──
  goTo(dest) {
    if (dest !== 'camp' && dest !== 'lake' || dest === this.place) return;
    const edge = p => p === 'camp' ? 326 : -22;   // 모닥불은 오른쪽 끝, 호수는 왼쪽 끝으로 드나듦
    const steps = [this.standUp(), this.walkTo(edge(this.place), CONFIG.travelSpeed)];
    if (this.isMe) steps.push({ d: 0.8, update: p => { Scene.fade = p; } });            // 화면이 천천히 어두워짐
    steps.push({ d: 0.05, enter: () => {
      this.place = dest; this.applyHome(); this.x = edge(dest); this.tagKey = '';
      if (this.isMe) { Scene.place = dest; Net.track(); }
    } });
    if (this.isMe) steps.push({ d: 0.8, update: p => { Scene.fade = 1 - p; } });        // 다시 밝아짐
    steps.push(this.walkTo(() => this.homeX, CONFIG.travelSpeed), this.sitDown());
    this.run('go', steps);
  }

  // ── 낚시: 던지고, 기다리고, 입질이 오면 알아서 낚아 올림(실패 없음) ──
  goFishing(wait) {
    if (this.place !== 'lake') return;
    wait = Math.max(CONFIG.fishWait[0], Math.min(CONFIG.fishWait[1], wait || CONFIG.fishWait[0]));
    this.run('fish', [
      this.set(0.5, { arm: 'hold', held: 'rod' }),
      { d: 0.7, enter: () => { this.arm = 'reach'; this.fishing = { phase: 'cast', p: 0 }; }, update: p => { this.fishing.p = p; } },
      { d: wait, enter: () => { this.arm = 'hold'; this.fishing.phase = 'wait'; } },          // 찌를 바라보며 기다림
      { d: 0.9, enter: () => { this.fishing.phase = 'bite'; } },                               // 입질: 찌가 쑥 들어감
      { d: 0.6, enter: () => { this.arm = 'reach'; this.fishing.phase = 'reel'; this.fishing.p = 0; }, update: p => { this.fishing.p = p; } },
      { d: 1.4, enter: () => { this.fishing = null; this.held = 'fish'; this.arm = 'hold'; this.eyes = 'happy'; if (this.isMe) UI.addFish(); } },
      this.set(0.4, { held: null, arm: 'rest' }),
    ]);
  }

  // 찌가 떠 있는 자리
  bobberSpot() { return [this.homeX + 23, 158 + (this.seat % 2) * 2]; }   // 낚시터 앞쪽 물

  // ── 차 마시기(약 7.5초) ──
  drinkTea() {
    const sip = () => [this.set(0.6, { arm: 'cupMouth', headDx: -1 }), this.set(0.45, { arm: 'cupLap', headDx: 0 })];
    this.run('tea', [
      this.set(0.6, { arm: 'back' }),                                        // 옆에 둔 머그컵으로 손을 뻗음
      this.set(0.8, { arm: 'cupLap', held: 'mug', mugOnLog: false }),        // 집어 들면 김이 모락모락
      ...sip(), ...sip(), ...sip(),                                          // 홀짝 3번(고개가 살짝 뒤로)
      { d: 1.2, enter: () => {                                               // "후—" 입김, 편안한 표정
          this.eyes = 'happy';
          const n = Motion.reduced ? 2 : 6, dir = this.flip ? -1 : 1;
          for (let i = 0; i < n; i++) Campfire.puff(this.lx(13) + dir * i * 0.6, CHAR_Y + 9, dir * rand(7, 13), rand(-2.5, 0), rand(0.8, 1.3), 1, 3, 0.5, '#ffffff');
        } },
      this.set(1.2, { arm: 'cupLap' }),                                      // 컵을 무릎 위에 둔 채 잠깐
      this.set(0.55, { arm: 'back', held: null, mugOnLog: true }),           // 내려놓기
    ]);
  }

  // ── 고구마 넣기 ──
  putPotato(i) {
    const slot = Items.potatoSlots[i]; if (!slot) return;
    Items.hide('potato', i);                                                 // 던져 넣기 전까지는 불 속에 안 보임
    this.run('potato', [
      this.set(0.9, { arm: 'hold', held: 'potato' }),                        // 은박지 고구마를 꺼내 듦
      this.standUp(),
      this.walkTo(this.mx(122)),
      this.set(0.3, {}),
      { d: 0.7, enter: () => {                                               // 불 속으로 살짝 던짐
          const h = [this.lx(12), this.originY() + 11];
          this.held = null; this.arm = 'reach';
          Items.startFly(h[0], h[1], slot[0], slot[1], 0.6, () => {
            Items.land('potato', i);
            Campfire.burst(14, slot[0] + 2, slot[1] - 1);                    // 불티가 확 튐
          });
        } },
      this.set(0.7, { arm: 'rest' }),
      this.walkTo(this.homeX),
      this.sitDown(),
    ], { kind: 'potato', slot: i, eat: false });
  }

  // ── 다 익은 고구마 꺼내 먹기 ──
  eatPotato(i) {
    const slot = Items.potatoSlots[i]; if (!slot) return;
    const bite = held => [this.set(0.45, { arm: 'mouth', held }), this.set(0.45, { arm: 'hold', chew: 1 }, { exit: () => { this.chew = 0; } })];
    this.run('eatPotato', [
      this.standUp(),
      this.walkTo(this.mx(124)),
      { d: 0.6, enter: () => {                                               // 불에서 꺼냄
          this.arm = 'down';
          Items.clearGhost('potato', i);
          Campfire.burst(5, slot[0] + 2, slot[1] - 1);
          Items.startFly(slot[0], slot[1], this.lx(12), this.originY() + 11, 0.55, null);
        }, exit: () => { this.arm = 'hold'; this.held = 'potato'; } },
      this.set(0.3, {}),
      this.walkTo(this.homeX),
      this.sitDown('hold'),
      this.set(0.5, {}),
      this.set(0.9, { held: 'halves' }),                                     // 반으로 갈라 노란 속을 보임
      ...bite('halves'), ...bite('half'), ...bite('half'),
      this.set(1.4, { arm: 'rest', held: null, eyes: 'happy' }),
    ], { kind: 'potato', slot: i, eat: true });
  }

  // ── 덜 익은 고구마를 눌렀을 때: "아직이야" 하고 고개를 젓기 ──
  notYet() {
    this.run('notYet', [
      this.set(0.22, { headDx: -1 }), this.set(0.22, { headDx: 1 }),
      this.set(0.22, { headDx: -1 }), this.set(0.22, { headDx: 1 }),
      this.set(0.3, { headDx: 0 }),
    ]);
  }

  // 꼬챙이를 꽂거나 뽑을 때 서는 자리
  skewerSpot(slot) { return slot.side < 0 ? 120 : 185; }

  // ── 마시멜로(또는 잡아 온 물고기) 꽂기 ──
  plantMarsh(i, item) {
    const slot = Items.marshSlots[i]; if (!slot) return;
    Items.hide('marsh', i);                                                  // 꽂기 전까지는 자리에 안 보임
    this.run('marsh', [
      this.set(0.7, { arm: 'hold', held: 'stick' }),                         // 나뭇가지 꼬챙이
      this.set(0.8, { held: 'stickM', heldAge: 0, heldItem: item === 'fish' ? 'fish' : 'marshmallow' }),   // 마시멜로나 물고기를 끼움
      this.standUp(),
      this.walkTo(this.skewerSpot(slot)),
      { d: 0.3, enter: () => { this.flip = slot.side > 0; this.arm = 'down'; } },
      { d: 0.7, enter: () => { this.plantSlot = slot; this.plant = 0; },     // 땅에 비스듬히 꽂음
        update: p => { this.plant = p; },
        exit: () => { this.plant = null; this.held = null; Items.land('marsh', i); } },
      this.set(0.5, { arm: 'rest' }),
      this.walkTo(this.homeX),
      this.sitDown(),
    ], { kind: 'marsh', slot: i, eat: false });
  }

  // ── 꽂힌 마시멜로 가져와 먹기 ──
  eatMarsh(i) {
    const slot = Items.marshSlots[i]; if (!slot) return;
    this.run('eatMarsh', [
      this.standUp(),
      this.walkTo(this.skewerSpot(slot)),
      { d: 0.3, enter: () => { this.flip = slot.side > 0; this.arm = 'down'; } },
      { d: 0.6, enter: () => {                                               // 뽑아 듦
          this.heldAge = Items.age('marsh', i); this.heldItem = Items.itemOf('marsh', i); Items.clearGhost('marsh', i);
          this.held = 'stickM'; this.plantSlot = slot; this.plant = 1;
        },
        update: p => { this.plant = 1 - p; },
        exit: () => { this.plant = null; this.arm = 'hold'; } },
      this.set(0.3, {}),
      this.walkTo(this.homeX),
      this.sitDown('hold'),
      this.set(0.5, {}),
      this.set(0.7, { arm: 'mouth' }),                                       // 한 입
      this.set(0.3, { arm: 'hold', held: 'stick', chew: 1 }),
      this.set(0.3, { chew: 0 }), this.set(0.3, { chew: 1 }), this.set(0.3, { chew: 0 }),
      this.set(1.3, { arm: 'rest', held: null, eyes: 'happy' }),
    ], { kind: 'marsh', slot: i, eat: true });
  }

  update(dt, t) {
    if (!this.seated) return;
    // 숨쉬기: 앉아 있을 때 윗몸이 1px 오르내림(자리마다 박자가 조금 다름)
    this.bob = (this.pose === 'sit' && Math.sin(t * TAU / CONFIG.breathPeriod + this.seat * 0.9) < 0) ? 1 : 0;

    // 눈 깜빡임(3~6초마다)
    if (this.blinkHold > 0) this.blinkHold -= dt;
    this.blinkT -= dt;
    if (this.blinkT <= 0) { this.blinkHold = 0.16; this.blinkT = rand(CONFIG.blinkInterval[0], CONFIG.blinkInterval[1]); }

    if (this.script) {
      // 진행 중인 동작의 현재 단계
      const step = this.script[this.si];
      this.st += dt;
      if (step.update) step.update(Math.min(1, this.st / step.d), dt);
      if (this.st >= step.d || this.stepDone) {
        if (step.exit) step.exit();
        this.si++; this.st = 0; this.stepDone = false;
        if (this.si >= this.script.length) this.finish();
        else if (this.script[this.si].enter) this.script[this.si].enter();
      }
    } else {
      // 기본 상태: 가끔 손을 불 쪽으로 뻗어 쬐기
      if (this.warming > 0) {
        this.warming -= dt; this.arm = 'reach';
        if (this.warming <= 0) { this.arm = 'rest'; this.warmT = rand(CONFIG.warmHandsInterval[0], CONFIG.warmHandsInterval[1]); }
      } else {
        this.warmT -= dt;
        if (this.warmT <= 0) this.warming = 3.5;
      }
    }

    // 손에 든 뜨거운 것에서 올라오는 김
    if (this.held === 'mug' || this.held === 'halves' || this.held === 'half') {
      this.steamAcc += dt * Motion.factor;
      if (this.steamAcc > 0.22) {
        this.steamAcc = 0;
        const a = ARMS[this.arm].item;
        Campfire.puff(this.lx(a[0] + 1) + rand(-1, 1), this.originY() + a[1] - 1, rand(-1, 1), -rand(5, 8), rand(0.9, 1.4), 1, 2, 0.5, '#ffffff');
      }
    }
  }

  // 통나무 의자와 그 위의 머그컵(불에서 먼 자리일수록 어둡게)
  drawLog(ctx) {
    if (!this.seated) return;
    if (this.place === 'lake') {   // 낚시터에서는 나무 상자에 앉음
      const x0 = this.homeX - 1, y = CHAR_Y + 19;
      ctx.fillStyle = '#4a3626'; ctx.fillRect(x0, y, 12, 5);
      ctx.fillStyle = '#6a5038'; ctx.fillRect(x0, y, 12, 1);
      ctx.fillStyle = '#2e2219'; ctx.fillRect(x0, y, 1, 5); ctx.fillRect(x0 + 11, y, 1, 5); ctx.fillRect(x0 + 1, y + 2, 10, 1);
      return;
    }
    const hf = this.homeFlip, y0 = CHAR_Y + 19, w = 18;
    const wx = c => this.homeX + (hf ? 15 - c : c);
    const far = Math.min(2, (this.seat / 2) | 0);
    const body = [['#2a1c18', '#49301f', '#6a4428'], ['#201614', '#33221a', '#49301f'], ['#181110', '#231814', '#33221a']][far];
    const top = [['#3a2820', '#5e4028', '#8a5c34'], ['#2a1e1a', '#42301f', '#5e4028'], ['#1e1614', '#2e201a', '#42301f']][far];
    for (let i = 0; i < w; i++) {
      const k = i / w, j = k < 0.35 ? 0 : k < 0.7 ? 1 : 2; // 불에 가까운 쪽일수록 밝게
      ctx.fillStyle = body[j]; ctx.fillRect(wx(i - 7), y0, 1, 5);
      ctx.fillStyle = top[j]; ctx.fillRect(wx(i - 7), y0, 1, 1);
    }
    ctx.fillStyle = '#1e1412';
    for (let c = -4; c < 0; c++) ctx.fillRect(wx(c), y0 + 2, 1, 1);
    for (let c = 2; c < 7; c++) ctx.fillRect(wx(c), y0 + 3, 1, 1);
    for (let c = -7; c < 11; c++) ctx.fillRect(wx(c), y0 + 4, 1, 1);
    ctx.fillStyle = ['#b08a58', '#86683f', '#5e4a30'][far];               // 잘린 단면
    ctx.fillRect(wx(11), y0, 1, 5); ctx.fillRect(wx(12), y0, 1, 5);
    ctx.fillStyle = ['#8a6238', '#664a2c', '#463420'][far];
    ctx.fillRect(wx(11), y0 + 2, 1, 1); ctx.fillRect(wx(12), y0 + 4, 1, 1);
    if (this.mugOnLog) drawSprite(ctx, MUG_SPR, MUG_PAL, hf ? this.homeX + 15 : this.homeX - 3, y0 - 4, hf);
  }

  draw(ctx, t) {
    if (!this.seated) return;
    const pal = this.pal, x = Math.round(this.x), f = this.flip;
    // 밝은 쪽(대문자)이 항상 불을 향하도록, 필요할 때 밝은 쪽/그늘 쪽 색을 맞바꿈
    const sw = (!f) !== (this.place === 'lake' ? true : x + 8 < CONFIG.fireX);   // 호수에서는 달빛이 오른쪽에서 옴
    let oy;
    if (this.pose === 'sit') {
      oy = CHAR_Y + this.bob;
      drawSprite(ctx, SIT_TORSO, pal, x, oy + 10, f, sw);
      drawSprite(ctx, SIT_LEGS, pal, x, CHAR_Y + 17, f, sw);  // 다리는 숨쉬기와 상관없이 고정
    } else {
      const base = CHAR_Y - 2 + this.rise;
      oy = base + this.walkBob();
      const legs = (this.walking && ((this.walkT * 5) | 0) % 2 === 1) ? LEGS_B : LEGS_A;
      drawSprite(ctx, STAND_TORSO, pal, x, oy + 10, f, sw);
      drawSprite(ctx, legs, pal, x, base + 20, f, sw);
    }

    // 머리(차를 마실 때는 살짝 뒤로, 씹을 때는 1px 아래로)
    const hx = x + (f ? -this.headDx : this.headDx), hy = oy + this.chew;
    drawSprite(ctx, HEAD, pal, hx, hy, f, sw);
    const ex = c => hx + (f ? 15 - c : c);
    if (this.eyes === 'happy') {                 // ^^ 모양
      ctx.fillStyle = pal.E;
      ctx.fillRect(ex(9), hy + 7, 1, 1); ctx.fillRect(ex(10), hy + 6, 1, 1); ctx.fillRect(ex(11), hy + 7, 1, 1);
    } else if (this.blinkHold > 0) {             // 깜빡
      ctx.fillStyle = '#8a5a48';
      ctx.fillRect(ex(9), hy + 7, 1, 1); ctx.fillRect(ex(10), hy + 7, 1, 1);
    } else {
      ctx.fillStyle = pal.E;
      ctx.fillRect(ex(10), hy + 6, 1, 2);
    }

    // 팔
    const arm = ARMS[this.arm];
    for (const p of arm.px) {
      let ch = p[2];
      if (sw) { const u = ch.toUpperCase(); ch = ch === u ? ch.toLowerCase() : u; }
      ctx.fillStyle = pal[ch];
      ctx.fillRect(this.lx(p[0]), oy + p[1], 1, 1);
    }

    // 손에 든 것
    const ix = w => x + (f ? 15 - arm.item[0] - (w - 1) : arm.item[0]), iy = oy + arm.item[1];
    if (this.held === 'mug') drawSprite(ctx, MUG_SPR, MUG_PAL, ix(4), iy, f);
    else if (this.held === 'potato') Items.drawPotato(ctx, ix(5), iy, t, 1);
    else if (this.held === 'halves') { drawSprite(ctx, HALF_SPR, HALF_PAL, ix(3), iy, f); drawSprite(ctx, HALF_SPR, HALF_PAL, ix(3) + (f ? -4 : 4), iy, !f); }
    else if (this.held === 'half') drawSprite(ctx, HALF_SPR, HALF_PAL, ix(3), iy, f);
    else if (this.held === 'fish') drawSprite(ctx, FISH_SPR, FISH_PAL, ix(7), iy, f);
    else if (this.held === 'rod') {
      // 낚싯대와 낚싯줄, 찌
      const dir = f ? -1 : 1, hx0 = this.lx(arm.hand[0]), hy0 = oy + arm.hand[1];
      const tipX = hx0 + dir * (this.arm === 'reach' ? 11 : 9), tipY = hy0 - (this.arm === 'reach' ? 9 : 15);
      ctx.fillStyle = '#8a6a44'; plotLine(ctx, hx0, hy0, tipX, tipY);
      const fs = this.fishing;
      if (fs) {
        const spot = this.bobberSpot();
        let bx = spot[0], by = spot[1], fish = false;
        if (fs.phase === 'cast') { bx = lerp(tipX, spot[0], fs.p); by = lerp(tipY, spot[1], fs.p) - Math.sin(Math.PI * fs.p) * 8; }
        else if (fs.phase === 'wait') by += Math.sin(t * 2 + this.seat) > 0 ? 0 : 1;            // 잔잔히 까딱임
        else if (fs.phase === 'bite') by += 1 + (((t * 8) | 0) % 2);                             // 쑥 들어갔다 나왔다
        else { fish = true; bx = lerp(spot[0], hx0 + dir * 3, fs.p); by = lerp(spot[1], hy0 - 4, fs.p) - Math.sin(Math.PI * fs.p) * 10; }
        bx = Math.round(bx); by = Math.round(by);
        ctx.fillStyle = '#c8d0e8'; ctx.globalAlpha = 0.45; plotLine(ctx, tipX, tipY, bx, by); ctx.globalAlpha = 1;
        if (fish) drawSprite(ctx, FISH_SPR, FISH_PAL, bx - 3, by - 1, false);
        else {
          ctx.fillStyle = '#e8503c'; ctx.fillRect(bx, by - 1, 2, 1);
          ctx.fillStyle = '#f4f0e8'; ctx.fillRect(bx, by, 2, 1);
          if (fs.phase !== 'cast') {   // 찌 둘레 물결(입질 때 더 넓게)
            const wide = fs.phase === 'bite' ? 5 + (((t * 6) | 0) % 3) * 2 : 3;
            ctx.fillStyle = '#8aa0e0'; ctx.globalAlpha = fs.phase === 'bite' ? 0.6 : 0.3;
            ctx.fillRect(bx + 1 - wide, spot[1] + 2, wide * 2, 1); ctx.globalAlpha = 1;
          }
        }
      }
    }
    else if (this.held === 'stick' || this.held === 'stickM') {
      const dir = f ? -1 : 1, hand = [this.lx(arm.hand[0]), oy + arm.hand[1]];
      let bx, by, tx, ty;
      if (this.arm === 'mouth') { tx = this.lx(13); ty = oy + 8; bx = tx + dir * 4; by = ty + 5; }   // 입으로 가져감
      else { bx = hand[0]; by = hand[1] + 1; tx = bx + dir * 5; ty = by - 8; }
      if (this.plant !== null && this.plantSlot) {   // 꽂는(뽑는) 중: 손 ↔ 꽂힌 자리 사이를 이동
        const s = this.plantSlot, p = this.plant;
        bx = lerp(bx, s.bx, p); by = lerp(by, s.by, p); tx = lerp(tx, s.tx, p); ty = lerp(ty, s.ty, p);
      }
      Items.drawSkewer(ctx, bx, by, tx, ty, this.held === 'stickM' ? Items.skewerColor(this.heldItem, this.heldAge) : null, this.heldItem);
    }
  }
}

/* =====================================================================
 * Merchant — 가끔 모닥불에 찾아오는 떠돌이 상인
 *   오는 때는 서버 시각으로 계산하므로 모두에게 같은 때에 나타남(저장하는 것 없음)
 * ===================================================================== */
const SHOP = [
  { kind: 'firework', name: '폭죽', obj: '폭죽을', desc: '밤하늘에 조용한 불꽃 세 송이' },
  { kind: 'meteor', name: '별똥별 무리', obj: '별똥별 무리를', desc: '한동안 별똥별이 여럿 떨어져요' },
  { kind: 'aurora', name: '오로라', obj: '오로라를', desc: '1분 동안 하늘에 오로라가 일렁여요' },
];

const Merchant = {
  npc: null, state: 'away', force: false, standX: 257,

  init() {
    const n = this.npc = new Actor(false);
    n.setOutfit({ hat: '#5a3a7a', coat: '#6a4a8a', pants: '#3a3050' });
    n.pal.P = n.pal.H; n.pal.p = n.pal.h; n.pal.W = '#7a5a9a'; n.pal.w = '#4a3466';   // 방울 없는 두건
    n.setName('떠돌이 상인');
    n.pose = 'stand'; n.flip = true; n.arm = 'hold'; n.x = 326;
    // 주소 끝에 ?merchant 를 붙이면 상인이 바로 와 있음(시험용)
    try { this.force = /[?&]merchant\b/.test(location.search); } catch (e) { this.force = false; }
  },

  // 주기마다 한 번, 그 안에서 오는 때는 주기 번호로 정해지는 값
  scheduled(now) {
    const cycle = CONFIG.merchantCycleMinutes * 60000, stay = Math.min(cycle, CONFIG.merchantStayMinutes * 60000);
    const n = Math.floor(now / cycle), start = n * cycle + mulberry32(n)() * (cycle - stay);
    return now >= start && now < start + stay;
  },

  present() { return this.state === 'here'; },

  update(dt) {
    const n = this.npc, want = this.force || this.scheduled(Clock.now()), speed = CONFIG.walkSpeed * 1.4;
    if (this.state === 'away') {
      if (want) { this.state = 'arriving'; n.x = 326; n.flip = true; n.walking = true; n.walkT = 0; if (Setup.started) UI.flash('떠돌이 상인이 모닥불에 찾아왔어요'); }
    } else if (this.state === 'arriving') {
      n.walkT += dt; n.x -= speed * dt;
      if (n.x <= this.standX) { n.x = this.standX; n.walking = false; this.state = 'here'; }
    } else if (this.state === 'here') {
      if (!want) { this.state = 'leaving'; n.flip = false; n.walking = true; n.walkT = 0; UI.closeShop(); }
    } else {
      n.walkT += dt; n.x += speed * dt;
      if (n.x >= 326) { n.walking = false; this.state = 'away'; }
    }
  },

  hit(x, y) { return this.present() && Math.abs(x - (this.npc.x + 8)) < 13 && y > CHAR_Y - 8 && y < 158; },

  draw(ctx, t) {
    if (this.state === 'away') return;
    const n = this.npc, x = Math.round(n.x), oy = CHAR_Y - 2 + n.walkBob();
    // 등짐(몸 뒤쪽)
    const bx = n.flip ? x + 11 : x + 1;
    ctx.fillStyle = '#5a4028'; ctx.fillRect(bx, oy + 11, 4, 8);
    ctx.fillStyle = '#b0523c'; ctx.fillRect(bx, oy + 9, 4, 2);
    ctx.fillStyle = '#3a2a1c'; ctx.fillRect(bx, oy + 15, 4, 1);
    n.draw(ctx, t);
    // 등불(손에 든 쪽)
    const lx = n.lx(13), ly = oy + 13, on = Math.sin(t * 7) > -0.6;
    ctx.fillStyle = '#3a2a1c'; ctx.fillRect(lx, ly - 1, 1, 1); ctx.fillRect(lx - 1, ly, 3, 1); ctx.fillRect(lx - 1, ly + 4, 3, 1);
    ctx.fillStyle = on ? '#ffe08a' : '#ffc84a'; ctx.fillRect(lx - 1, ly + 1, 3, 3);
    ctx.fillStyle = '#fff6d0'; ctx.fillRect(lx, ly + 2, 1, 1);
  },

  // 등불 빛 번짐
  drawGlow(ctx, t) {
    if (this.state === 'away') return;
    const n = this.npc, f = 0.9 + 0.1 * Math.sin(t * 5.1);
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#ffb84a';
    ctx.globalAlpha = 0.05 * f; fillEllipse(ctx, n.lx(13), CHAR_Y + 13, 15 * f, 15 * f);
    ctx.globalAlpha = 0.08 * f; fillEllipse(ctx, n.lx(13), CHAR_Y + 13, 8 * f, 8 * f);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  },
};

/* =====================================================================
 * Buddy — 모닥불 구석의 깨알 손님: 동그란 주황색 친구(안테나 끝에 반짝이는 별)
 *   퇴근하고 불멍 왔다면서 노트북을 못 놓는 직장인. 누르면 한마디 함(내 화면에서만)
 * ===================================================================== */
const BUDDY_SPR = [
  '............',
  '......A.....',
  '......A.....',
  '....LOOOO...',
  '..LLOOOOOO..',
  '.LLOOOOOOOo.',
  '.LOOOOOOOOo.',
  '.LOOROOOORo.',
  '.OOOOOOOOoo.',
  '..OOOOOOoo..',
  '...oooooo...',
  '...o....o...',
];
const BUDDY_PAL = { O: '#e8823a', o: '#b85c26', L: '#f4a45c', R: '#f0a08a', A: '#8a5a34' };
const BUDDY_LINES = [
  '오늘은 퇴근했어요. 진짜로요.',
  '회의록 v5는… 내일 쓸게요.',
  '미워할 수가 없거든요.',
  '사직서요? 반려됐어요.',
  '불멍 중에도 요약은 하고 싶네요.',
  '고구마 익으면 알려 주세요.',
  '13번 슬라이드는 안 넘쳤겠죠…?',
