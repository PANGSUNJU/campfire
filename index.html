<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모닥불 멍</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05071a; }
  body { position: fixed; inset: 0; touch-action: manipulation; -webkit-user-select: none; user-select: none;
         -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  /* 확대해서 보여 주는 큰 캔버스: 픽셀이 뭉개지지 않게 */
  #view { position: absolute; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
  /* 하단 버튼 줄 */
  #bar { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; white-space: nowrap; }
  .px { display: flex; align-items: center; gap: 6px; min-height: 44px; margin: 3px; padding: 6px 12px 6px 8px;
        border: 0; border-radius: 0; background: #1d1b38; color: #f4e6c8; font: bold 14px/1 inherit; font-family: inherit;
        cursor: pointer; transition: opacity .35s;
        /* 도트 테두리: 모서리가 한 칸 비는 픽셀 테두리 */
        box-shadow: 0 -3px 0 #7c70b0, -3px 0 0 #7c70b0, 3px 0 0 #3b3364, 0 3px 0 #3b3364; }
  .px canvas { width: 28px; height: 28px; image-rendering: crisp-edges; image-rendering: pixelated; }
  .px:active:not(:disabled) { transform: translateY(2px); }
  .px:disabled { opacity: .4; cursor: default; }
  .px:focus-visible { outline: 2px solid #ffd84a; outline-offset: 4px; }
  #sound { position: absolute; top: 10px; right: 10px; min-height: 40px; padding: 6px; margin: 3px; }
  #sound canvas { width: 24px; height: 24px; }
  /* 캐릭터 머리 위 이름표 */
  #nameTag { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
             color: #f4e6c8; font: bold 12px/1.2 inherit; font-family: inherit; text-shadow: 1px 1px 0 #05071a, -1px 0 0 #05071a, 0 -1px 0 #05071a; }
  /* 첫 진입 설정 창 */
  #setup { position: absolute; inset: 0; z-index: 5; display: flex; overflow: auto; background: rgba(5, 7, 26, .72); }
  #setup[hidden] { display: none; }
  #setup .panel { margin: auto; width: min(330px, calc(100% - 40px)); padding: 14px 16px 16px; background: #1d1b38; color: #f4e6c8;
                  box-shadow: 0 -3px 0 #7c70b0, -3px 0 0 #7c70b0, 3px 0 0 #3b3364, 0 3px 0 #3b3364; }
  #setup h1 { margin: 0 0 8px; font-size: 18px; text-align: center; }
  #preview { display: block; margin: 0 auto 8px; width: 64px; height: 96px; image-rendering: crisp-edges; image-rendering: pixelated; }
  #setup label, #setup .lab { display: block; margin: 8px 0 4px; font-size: 13px; font-weight: bold; }
  #nameInput { box-sizing: border-box; width: 100%; padding: 8px; border: 0; border-radius: 0; background: #0e0d22; color: #f4e6c8;
               font: 16px/1.2 inherit; font-family: inherit; box-shadow: 0 0 0 2px #3b3364; }
  #nameInput:focus { outline: 2px solid #ffd84a; }
  .sws { display: flex; flex-wrap: wrap; gap: 7px; }
  .sw { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 0; cursor: pointer; box-shadow: 0 0 0 2px #3b3364; }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px #1d1b38, 0 0 0 4px #ffd84a; }
  .sw:focus-visible { outline: 2px solid #ffffff; outline-offset: 4px; }
  #btnStart { margin: 16px auto 0; padding: 6px 22px; justify-content: center; }
  @media (max-width: 380px) { #bar { gap: 9px; } .px { font-size: 12px; padding: 6px 8px 6px 6px; gap: 4px; } .px canvas { width: 24px; height: 24px; } }
</style>
</head>
<body>
<canvas id="view" aria-label="밤 숲속 모닥불 장면"></canvas>
<button id="sound" class="px" aria-label="소리 켜기/끄기" aria-pressed="false"><canvas width="12" height="12"></canvas></button>
<div id="nameTag"></div>
<div id="bar" style="visibility:hidden">
  <button id="btnPotato" class="px"><canvas width="16" height="16"></canvas><span>고구마</span></button>
  <button id="btnMarsh" class="px"><canvas width="16" height="16"></canvas><span>마시멜로</span></button>
  <button id="btnTea" class="px"><canvas width="16" height="16"></canvas><span>차 마시기</span></button>
</div>
<div id="setup" role="dialog" aria-label="캐릭터 설정">
  <div class="panel">
    <h1>모닥불 멍</h1>
    <canvas id="preview" width="16" height="24" aria-label="캐릭터 미리 보기"></canvas>
    <label for="nameInput">이름</label>
    <input id="nameInput" type="text" placeholder="이름을 적어 주세요" autocomplete="off">
    <span class="lab">모자</span><div id="swHat" class="sws"></div>
    <span class="lab">옷</span><div id="swCoat" class="sws"></div>
    <span class="lab">바지</span><div id="swPants" class="sws"></div>
    <button id="btnStart" class="px">시작하기</button>
  </div>
</div>
<script>
'use strict';

/* =====================================================================
 * CONFIG — 바꾸기 쉬운 값 모음
 * ===================================================================== */
const CONFIG = {
  // ── 화면 ──
  width: 320,                    // 내부 해상도 가로(px)
  height: 180,                   // 내부 해상도 세로(px)

  // ── 하늘 ──
  starCount: 200,                // 화면에 보이는 별 개수(대략)
  starRotationPeriod: 240,       // 별이 한 바퀴 도는 데 걸리는 시간(초)
  poleX: 160, poleY: -40,        // 회전 중심(북극성 위치). 화면 밖 위쪽
  constellationLineAlpha: 0.15,  // 별자리 선 투명도
  shootingStarInterval: [20, 40],// 별똥별 간격(초, 최소~최대)
  milkyWayDust: 700,             // 은하수 알갱이 수(0이면 은하수 없음)

  // ── 모닥불 ──
  fireX: 160, fireY: 148,        // 모닥불 중심 위치
  flameRate: 70,                 // 초당 불꽃 파티클 수
  sparkRate: 0.5,                // 초당 불티 수
  smokeRate: 2.5,                // 초당 연기 파티클 수
  lightRadius: 88,               // 불빛이 닿는 반경(px)
  fireflyCount: 7,               // 반딧불이 수

  // ── 캐릭터 ──
  walkSpeed: 18,                 // 걷는 속도(px/초)
  blinkInterval: [3, 6],         // 눈 깜빡임 간격(초)
  warmHandsInterval: [12, 24],   // 손 쬐기 간격(초)
  breathPeriod: 3.6,             // 숨 한 번 주기(초)

  // ── 첫 화면 설정 ──
  nameMaxLength: 8,              // 이름 최대 글자 수
  outfitColors: {                // 고를 수 있는 색(맨 앞이 기본값). [색, 이름]
    hat:   [['#c8463c', '빨강'], ['#e8943a', '주황'], ['#e8c84a', '노랑'], ['#5aa05a', '초록'], ['#3f8fb0', '파랑'], ['#7a62c0', '보라'], ['#d87aa8', '분홍'], ['#e8dcc8', '크림']],
    coat:  [['#3f7a78', '청록'], ['#4a6ab0', '파랑'], ['#8a4a6a', '자주'], ['#b0523c', '벽돌'], ['#6a8a3a', '올리브'], ['#c8a03a', '겨자'], ['#7a7a8a', '회색'], ['#d8cfc0', '아이보리']],
    pants: [['#4a4668', '남색'], ['#3a5a7a', '청바지'], ['#5a4a3a', '갈색'], ['#3a5a44', '숲색'], ['#6a3a4a', '와인'], ['#6a6a72', '회색'], ['#2e2e3a', '먹색'], ['#b8a888', '베이지']],
  },

  // ── 아이템 ──
  potatoCookTime: 40,            // 고구마 익는 시간(초)
  potatoMax: 3,                  // 불 속 고구마 최대 개수(최대 3)
  marshmallowGoldenTime: 25,     // 마시멜로가 노릇해지는 시간(초)
  marshmallowBurnTime: 60,       // 마시멜로가 타기 직전이 되는 시간(초)
  marshmallowMax: 4,             // 꼬챙이 자리 수(최대 4)

  // ── 소리 ──
  volume: 0.5,                   // 전체 음량(0~1)

  // ── 움직임 줄이기(prefers-reduced-motion) ──
  reducedMotionFactor: 0.3,      // 별 회전 속도와 파티클 양에 곱하는 비율

  // ── 색상 팔레트 ──
  palette: {
    skyTop: '#05071a', skyMid: '#12123a', skyHorizon: '#2c2358',
    stars: ['#e6ecff', '#ffffff', '#ffe9c4', '#bcd0ff'],
    milky: '#aab4ff',
    constellation: '#cfd8ff',
    forestFar: ['#241e4a', '#181a3a', '#0e1428'],   // 먼 숲 3겹(뒤 → 앞)
    // 가까운 숲과 땅: 어두울 때 / 불빛을 받을 때
    dark: { ground: '#0a100f', ground2: '#0e1614', dirt: '#0c0e0e', grass: '#11201a', stone: '#161b20', stoneHi: '#1e252c', tree: '#050b0b', tree2: '#081210', trunk: '#080909' },
    lit:  { ground: '#3b2c1a', ground2: '#4a3a20', dirt: '#4e3420', grass: '#5c6a26', stone: '#7c6c5c', stoneHi: '#a89078', tree: '#22361c', tree2: '#182a16', trunk: '#5a3a22' },
    flame: ['#fff4c8', '#ffd84a', '#ff9a22', '#e8501a', '#8a2414'], // 불꽃: 아래 → 위
    spark: ['#ffd84a', '#ff8a2a'],
    smoke: '#8c88a4',
    glow: '#ff7a1a',
    firefly: '#d8ff7a',
    foil: '#b8bcc8', foilShade: '#7c8090', potatoIn: '#ffcf4a', potatoInHi: '#fff0a8',
    marshWhite: '#fff6e8', marshGolden: '#d9a55a', marshBrown: '#6a3e22', marshBurnt: '#35201a',
    stick: '#7a5230',
    // 캐릭터: 대문자 = 불빛 받는 쪽, 소문자 = 그늘 쪽
    char: {
      H: '#c8463c', h: '#7a2a3a',   // 털모자
      P: '#f2e8d8', p: '#a8a0b0',   // 방울
      W: '#e8dcc8', w: '#8a8298',   // 모자 접단
      S: '#f4c08a', s: '#a8705a',   // 피부
      R: '#e88a6a', r: '#a8705a',   // 볼
      A: '#4a2c20', a: '#2a1a1c',   // 머리카락
      C: '#e8b03a', c: '#8a6234',   // 목도리
      B: '#3f7a78', b: '#1f3e4e',   // 외투
      D: '#56928c', d: '#2c5560',   // 소매
      L: '#4a4668', l: '#26243e',   // 바지
      K: '#5a3a2a', k: '#2a1c1c',   // 신발
      E: '#2a1a22', e: '#2a1a22',   // 눈
    },
  },
};

/* =====================================================================
 * 공통 도구
 * ===================================================================== */
const W = CONFIG.width, H = CONFIG.height;
const SKY_H = 132;                       // 하늘이 보이는 높이(그 아래는 숲과 땅)
const P = CONFIG.palette;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

// 움직임 줄이기 설정
const Motion = { reduced: false, get factor() { return this.reduced ? CONFIG.reducedMotionFactor : 1; } };

// 시드 고정 난수(숲 모양이 매번 같게)
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hexRgb(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(c1, c2, t) {
  const a = hexRgb(c1), b = hexRgb(c2); t = clamp01(t);
  return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
}

// 두 색을 섞어 #rrggbb로 돌려줌(옷 색의 그늘 쪽 색을 만들 때 씀)
function shade(c1, c2, t) {
  const a = hexRgb(c1), b = hexRgb(c2);
  return '#' + [0, 1, 2].map(i => Math.round(lerp(a[i], b[i], t)).toString(16).padStart(2, '0')).join('');
}

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// 픽셀 선(브레젠험)
function plotLine(ctx, x0, y0, x1, y1, size) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const s = size || 1;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (let i = 0; i < 600; i++) {
    ctx.fillRect(x0, y0, s, s);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

// 가로줄로 채우는 픽셀 타원
function fillEllipse(ctx, cx, cy, rx, ry) {
  ry = Math.max(1, Math.round(ry));
  for (let dy = -ry; dy <= ry; dy++) {
    const w = rx * Math.sqrt(1 - (dy * dy) / (ry * ry));
    ctx.fillRect(Math.round(cx - w), cy + dy, Math.round(w * 2), 1);
  }
}

// 문자열 스프라이트 그리기. flip이면 좌우를 뒤집고 밝은 쪽/그늘 쪽도 바꿈
function drawSprite(ctx, rows, pal, x, y, flip) {
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r], n = row.length;
    for (let c = 0; c < n; c++) {
      let ch = row[c];
      if (ch === '.') continue;
      let cx = c;
      if (flip) { cx = n - 1 - c; const u = ch.toUpperCase(); ch = (ch === u) ? ch.toLowerCase() : u; }
      ctx.fillStyle = pal[ch];
      ctx.fillRect(x + cx, y + r, 1, 1);
    }
  }
}

// 파티클 재사용 풀(object pool): 미리 만들어 두고 꺼졌다 켜졌다만 함
class Pool {
  constructor(n) {
    this.items = [];
    for (let i = 0; i < n; i++) this.items.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, age: 0, life: 1, ph: 0, s0: 1, s1: 1, a: 1, col: '#fff' });
    this.cursor = 0;
  }
  spawn() {
    const n = this.items.length;
    for (let i = 0; i < n; i++) {
      const p = this.items[this.cursor];
      this.cursor = (this.cursor + 1) % n;
      if (!p.active) { p.active = true; p.age = 0; return p; }
    }
    return null; // 풀이 꽉 차면 그냥 건너뜀
  }
}

/* =====================================================================
 * Sky — 밤하늘, 별, 별자리, 은하수, 별똥별
 * ===================================================================== */
const Sky = {
  angle: 0, stars: [], dust: [], consts: [], bg: null,
  shoot: { active: false, x: 0, y: 0, vx: 0, vy: 0, age: 0, life: 0.7, timer: 12 },

  init() {
    // 배경 그라데이션(위는 진하고 아래로 갈수록 살짝 밝게)을 한 번만 그려 둠
    this.bg = makeCanvas(W, H);
    const g = this.bg.getContext('2d');
    for (let y = 0; y < H; y++) {
      const t = Math.min(1, y / SKY_H);
      g.fillStyle = t < 0.55 ? mix(P.skyTop, P.skyMid, t / 0.55) : mix(P.skyMid, P.skyHorizon, (t - 0.55) / 0.45);
      g.fillRect(0, y, W, 1);
    }

    // 별: 회전 중심을 둘러싼 큰 원 안에 고르게 뿌림(화면에 보이는 수가 starCount쯤 되게)
    const px = CONFIG.poleX, py = CONFIG.poleY;
    const R = Math.hypot(Math.max(px, W - px), SKY_H - py);
    const total = Math.round(CONFIG.starCount * (Math.PI * R * R) / (W * SKY_H));
    const rng = mulberry32(20240607);
    for (let i = 0; i < total; i++) {
      const r = R * Math.sqrt(rng()), a = rng() * TAU;
      this.stars.push({
        vx: Math.cos(a) * r, vy: Math.sin(a) * r,
        size: rng() < 0.08 ? 2 : 1,
        b: 0.3 + rng() * 0.7,                 // 기본 밝기
        sp: 0.4 + rng() * 1.6, ph: rng() * TAU, // 반짝임 주기와 위상
        col: P.stars[(rng() * P.stars.length) | 0],
      });
    }

    // 은하수: 회전 중심에서 조금 떨어진 곳을 지나는 띠
    const phi = 1.05, d = 70, nx = Math.cos(phi), ny = Math.sin(phi), ux = -ny, uy = nx;
    for (let i = 0; i < CONFIG.milkyWayDust; i++) {
      const s = (rng() * 2 - 1) * R, gz = (rng() + rng() + rng() - 1.5) * 15;
      this.dust.push({ vx: nx * (d + gz) + ux * s, vy: ny * (d + gz) + uy * s, a: 0.05 + rng() * 0.13, s: rng() < 0.12 ? 2 : 1 });
    }

    // 별자리: r, a는 회전 중심에서의 거리와 방향(도). 90도가 중심 바로 아래
    const defs = [
      { name: '북두칠성', r: 82, a: 95, pts: [[0, 0], [1, 7], [10, 8], [11, 2], [18, 0], [25, -3], [32, 0]], lines: [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 5], [5, 6]] },
      { name: '카시오페이아', r: 80, a: 275, pts: [[0, 0], [7, 7], [14, 1], [21, 8], [28, 2]], lines: [[0, 1], [1, 2], [2, 3], [3, 4]] },
      { name: '오리온', r: 140, a: 140, pts: [[0, 0], [13, 1], [4, 12], [7, 11], [10, 10], [2, 23], [14, 22]], lines: [[0, 1], [0, 2], [1, 4], [2, 3], [3, 4], [2, 5], [4, 6]] },
      { name: '백조', r: 132, a: 42, pts: [[0, 0], [5, 8], [12, 22], [14, 3], [-5, 12]], lines: [[0, 1], [1, 2], [3, 1], [1, 4]] },
    ];
    for (const def of defs) {
      const a = def.a * Math.PI / 180, rot = a - Math.PI / 2;
      let mx = 0, my = 0;
      for (const p of def.pts) { mx += p[0]; my += p[1]; }
      mx /= def.pts.length; my /= def.pts.length;
      const cr = Math.cos(rot), sr = Math.sin(rot);
      const pts = def.pts.map(p => {
        const lx = p[0] - mx, ly = p[1] - my;
        return { vx: Math.cos(a) * def.r + lx * cr - ly * sr, vy: Math.sin(a) * def.r + lx * sr + ly * cr, x: 0, y: 0, ph: rng() * TAU };
      });
      this.consts.push({ pts, lines: def.lines });
    }
  },

  update(dt) {
    // 실제 하늘처럼 북극성 둘레를 반시계 방향으로 천천히 회전
    this.angle -= dt * TAU / CONFIG.starRotationPeriod * Motion.factor;

    // 별똥별
    const s = this.shoot;
    if (s.active) {
      s.age += dt; s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.age >= s.life) { s.active = false; s.timer = rand(CONFIG.shootingStarInterval[0], CONFIG.shootingStarInterval[1]); }
    } else if (!Motion.reduced) {
      s.timer -= dt;
      if (s.timer <= 0) {
        const dir = Math.random() < 0.5 ? 1 : -1, ang = rand(0.35, 0.7), sp = rand(110, 150);
        s.active = true; s.age = 0; s.life = rand(0.55, 0.8);
        s.x = rand(60, 260); s.y = rand(6, 50);
        s.vx = Math.cos(ang) * sp * dir; s.vy = Math.sin(ang) * sp;
      }
    }
  },

  draw(ctx, t) {
    ctx.drawImage(this.bg, 0, 0);
    const c = Math.cos(this.angle), s = Math.sin(this.angle), px = CONFIG.poleX, py = CONFIG.poleY;

    // 은하수
    ctx.fillStyle = P.milky;
    for (let i = 0; i < this.dust.length; i++) {
      const d = this.dust[i];
      const x = px + d.vx * c - d.vy * s, y = py + d.vx * s + d.vy * c;
      if (x < 0 || x >= W || y < 0 || y >= SKY_H) continue;
      ctx.globalAlpha = d.a;
      ctx.fillRect(x | 0, y | 0, d.s, d.s);
    }

    // 별(각자 다른 주기로 은은하게 반짝임)
    for (let i = 0; i < this.stars.length; i++) {
      const st = this.stars[i];
      const x = px + st.vx * c - st.vy * s, y = py + st.vx * s + st.vy * c;
      if (x < 0 || x >= W || y < 0 || y >= SKY_H) continue;
      ctx.globalAlpha = st.b * (0.65 + 0.35 * Math.sin(t * st.sp + st.ph));
      ctx.fillStyle = st.col;
      ctx.fillRect(x | 0, y | 0, st.size, st.size);
    }

    // 별자리(같은 회전에 맞춰 함께 움직임)
    for (const k of this.consts) {
      let visible = false;
      for (const p of k.pts) {
        p.x = px + p.vx * c - p.vy * s; p.y = py + p.vx * s + p.vy * c;
        if (p.x > -4 && p.x < W + 4 && p.y > -4 && p.y < SKY_H + 4) visible = true;
      }
      if (!visible) continue;
      ctx.fillStyle = P.constellation;
      ctx.globalAlpha = CONFIG.constellationLineAlpha;
      for (const l of k.lines) plotLine(ctx, k.pts[l[0]].x, k.pts[l[0]].y, k.pts[l[1]].x, k.pts[l[1]].y);
      for (const p of k.pts) {
        const x = Math.round(p.x), y = Math.round(p.y);
        const tw = 0.8 + 0.2 * Math.sin(t * 1.1 + p.ph);
        ctx.globalAlpha = 0.3 * tw;
        ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3);
        ctx.globalAlpha = tw; ctx.fillStyle = '#ffffff';
        ctx.fillRect(x, y, 1, 1);
        ctx.fillStyle = P.constellation;
      }
    }

    // 별똥별(짧고 옅게)
    const sh = this.shoot;
    if (sh.active) {
      const k = sh.age / sh.life, a = Math.sin(Math.PI * k) * 0.8;
      const len = Math.hypot(sh.vx, sh.vy), ux = sh.vx / len, uy = sh.vy / len;
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 9; i++) {
        const x = sh.x - ux * i * 1.6, y = sh.y - uy * i * 1.6;
        if (y >= SKY_H) continue;
        ctx.globalAlpha = a * (1 - i / 9);
        ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
      }
    }
    ctx.globalAlpha = 1;
  },
};

/* =====================================================================
 * Forest — 먼 숲, 가까운 숲과 땅, 불빛 받는 범위, 반딧불이
 * ===================================================================== */
const Forest = {
  far: null, nearDark: null, nearLit: null, lightCv: null, lctx: null, flies: [],

  // 침엽수 한 그루(층층이 톱니 모양)
  tree(g, rng, x, baseY, h, w, col, col2) {
    for (let i = 0; i < h; i++) {
      const frac = i / h, tier = (i % 6) / 6;
      const hw = i < 2 ? 0 : Math.round((0.2 + 0.8 * frac) * w / 2 * (0.5 + 0.5 * tier));
      g.fillStyle = col;
      g.fillRect(x - hw, baseY - h + i, hw * 2 + 1, 1);
      const r1 = rng(), r2 = rng();
      if (col2 && hw > 2 && r1 < 0.45) { // 잎 사이 그늘
        g.fillStyle = col2;
        const sw = 1 + Math.floor(r2 * hw);
        g.fillRect(x - hw + Math.floor(r2 * hw), baseY - h + i, sw, 1);
      }
    }
  },

  // 가까운 숲과 땅. 팔레트만 바꿔 어두운 판/밝은 판을 똑같은 모양으로 그림
  paintNear(g, pal) {
    const rng = mulberry32(777);
    g.fillStyle = pal.ground;
    g.fillRect(0, 128, W, H - 128);
    for (let x = 0; x < W; x++) if (rng() < 0.5) g.fillRect(x, 127, 1, 1);
    g.fillStyle = pal.ground2;
    for (let i = 0; i < 300; i++) g.fillRect((rng() * W) | 0, 129 + ((rng() * 50) | 0), 1 + ((rng() * 2) | 0), 1);
    // 모닥불 둘레 맨흙
    g.fillStyle = pal.dirt;
    fillEllipse(g, CONFIG.fireX, CONFIG.fireY + 1, 25, 7);
    // 어두운 나무 몇 그루: [x, 밑동 y, 높이, 너비]
    const trees = [[18, 151, 128, 60], [72, 147, 98, 46], [250, 147, 102, 48], [304, 152, 132, 62]];
    for (const tr of trees) {
      g.fillStyle = pal.trunk;
      g.fillRect(tr[0] - 1, tr[1] - 10, 3, 12);
      this.tree(g, rng, tr[0], tr[1] - 7, tr[2], tr[3], pal.tree, pal.tree2);
    }
    // 풀
    g.fillStyle = pal.grass;
    for (let i = 0; i < 90; i++) {
      const x = (rng() * W) | 0, y = 130 + ((rng() * 48) | 0);
      if (Math.abs(x - CONFIG.fireX) < 27 && Math.abs(y - CONFIG.fireY) < 9) continue;
      g.fillRect(x, y - 2, 1, 3); g.fillRect(x + 2, y - 1, 1, 2); g.fillRect(x - 1, y - 1, 1, 2);
    }
    // 작은 돌
    for (let i = 0; i < 12; i++) {
      const x = (rng() * W) | 0, y = 134 + ((rng() * 42) | 0);
      if (Math.abs(x - CONFIG.fireX) < 27 && Math.abs(y - CONFIG.fireY) < 9) continue;
      g.fillStyle = pal.stone; g.fillRect(x, y, 3, 2);
      g.fillStyle = pal.stoneHi; g.fillRect(x, y, 2, 1);
    }
  },

  init() {
    // 먼 숲 2~3겹: 뒤쪽일수록 하늘색에 가깝고 흐리게
    this.far = makeCanvas(W, H);
    const g = this.far.getContext('2d');
    const rng = mulberry32(4242);
    const layers = [[120, 10, 22, 9], [125, 16, 32, 12], [129, 24, 44, 16]]; // [밑선 y, 최소 높이, 최대 높이, 간격]
    layers.forEach((L, i) => {
      const col = P.forestFar[i];
      for (let x = -10; x < W + 10; x += L[3] * (0.6 + rng() * 0.8)) {
        const h = L[1] + rng() * (L[2] - L[1]);
        this.tree(g, rng, Math.round(x), L[0], Math.round(h), h * (0.45 + rng() * 0.15), col, null);
      }
      g.fillStyle = col;
      g.fillRect(0, L[0], W, H - L[0]);
    });

    this.nearDark = makeCanvas(W, H); this.paintNear(this.nearDark.getContext('2d'), P.dark);
    this.nearLit = makeCanvas(W, H); this.paintNear(this.nearLit.getContext('2d'), P.lit);
    this.lightCv = makeCanvas(W, H); this.lctx = this.lightCv.getContext('2d');

    // 반딧불이: 숲 가장자리 근처
    for (let i = 0; i < CONFIG.fireflyCount; i++) {
      this.flies.push({
        hx: i % 2 ? rand(215, 300) : rand(20, 105), hy: rand(104, 138),
        a: rand(0.15, 0.4), b: rand(0.2, 0.5), p: rand(0, TAU), q: rand(0, TAU), c: rand(0.5, 1.1), ph: rand(0, TAU),
      });
    }
  },

  drawFar(ctx) { ctx.drawImage(this.far, 0, 0); },

  // 어두운 판 위에, 불빛이 닿는 범위만 밝은 판을 겹쳐 그림(빛의 원이 계단식으로 옅어짐)
  drawNear(ctx, flick) {
    ctx.drawImage(this.nearDark, 0, 0);
    const l = this.lctx, R = CONFIG.lightRadius * flick;
    const bandR = [1, 0.78, 0.56, 0.34], bandA = [0.18, 0.27, 0.42, 0.71];
    l.globalCompositeOperation = 'source-over';
    l.clearRect(0, 0, W, H);
    l.fillStyle = '#ffffff';
    for (let i = 0; i < 4; i++) {
      l.globalAlpha = bandA[i];
      fillEllipse(l, CONFIG.fireX, CONFIG.fireY, R * bandR[i], R * bandR[i] * 0.6);
    }
    l.globalAlpha = 1;
    l.globalCompositeOperation = 'source-in';
    l.drawImage(this.nearLit, 0, 0);
    ctx.drawImage(this.lightCv, 0, 0);
  },

  drawFlies(ctx, t) {
    const sp = Motion.reduced ? 0.4 : 1;
    ctx.fillStyle = P.firefly;
    for (const f of this.flies) {
      const glow = Math.sin(t * f.c + f.ph);
      if (glow < 0.05) continue;
      const x = Math.round(f.hx + Math.sin(t * f.a * sp + f.p) * 14 + Math.sin(t * f.a * 2.3 * sp + f.q) * 4);
      const y = Math.round(f.hy + Math.sin(t * f.b * sp + f.q) * 7);
      ctx.globalAlpha = glow * 0.2;
      ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3);
      ctx.globalAlpha = glow;
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.globalAlpha = 1;
  },
};

/* =====================================================================
 * Campfire — 돌, 장작, 불꽃·불티·연기 파티클, 불빛
 * ===================================================================== */
const STONE_BACK = ['.TT.', 'LLLL', 'LLLl'];   // 불 뒤쪽 돌: 불빛을 받는 면이 보임
const STONE_FRONT = ['.RR.', 'DDDD', 'DDDd'];  // 불 앞쪽 돌: 어둡고 윗부분만 빛남
const STONE_PAL = { T: '#7a6860', L: '#a8866a', l: '#8a6a58', R: '#b8845a', D: '#3a3038', d: '#2a2228' };

const Campfire = {
  flames: new Pool(160), sparks: new Pool(56), smoke: new Pool(72),
  flick: 1, noise: 0, noiseTarget: 0, noiseT: 0,
  accF: 0, accS: 0, accM: 0, embers: [],

  init() {
    // 장작 위 숯불 자리
    const rng = mulberry32(99);
    for (let i = 0; i < 14; i++) this.embers.push({ x: 152 + ((rng() * 16) | 0), y: 145 + ((rng() * 4) | 0), ph: rng() * TAU, sp: 1 + rng() * 2 });
  },

  // 불티를 한꺼번에 튀기기(고구마가 들어갈 때)
  burst(n, x, y) {
    n = Math.max(2, Math.round(n * Motion.factor));
    for (let i = 0; i < n; i++) {
      const p = this.sparks.spawn(); if (!p) return;
      p.x = x + rand(-3, 3); p.y = y; p.vx = rand(-20, 20); p.vy = rand(-48, -18); p.life = rand(0.8, 1.8); p.ph = rand(0, TAU);
    }
  },

  // 연기·김·입김 공통 파티클
  puff(x, y, vx, vy, life, s0, s1, a, col) {
    const p = this.smoke.spawn(); if (!p) return;
    p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.s0 = s0; p.s1 = s1; p.a = a; p.col = col; p.ph = rand(0, TAU);
  },

  update(dt, t) {
    // 불빛 깜빡임: 느린 물결 + 부드럽게 따라가는 잡음
    this.noiseT -= dt;
    if (this.noiseT <= 0) { this.noiseT = rand(0.08, 0.2); this.noiseTarget = rand(-0.06, 0.05); }
    this.noise += (this.noiseTarget - this.noise) * Math.min(1, dt * 9);
    this.flick = 0.92 + 0.05 * Math.sin(t * 5.3) + 0.03 * Math.sin(t * 12.7 + 1.3) + this.noise;

    const fx = CONFIG.fireX, mf = Motion.factor;
    // 불꽃 만들기
    this.accF += CONFIG.flameRate * dt * (Motion.reduced ? 0.5 : 1);
    while (this.accF >= 1) {
      this.accF -= 1;
      const p = this.flames.spawn(); if (!p) break;
      p.x = fx + rand(-6, 6); p.y = 146 + rand(-1, 1); p.vy = -rand(16, 30); p.life = rand(0.5, 1.0); p.ph = rand(0, TAU);
    }
    // 가끔 날아오르는 불티
    this.accS += CONFIG.sparkRate * dt * mf;
    while (this.accS >= 1) {
      this.accS -= 1;
      const p = this.sparks.spawn(); if (!p) break;
      p.x = fx + rand(-4, 4); p.y = 138; p.vx = rand(-8, 8); p.vy = rand(-38, -20); p.life = rand(1.5, 3); p.ph = rand(0, TAU);
    }
    // 얇은 연기
    this.accM += CONFIG.smokeRate * dt * mf;
    while (this.accM >= 1) {
      this.accM -= 1;
      this.puff(fx + rand(-3, 3), 127, rand(-1.5, 1.5), -rand(6, 10), rand(4, 6.5), 1, 4, 0.11, P.smoke);
    }

    // 파티클 움직이기
    for (const p of this.flames.items) {
      if (!p.active) continue;
      p.age += dt;
      if (p.age >= p.life) { p.active = false; continue; }
      p.x += ((fx - p.x) * 1.6 + Math.sin(t * 8 + p.ph) * 6) * dt; // 위로 갈수록 가운데로 모이며 일렁임
      p.y += p.vy * dt;
    }
    for (const p of this.sparks.items) {
      if (!p.active) continue;
      p.age += dt;
      if (p.age >= p.life) { p.active = false; continue; }
      p.vx += Math.sin(t * 3 + p.ph) * 18 * dt;
      p.vy *= (1 - 0.35 * dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (const p of this.smoke.items) {
      if (!p.active) continue;
      p.age += dt;
      if (p.age >= p.life) { p.active = false; continue; }
      p.x += (p.vx + Math.sin(t * 1.3 + p.ph) * 2.5) * dt;
      p.y += p.vy * dt;
    }
  },

  // 불 뒤쪽: 돌과 엇갈려 쌓은 장작
  drawBack(ctx, t) {
    for (const x of [148, 153, 158, 163, 168]) drawSprite(ctx, STONE_BACK, STONE_PAL, x, 142);
    drawSprite(ctx, STONE_BACK, STONE_PAL, 144, 145);
    drawSprite(ctx, STONE_BACK, STONE_PAL, 172, 145);
    ctx.fillStyle = '#241612'; ctx.fillRect(152, 146, 16, 3);
    ctx.fillStyle = '#3a2218'; plotLine(ctx, 151, 147, 166, 141, 2);
    ctx.fillStyle = '#4a2c1c'; plotLine(ctx, 168, 147, 153, 141, 2);
    for (const e of this.embers) {
      const v = Math.sin(t * e.sp + e.ph);
      ctx.fillStyle = v > 0.5 ? '#ffb84a' : v > -0.2 ? '#ff6a1a' : '#9a2c12';
      ctx.fillRect(e.x, e.y, 1, 1);
    }
  },

  // 불꽃: 아래는 흰색·노랑, 위로 갈수록 주황·빨강
  drawFlames(ctx) {
    const F = P.flame;
    for (let pass = 0; pass < 2; pass++) { // 위쪽(식은) 불꽃 먼저, 뜨거운 속불을 나중에
      for (const p of this.flames.items) {
        if (!p.active) continue;
        const k = p.age / p.life;
        if ((k < 0.4) !== (pass === 1)) continue;
        const s = k < 0.35 ? 3 : k < 0.7 ? 2 : 1;
        ctx.fillStyle = k < 0.15 ? F[0] : k < 0.35 ? F[1] : k < 0.6 ? F[2] : k < 0.82 ? F[3] : F[4];
        ctx.globalAlpha = k > 0.85 ? (1 - k) / 0.15 : 1;
        ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
      }
    }
    ctx.globalAlpha = 1;
  },

  // 불 앞쪽 돌
  drawFront(ctx) {
    for (const x of [146, 151, 156, 161, 166, 171]) drawSprite(ctx, STONE_FRONT, STONE_PAL, x, 150);
  },

  drawParticles(ctx) {
    for (const p of this.smoke.items) {
      if (!p.active) continue;
      const k = p.age / p.life, s = Math.round(lerp(p.s0, p.s1, k));
      ctx.globalAlpha = p.a * (1 - k) * Math.min(1, k * 8);
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
    }
    for (const p of this.sparks.items) {
      if (!p.active) continue;
      const k = p.age / p.life;
      ctx.globalAlpha = 1 - k * k;
      ctx.fillStyle = k < 0.5 ? P.spark[0] : P.spark[1];
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
    }
    ctx.globalAlpha = 1;
  },

  // 불 주위 공기와 캐릭터에 더해지는 따뜻한 빛
  drawGlow(ctx) {
    const f = this.flick, radii = [40, 29, 19, 10], alphas = [0.022, 0.04, 0.06, 0.09];
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = P.glow;
    for (let i = 0; i < 4; i++) {
      ctx.globalAlpha = alphas[i] * f;
      fillEllipse(ctx, CONFIG.fireX, 138, radii[i] * f, radii[i] * f);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  },
};

/* =====================================================================
 * Items — 고구마(불 속)와 마시멜로 꼬챙이(불 둘레)
 * ===================================================================== */
const HALF_SPR = ['FYy', 'FYY', '.FF'];
const HALF_PAL = { F: P.foil, Y: P.potatoIn, y: P.potatoInHi };
const MUG_SPR = ['MMM.', 'RRRm', 'MMMm', 'MMM.'];
const MUG_PAL = { M: '#e8dcc8', R: '#c8463c', m: '#a89c8c' };

const Items = {
  // 불 속 고구마 자리(왼쪽 위 좌표)
  potatoSlots: [[151, 147], [158, 148], [165, 147]].slice(0, Math.max(1, Math.min(3, CONFIG.potatoMax))),
  // 꼬챙이 자리: 땅에 꽂는 곳(b) → 마시멜로가 있는 끝(t). side는 불의 왼쪽(-1)/오른쪽(1)
  marshSlots: [
    { bx: 143, by: 152, tx: 149, ty: 143, side: -1 },
    { bx: 177, by: 152, tx: 171, ty: 143, side: 1 },
    { bx: 136, by: 150, tx: 145, ty: 136, side: -1 },
    { bx: 184, by: 150, tx: 175, ty: 136, side: 1 },
  ].slice(0, Math.max(1, Math.min(4, CONFIG.marshmallowMax))),
  potatoes: [], marsh: [], fly: null, accSteam: 0,

  init() {
    this.potatoes = this.potatoSlots.map(() => null);
    this.marsh = this.marshSlots.map(() => null);
  },

  freePotato() { return this.potatoes.indexOf(null); },
  freeMarsh() { return this.marsh.indexOf(null); },
  isRipe(i) { const p = this.potatoes[i]; return !!p && p.age >= CONFIG.potatoCookTime; },

  // 마시멜로 색: 흰색 → 노릇한 갈색 → 짙은 갈색
  marshColor(age) {
    const g = CONFIG.marshmallowGoldenTime, b = CONFIG.marshmallowBurnTime;
    if (age < g) return mix(P.marshWhite, P.marshGolden, age / g);
    if (age < b) return mix(P.marshGolden, P.marshBrown, (age - g) / (b - g));
    return mix(P.marshBrown, P.marshBurnt, (age - b) / 20);
  },

  // 고구마를 포물선으로 날리기(불에 넣을 때, 꺼낼 때)
  startFly(x0, y0, x1, y1, d, onDone) { this.fly = { x0, y0, x1, y1, d, age: 0, onDone }; },

  update(dt) {
    for (const p of this.potatoes) if (p) p.age += dt;
    for (const m of this.marsh) if (m) m.age += dt;

    if (this.fly) {
      this.fly.age += dt;
      if (this.fly.age >= this.fly.d) { const f = this.fly; this.fly = null; if (f.onDone) f.onDone(); }
    }

    // 다 익은 고구마의 김, 타기 직전 마시멜로의 작은 연기
    this.accSteam += dt * Motion.factor;
    if (this.accSteam > 0.4) {
      this.accSteam = 0;
      this.potatoes.forEach((p, i) => {
        if (this.isRipe(i)) Campfire.puff(this.potatoSlots[i][0] + 2 + rand(-1, 1), this.potatoSlots[i][1] - 1, rand(-1, 1), -rand(7, 10), 1.6, 1, 2, 0.55, '#ffffff');
      });
      this.marsh.forEach((m, i) => {
        if (m && m.age > CONFIG.marshmallowBurnTime && Math.random() < 0.6) {
          const s = this.marshSlots[i];
          Campfire.puff(s.tx, s.ty - 2, rand(-1, 1), -rand(5, 8), 1.8, 1, 2, 0.4, '#b0acc0');
        }
      });
    }
  },

  // 은박지 고구마(반짝이는 하이라이트가 불빛에 따라 옮겨 다님)
  drawPotato(ctx, x, y, t, seed) {
    ctx.fillStyle = P.foil;
    ctx.fillRect(x + 1, y, 3, 1); ctx.fillRect(x, y + 1, 5, 1);
    ctx.fillStyle = P.foilShade; ctx.fillRect(x + 1, y + 2, 3, 1);
    ctx.fillStyle = '#ffb070'; ctx.fillRect(x + 2, y + 2, 1, 1);        // 불빛이 비친 자리
    const hl = [[1, 0], [2, 1], [3, 0], [3, 1]][((t * 2.5 + seed * 1.7) | 0) % 4];
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x + hl[0], y + hl[1], 1, 1);
  },

  drawPotatoes(ctx, t) {
    this.potatoes.forEach((p, i) => {
      if (!p) return;
      const s = this.potatoSlots[i];
      this.drawPotato(ctx, s[0], s[1], t, i);
      if (this.isRipe(i)) { // "다 익었다" 반짝임
        const k = Math.sin(t * 4 + i);
        if (k > -0.3) {
          const cx = s[0] + 2, cy = s[1] - 3;
          ctx.fillStyle = '#fff8d0';
          ctx.fillRect(cx, cy, 1, 1);
          if (k > 0.3) { ctx.fillRect(cx - 1, cy, 3, 1); ctx.fillRect(cx, cy - 1, 1, 3); }
          if (k > 0.8) { ctx.fillRect(cx - 2, cy, 5, 1); ctx.fillRect(cx, cy - 2, 1, 5); }
        }
      }
    });
  },

  // 꼬챙이 하나(col이 없으면 마시멜로 없이 나뭇가지만)
  drawSkewer(ctx, bx, by, tx, ty, col) {
    ctx.fillStyle = P.stick;
    plotLine(ctx, bx, by, tx, ty);
    if (!col) return;
    tx = Math.round(tx); ty = Math.round(ty);
    ctx.fillStyle = col; ctx.fillRect(tx - 1, ty - 1, 3, 3);
    ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.45; ctx.fillRect(tx - 1, ty - 1, 1, 1);
    ctx.fillStyle = '#000000'; ctx.globalAlpha = 0.25; ctx.fillRect(tx + 1, ty + 1, 1, 1);
    ctx.globalAlpha = 1;
  },

  drawSkewers(ctx) {
    this.marsh.forEach((m, i) => {
      if (!m) return;
      const s = this.marshSlots[i];
      this.drawSkewer(ctx, s.bx, s.by, s.tx, s.ty, this.marshColor(m.age));
    });
  },

  drawFly(ctx, t) {
    const f = this.fly; if (!f) return;
    const k = f.age / f.d;
    this.drawPotato(ctx, Math.round(lerp(f.x0, f.x1, k)), Math.round(lerp(f.y0, f.y1, k) - Math.sin(Math.PI * k) * 10), t, 0);
  },

  // 누른 자리에 있는 아이템 찾기(손가락으로도 누르기 쉽게 넉넉한 범위)
  hitTest(x, y) {
    let best = null, bd = 9;
    this.marsh.forEach((m, i) => {
      if (!m) return;
      const s = this.marshSlots[i], d = Math.hypot(x - s.tx, y - s.ty);
      if (d < bd) { bd = d; best = { type: 'marsh', index: i }; }
    });
    this.potatoes.forEach((p, i) => {
      if (!p) return;
      const s = this.potatoSlots[i], d = Math.hypot(x - (s[0] + 2), y - (s[1] - 1));
      if (d < bd) { bd = d; best = { type: this.isRipe(i) ? 'potato' : 'potatoRaw', index: i }; } // 덜 익은 고구마는 따로 구분
    });
    return best;
  },
};

/* =====================================================================
 * Character — 픽셀 캐릭터와 동작 상태 머신
 * ===================================================================== */
const HEAD = [
  '......PP........',
  '.....pPP........',
  '....hhHHHH......',
  '...hhHHHHHH.....',
  '...hhHHHHHHH....',
  '..wwwWWWWWWW....',
  '...AsSSSSSSS....',
  '...AsSSSSSSS....',
  '...ssSSSSSRSS...',
  '....sSSSSSS.....',
];
const SIT_TORSO = [
  '...ccCCCCCCC....',
  '..cccCCCCCC.....',
  '..cbbBBBBBB.....',
  '..cbbBBBBBB.....',
  '...bbBBBBBB.....',
  '...bbBBBBBB.....',
  '...bbBBBBBB.....',
];
const SIT_LEGS = [
  '...llLLLLLLLLL..',
  '...llLLLLLLLLL..',
  '..........lLLL..',
  '..........lLLL..',
  '..........lLLL..',
  '..........kKKK..',
  '..........kKKKK.',
];
const STAND_TORSO = SIT_TORSO.concat(['...bbBBBBBB.....', '....lLLLLL......', '....lLLLLL......']);
const LEGS_A = ['....lL..LL......', '....lL..LL......', '....lL..LL......', '....lL..LL......', '....kK..KK......', '....kKK.KKK.....'];
const LEGS_B = ['.....lLLL.......', '.....lLLL.......', '.....lLLL.......', '.....lLLL.......', '.....kKK........', '.....kKKK.......'];

// 팔 모양: px = [열, 행, 색 글자], hand = 손 위치, item = 든 물건의 왼쪽 위 위치
const ARMS = {
  rest:     { px: [[7,12,'D'],[8,12,'D'],[7,13,'D'],[8,13,'D'],[8,14,'D'],[9,14,'D'],[9,15,'D'],[10,15,'D'],[10,16,'D'],[11,16,'S']], hand: [11, 16], item: [11, 14] },
  reach:    { px: [[7,12,'D'],[8,12,'D'],[8,13,'D'],[9,13,'D'],[10,13,'D'],[11,13,'D'],[12,13,'D'],[13,13,'S'],[13,12,'S'],[9,15,'d'],[10,15,'d'],[11,15,'d'],[12,15,'s'],[12,14,'s']], hand: [13, 12], item: [13, 11] },
  back:     { px: [[6,12,'d'],[5,12,'d'],[5,13,'d'],[4,13,'d'],[4,14,'d'],[3,14,'d'],[3,15,'d'],[2,15,'d'],[2,16,'d'],[1,16,'s']], hand: [1, 16], item: [0, 14] },
  cupLap:   { px: [[7,12,'D'],[8,12,'D'],[7,13,'D'],[8,13,'D'],[8,14,'D'],[9,14,'D'],[9,15,'D'],[10,15,'D'],[10,14,'D'],[11,14,'S'],[11,15,'S']], hand: [11, 15], item: [12, 13] },
  cupMouth: { px: [[7,12,'D'],[8,12,'D'],[8,13,'D'],[9,13,'D'],[9,12,'D'],[10,12,'D'],[10,11,'D'],[11,11,'D'],[12,10,'S'],[13,10,'S']], hand: [12, 10], item: [12, 6] },
  hold:     { px: [[7,12,'D'],[8,12,'D'],[8,13,'D'],[9,13,'D'],[9,14,'D'],[10,14,'D'],[11,14,'D'],[12,14,'S'],[12,13,'S']], hand: [12, 13], item: [12, 11] },
  mouth:    { px: [[7,12,'D'],[8,12,'D'],[8,13,'D'],[9,13,'D'],[9,12,'D'],[10,12,'D'],[10,11,'D'],[11,11,'D'],[12,10,'S'],[13,10,'S']], hand: [13, 10], item: [12, 7] },
  down:     { px: [[7,12,'D'],[8,12,'D'],[8,13,'D'],[9,13,'D'],[9,14,'D'],[10,14,'D'],[10,15,'D'],[11,15,'D'],[11,16,'D'],[12,16,'S'],[12,17,'S']], hand: [12, 17], item: [12, 15] },
};

const HOME_X = 112;   // 통나무에 앉는 자리(스프라이트 왼쪽 x)
const CHAR_Y = 128;   // 앉은 스프라이트 위쪽 y(발끝이 152)

const Character = {
  x: HOME_X, pose: 'sit', flip: false, arm: 'rest', eyes: 'open', headDx: 0, chew: 0, rise: 0,
  held: null, heldAge: 0, plant: null, plantSlot: null, mugOnLog: true,
  busy: false, state: 'idle', script: null, si: 0, st: 0, stepDone: false,
  walking: false, walkT: 0, bob: 0,
  blinkT: 4, blinkHold: 0, warmT: 10, warming: 0, steamAcc: 0,

  init() {
    this.blinkT = rand(CONFIG.blinkInterval[0], CONFIG.blinkInterval[1]);
    this.warmT = rand(6, 12);
  },

  // ── 좌표 도우미 ──
  lx(col) { return Math.round(this.x) + (this.flip ? 15 - col : col); },       // 캐릭터 안쪽 열 → 화면 x
  originY() { return this.pose === 'stand' ? CHAR_Y - 2 + this.rise + this.walkBob() : CHAR_Y + this.bob; },
  walkBob() { return (this.walking && ((this.walkT * 5) | 0) % 2 === 0) ? 1 : 0; },
  handPos() { const a = ARMS[this.arm]; return [this.lx(a.hand[0]), this.originY() + a.hand[1]]; },

  // ── 상태 머신: 동작은 "단계(step)" 목록이고, 다 끝나면 기본 상태로 돌아감 ──
  run(name, steps) {
    this.state = name; this.script = steps; this.si = 0; this.st = 0; this.stepDone = false;
    this.busy = true; this.warming = 0; this.eyes = 'open';
    if (steps[0].enter) steps[0].enter();
  },
  finish() {
    this.script = null; this.state = 'idle'; this.busy = false;
    this.x = HOME_X; this.pose = 'sit'; this.flip = false; this.arm = 'rest'; this.eyes = 'open';
    this.headDx = 0; this.chew = 0; this.rise = 0; this.held = null; this.plant = null; this.walking = false; this.mugOnLog = true;
    this.warmT = rand(CONFIG.warmHandsInterval[0], CONFIG.warmHandsInterval[1]);
  },

  // 단계 만들기 도우미
  set(d, props, extra) { const s = { d, enter: () => Object.assign(this, props) }; return Object.assign(s, extra || {}); },
  standUp() { return { d: 0.4, enter: () => { this.pose = 'stand'; }, update: p => { this.rise = p < 0.5 ? 1 : 0; } }; },
  sitDown(arm) { return { d: 0.35, enter: () => { this.pose = 'sit'; this.flip = false; this.walking = false; this.x = HOME_X; this.arm = arm || 'rest'; } }; },
  walkTo(tx) {
    return {
      d: Infinity,
      enter: () => { this.pose = 'stand'; this.walking = true; this.walkT = 0; this.flip = tx < this.x; },
      update: (p, dt) => {
        const dir = Math.sign(tx - this.x), step = CONFIG.walkSpeed * dt;
        if (Math.abs(tx - this.x) <= step) { this.x = tx; this.stepDone = true; }
        else this.x += dir * step;
        this.walkT += dt;
      },
      exit: () => { this.walking = false; },
    };
  },

  // ── 차 마시기(약 7.5초) ──
  drinkTea() {
    const sip = () => [this.set(0.6, { arm: 'cupMouth', headDx: -1 }), this.set(0.45, { arm: 'cupLap', headDx: 0 })];
    this.run('tea', [
      this.set(0.6, { arm: 'back' }),                                        // 옆에 둔 머그컵으로 손을 뻗음
      this.set(0.8, { arm: 'cupLap', held: 'mug', mugOnLog: false }),        // 집어 들면 김이 모락모락
      ...sip(), ...sip(), ...sip(),                                          // 홀짝 3번(고개가 살짝 뒤로)
      { d: 1.2, enter: () => {                                               // "후—" 입김, 편안한 표정
          this.eyes = 'happy';
          const n = Motion.reduced ? 2 : 6;
          for (let i = 0; i < n; i++) Campfire.puff(this.lx(13) + i * 0.6, CHAR_Y + 9, rand(7, 13), rand(-2.5, 0), rand(0.8, 1.3), 1, 3, 0.5, '#ffffff');
        } },
      this.set(1.2, { arm: 'cupLap' }),                                      // 컵을 무릎 위에 둔 채 잠깐
      this.set(0.55, { arm: 'back', held: null, mugOnLog: true }),           // 내려놓기
    ]);
  },

  // ── 고구마 넣기 ──
  putPotato(i) {
    const slot = Items.potatoSlots[i];
    this.run('potato', [
      this.set(0.9, { arm: 'hold', held: 'potato' }),                        // 은박지 고구마를 꺼내 듦
      this.standUp(),
      this.walkTo(122),
      this.set(0.3, {}),
      { d: 0.7, enter: () => {                                               // 불 속으로 살짝 던짐
          const h = [this.lx(12), this.originY() + 11];
          this.held = null; this.arm = 'reach';
          Items.startFly(h[0], h[1], slot[0], slot[1], 0.6, () => {
            Items.potatoes[i] = { age: 0 };
            Campfire.burst(14, slot[0] + 2, slot[1] - 1);                    // 불티가 확 튐
          });
        } },
      this.set(0.7, { arm: 'rest' }),
      this.walkTo(HOME_X),
      this.sitDown(),
    ]);
  },

  // ── 다 익은 고구마 꺼내 먹기 ──
  eatPotato(i) {
    const slot = Items.potatoSlots[i];
    const bite = held => [this.set(0.45, { arm: 'mouth', held }), this.set(0.45, { arm: 'hold', chew: 1 }, { exit: () => { this.chew = 0; } })];
    this.run('eatPotato', [
      this.standUp(),
      this.walkTo(124),
      { d: 0.6, enter: () => {                                               // 불에서 꺼냄
          this.arm = 'down';
          Items.potatoes[i] = null;
          Campfire.burst(5, slot[0] + 2, slot[1] - 1);
          Items.startFly(slot[0], slot[1], this.lx(12), this.originY() + 11, 0.55, null);
        }, exit: () => { this.arm = 'hold'; this.held = 'potato'; } },
      this.set(0.3, {}),
      this.walkTo(HOME_X),
      this.sitDown('hold'),
      this.set(0.5, {}),
      this.set(0.9, { held: 'halves' }),                                     // 반으로 갈라 노란 속을 보임
      ...bite('halves'), ...bite('half'), ...bite('half'),
      this.set(1.4, { arm: 'rest', held: null, eyes: 'happy' }),
    ]);
  },

  // ── 덜 익은 고구마를 눌렀을 때: "아직이야" 하고 고개를 젓기 ──
  notYet() {
    this.run('notYet', [
      this.set(0.22, { headDx: -1 }), this.set(0.22, { headDx: 1 }),
      this.set(0.22, { headDx: -1 }), this.set(0.22, { headDx: 1 }),
      this.set(0.3, { headDx: 0 }),
    ]);
  },

  // 꼬챙이를 꽂거나 뽑을 때 서는 자리
  skewerSpot(slot) { return slot.side < 0 ? 120 : 185; },

  // ── 마시멜로 꽂기 ──
  plantMarsh(i) {
    const slot = Items.marshSlots[i];
    this.run('marsh', [
      this.set(0.7, { arm: 'hold', held: 'stick' }),                         // 나뭇가지 꼬챙이
      this.set(0.8, { held: 'stickM', heldAge: 0 }),                         // 하얀 마시멜로를 끼움
      this.standUp(),
      this.walkTo(this.skewerSpot(slot)),
      { d: 0.3, enter: () => { this.flip = slot.side > 0; this.arm = 'down'; } },
      { d: 0.7, enter: () => { this.plantSlot = slot; this.plant = 0; },     // 땅에 비스듬히 꽂음
        update: p => { this.plant = p; },
        exit: () => { this.plant = null; this.held = null; Items.marsh[i] = { age: 0 }; } },
      this.set(0.5, { arm: 'rest' }),
      this.walkTo(HOME_X),
      this.sitDown(),
    ]);
  },

  // ── 꽂힌 마시멜로 가져와 먹기 ──
  eatMarsh(i) {
    const slot = Items.marshSlots[i];
    this.run('eatMarsh', [
      this.standUp(),
      this.walkTo(this.skewerSpot(slot)),
      { d: 0.3, enter: () => { this.flip = slot.side > 0; this.arm = 'down'; } },
      { d: 0.6, enter: () => {                                               // 뽑아 듦
          this.heldAge = Items.marsh[i].age; Items.marsh[i] = null;
          this.held = 'stickM'; this.plantSlot = slot; this.plant = 1;
        },
        update: p => { this.plant = 1 - p; },
        exit: () => { this.plant = null; this.arm = 'hold'; } },
      this.set(0.3, {}),
      this.walkTo(HOME_X),
      this.sitDown('hold'),
      this.set(0.5, {}),
      this.set(0.7, { arm: 'mouth' }),                                       // 한 입
      this.set(0.3, { arm: 'hold', held: 'stick', chew: 1 }),
      this.set(0.3, { chew: 0 }), this.set(0.3, { chew: 1 }), this.set(0.3, { chew: 0 }),
      this.set(1.3, { arm: 'rest', held: null, eyes: 'happy' }),
    ]);
  },

  update(dt, t) {
    // 숨쉬기: 앉아 있을 때 윗몸이 1px 오르내림
    this.bob = (this.pose === 'sit' && Math.sin(t * TAU / CONFIG.breathPeriod) < 0) ? 1 : 0;

    // 눈 깜빡임(3~6초마다)
    if (this.blinkHold > 0) this.blinkHold -= dt;
    this.blinkT -= dt;
    if (this.blinkT <= 0) { this.blinkHold = 0.16; this.blinkT = rand(CONFIG.blinkInterval[0], CONFIG.blinkInterval[1]); }

    if (this.script) {
      // 진행 중인 동작의 현재 단계
      const step = this.script[this.si];
      this.st += dt;
      if (step.update) step.update(Math.min(1, this.st / step.d), dt);
      if (this.st >= step.d || this.stepDone) {
        if (step.exit) step.exit();
        this.si++; this.st = 0; this.stepDone = false;
        if (this.si >= this.script.length) this.finish();
        else if (this.script[this.si].enter) this.script[this.si].enter();
      }
    } else {
      // 기본 상태: 가끔 손을 불 쪽으로 뻗어 쬐기
      if (this.warming > 0) {
        this.warming -= dt; this.arm = 'reach';
        if (this.warming <= 0) { this.arm = 'rest'; this.warmT = rand(CONFIG.warmHandsInterval[0], CONFIG.warmHandsInterval[1]); }
      } else {
        this.warmT -= dt;
        if (this.warmT <= 0) this.warming = 3.5;
      }
    }

    // 손에 든 뜨거운 것에서 올라오는 김
    if (this.held === 'mug' || this.held === 'halves' || this.held === 'half') {
      this.steamAcc += dt * Motion.factor;
      if (this.steamAcc > 0.22) {
        this.steamAcc = 0;
        const a = ARMS[this.arm].item;
        Campfire.puff(this.lx(a[0] + 1) + rand(-1, 1), this.originY() + a[1] - 1, rand(-1, 1), -rand(5, 8), rand(0.9, 1.4), 1, 2, 0.5, '#ffffff');
      }
    }
  },

  // 통나무 의자와 그 위의 머그컵
  drawLog(ctx) {
    const x0 = HOME_X - 7, y0 = CHAR_Y + 19, w = 18;
    for (let i = 0; i < w; i++) {
      const k = i / w; // 불에 가까운 오른쪽일수록 밝게
      ctx.fillStyle = k < 0.35 ? '#2a1c18' : k < 0.7 ? '#49301f' : '#6a4428';
      ctx.fillRect(x0 + i, y0, 1, 5);
      ctx.fillStyle = k < 0.35 ? '#3a2820' : k < 0.7 ? '#5e4028' : '#8a5c34';
      ctx.fillRect(x0 + i, y0, 1, 1);
    }
    ctx.fillStyle = '#1e1412';
    ctx.fillRect(x0 + 3, y0 + 2, 4, 1); ctx.fillRect(x0 + 9, y0 + 3, 5, 1); ctx.fillRect(x0, y0 + 4, w, 1);
    ctx.fillStyle = '#b08a58'; ctx.fillRect(x0 + w, y0, 2, 5);   // 잘린 단면
    ctx.fillStyle = '#8a6238'; ctx.fillRect(x0 + w, y0 + 2, 1, 1); ctx.fillRect(x0 + w + 1, y0 + 4, 1, 1);
    if (this.mugOnLog) drawSprite(ctx, MUG_SPR, MUG_PAL, HOME_X - 3, y0 - 4);
  },

  draw(ctx, t) {
    const pal = P.char, x = Math.round(this.x), f = this.flip;
    let oy;
    if (this.pose === 'sit') {
      oy = CHAR_Y + this.bob;
      drawSprite(ctx, SIT_TORSO, pal, x, oy + 10, f);
      drawSprite(ctx, SIT_LEGS, pal, x, CHAR_Y + 17, f);      // 다리는 숨쉬기와 상관없이 고정
    } else {
      const base = CHAR_Y - 2 + this.rise;
      oy = base + this.walkBob();
      const legs = (this.walking && ((this.walkT * 5) | 0) % 2 === 1) ? LEGS_B : LEGS_A;
      drawSprite(ctx, STAND_TORSO, pal, x, oy + 10, f);
      drawSprite(ctx, legs, pal, x, base + 20, f);
    }

    // 머리(차를 마실 때는 살짝 뒤로, 씹을 때는 1px 아래로)
    const hx = x + (f ? -this.headDx : this.headDx), hy = oy + this.chew;
    drawSprite(ctx, HEAD, pal, hx, hy, f);
    const ex = c => hx + (f ? 15 - c : c);
    if (this.eyes === 'happy') {                 // ^^ 모양
      ctx.fillStyle = pal.E;
      ctx.fillRect(ex(9), hy + 7, 1, 1); ctx.fillRect(ex(10), hy + 6, 1, 1); ctx.fillRect(ex(11), hy + 7, 1, 1);
    } else if (this.blinkHold > 0) {             // 깜빡
      ctx.fillStyle = '#8a5a48';
      ctx.fillRect(ex(9), hy + 7, 1, 1); ctx.fillRect(ex(10), hy + 7, 1, 1);
    } else {
      ctx.fillStyle = pal.E;
      ctx.fillRect(ex(10), hy + 6, 1, 2);
    }

    // 팔
    const arm = ARMS[this.arm];
    for (const p of arm.px) {
      let ch = p[2];
      if (f) { const u = ch.toUpperCase(); ch = ch === u ? ch.toLowerCase() : u; }
      ctx.fillStyle = pal[ch];
      ctx.fillRect(this.lx(p[0]), oy + p[1], 1, 1);
    }

    // 손에 든 것
    const ix = w => x + (f ? 15 - arm.item[0] - (w - 1) : arm.item[0]), iy = oy + arm.item[1];
    if (this.held === 'mug') drawSprite(ctx, MUG_SPR, MUG_PAL, ix(4), iy, f);
    else if (this.held === 'potato') Items.drawPotato(ctx, ix(5), iy, t, 1);
    else if (this.held === 'halves') { drawSprite(ctx, HALF_SPR, HALF_PAL, ix(3), iy, f); drawSprite(ctx, HALF_SPR, HALF_PAL, ix(3) + (f ? -4 : 4), iy, !f); }
    else if (this.held === 'half') drawSprite(ctx, HALF_SPR, HALF_PAL, ix(3), iy, f);
    else if (this.held === 'stick' || this.held === 'stickM') {
      const dir = f ? -1 : 1, hand = [this.lx(arm.hand[0]), oy + arm.hand[1]];
      let bx, by, tx, ty;
      if (this.arm === 'mouth') { tx = this.lx(13); ty = oy + 8; bx = tx + dir * 4; by = ty + 5; }   // 입으로 가져감
      else { bx = hand[0]; by = hand[1] + 1; tx = bx + dir * 5; ty = by - 8; }
      if (this.plant !== null && this.plantSlot) {   // 꽂는(뽑는) 중: 손 ↔ 꽂힌 자리 사이를 이동
        const s = this.plantSlot, p = this.plant;
        bx = lerp(bx, s.bx, p); by = lerp(by, s.by, p); tx = lerp(tx, s.tx, p); ty = lerp(ty, s.ty, p);
      }
      Items.drawSkewer(ctx, bx, by, tx, ty, this.held === 'stickM' ? Items.marshColor(this.heldAge) : null);
    }
  },
};

/* =====================================================================
 * AudioFx — Web Audio로 직접 만든 소리(음원 파일 없음). 기본은 꺼짐
 * ===================================================================== */
const AudioFx = {
  ctx: null, on: false, master: null, noise: null, cricket: null, tCrackle: 0, tChirp: 2,

  build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    const ac = this.ctx = new AC();
    this.master = ac.createGain(); this.master.gain.value = 0; this.master.connect(ac.destination);

    // 잡음 버퍼(장작 타닥 소리의 재료)
    const len = ac.sampleRate * 2;
    this.noise = ac.createBuffer(1, len, ac.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    // 낮게 깔리는 불 소리
    const src = ac.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
    const g = ac.createGain(); g.gain.value = 0.09;
    src.connect(lp); lp.connect(g); g.connect(this.master); src.start();

    // 풀벌레: 높은 음을 짧게 끊어 울림
    const osc = ac.createOscillator(); osc.type = 'sine'; osc.frequency.value = 4300;
    this.cricket = ac.createGain(); this.cricket.gain.value = 0;
    osc.connect(this.cricket); this.cricket.connect(this.master); osc.start();
    return true;
  },

  toggle() {
    if (!this.ctx && !this.build()) return false;
    this.on = !this.on;
    const now = this.ctx.currentTime;
    if (this.on) { this.ctx.resume(); this.master.gain.setTargetAtTime(CONFIG.volume, now, 0.4); }
    else this.master.gain.setTargetAtTime(0, now, 0.1);
    return this.on;
  },

  update(dt) {
    if (!this.on || !this.ctx) return;
    const ac = this.ctx, now = ac.currentTime;
    // 장작 타닥이는 소리: 불규칙한 짧은 잡음
    this.tCrackle -= dt;
    if (this.tCrackle <= 0) {
      this.tCrackle = rand(0.04, 0.5);
      const src = ac.createBufferSource(); src.buffer = this.noise; src.playbackRate.value = rand(0.6, 1.8);
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rand(900, 5000); bp.Q.value = 1.2;
      const g = ac.createGain(), v = Math.pow(Math.random(), 2) * 0.35 + 0.03;
      g.gain.setValueAtTime(v, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + rand(0.015, 0.07));
      src.connect(bp); bp.connect(g); g.connect(this.master);
      src.start(now, rand(0, 1.5), 0.1);
    }
    // 아주 작은 풀벌레 소리
    this.tChirp -= dt;
    if (this.tChirp <= 0) {
      this.tChirp = rand(1.2, 3.2);
      const g = this.cricket.gain, n = 3 + ((Math.random() * 2) | 0);
      let tt = now + 0.02;
      for (let i = 0; i < n; i++) {
        g.setValueAtTime(0, tt);
        g.linearRampToValueAtTime(0.012, tt + 0.012);
        g.linearRampToValueAtTime(0, tt + 0.045);
        tt += 0.07;
      }
    }
  },

  pause() { if (this.ctx && this.on) this.ctx.suspend(); },
  resume() { if (this.ctx && this.on) this.ctx.resume(); },
};

const UI = {
  btnPotato: null, btnMarsh: null, btnTea: null, btnSound: null, last: '',

  icon(btn, ic) {
    const cv = btn.querySelector('canvas'), g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, cv.height);
    drawSprite(g, ic.rows, ic.pal, 0, 0, false);
  },

  init() {
    this.btnPotato = document.getElementById('btnPotato');
    this.btnMarsh = document.getElementById('btnMarsh');
    this.btnTea = document.getElementById('btnTea');
    this.btnSound = document.getElementById('sound');
    this.icon(this.btnPotato, ICONS.potato);
    this.icon(this.btnMarsh, ICONS.marsh);
    this.icon(this.btnTea, ICONS.tea);
    this.icon(this.btnSound, ICONS.soundOff);

    this.btnPotato.addEventListener('click', () => { const i = Items.freePotato(); if (!Character.busy && i >= 0) Character.putPotato(i); this.refresh(); });
    this.btnMarsh.addEventListener('click', () => { const i = Items.freeMarsh(); if (!Character.busy && i >= 0) Character.plantMarsh(i); this.refresh(); });
    this.btnTea.addEventListener('click', () => { if (!Character.busy) Character.drinkTea(); this.refresh(); });
    this.btnSound.addEventListener('click', () => {
      const on = AudioFx.toggle();
      this.icon(this.btnSound, on ? ICONS.soundOn : ICONS.soundOff);
      this.btnSound.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  },

  // 동작 중이거나 자리가 꽉 차면 버튼을 흐리게 하고 못 누르게 함
  refresh() {
    const b = Character.busy, dp = b || Items.freePotato() < 0, dm = b || Items.freeMarsh() < 0;
    const key = (dp ? 1 : 0) + '' + (dm ? 1 : 0) + (b ? 1 : 0);
    if (key === this.last) return;
    this.last = key;
    this.btnPotato.disabled = dp; this.btnMarsh.disabled = dm; this.btnTea.disabled = b;
  },
};

/* =====================================================================
 * Setup — 첫 진입 설정 창(이름, 모자·옷·바지 색) → 시작하기
 * ===================================================================== */
const Setup = {
  el: null, input: null, preview: null, tag: null, name: '', started: false,
  sel: { hat: CONFIG.outfitColors.hat[0][0], coat: CONFIG.outfitColors.coat[0][0], pants: CONFIG.outfitColors.pants[0][0] },
  groups: {},

  // 고른 색을 캐릭터 팔레트에 반영(밝은 쪽 색에서 그늘 쪽 색을 만들어 냄)
  apply() {
    const c = P.char, o = this.sel;
    c.H = o.hat;   c.h = shade(o.hat, '#1a1030', 0.5);
    c.B = o.coat;  c.b = shade(o.coat, '#0a1028', 0.55);
    c.D = shade(o.coat, '#ffffff', 0.18); c.d = shade(c.b, '#ffffff', 0.12);
    c.L = o.pants; c.l = shade(o.pants, '#0a0a20', 0.5);
    this.drawPreview();
  },

  drawPreview() {
    const g = this.preview.getContext('2d');
    g.clearRect(0, 0, 16, 24);
    drawSprite(g, SIT_TORSO, P.char, 0, 10, false);
    drawSprite(g, SIT_LEGS, P.char, 0, 17, false);
    drawSprite(g, HEAD, P.char, 0, 0, false);
    g.fillStyle = P.char.E; g.fillRect(10, 6, 1, 2);
    for (const p of ARMS.rest.px) { g.fillStyle = P.char[p[2]]; g.fillRect(p[0], p[1], 1, 1); }
  },

  // 색 고르기 버튼 한 줄 만들기
  buildSwatches(part, boxId, label) {
    const box = document.getElementById(boxId);
    this.groups[part] = [];
    for (const [col, name] of CONFIG.outfitColors[part]) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'sw'; b.style.background = col;
      b.setAttribute('aria-label', label + ' ' + name);
      b.addEventListener('click', () => this.pick(part, col));
      box.appendChild(b);
      this.groups[part].push({ b, col });
    }
  },

  pick(part, col) {
    this.sel[part] = col;
    for (const g of this.groups[part]) g.b.setAttribute('aria-pressed', g.col === col ? 'true' : 'false');
    this.apply();
  },

  init() {
    this.el = document.getElementById('setup');
    this.input = document.getElementById('nameInput');
    this.preview = document.getElementById('preview');
    this.tag = document.getElementById('nameTag');
    this.input.maxLength = CONFIG.nameMaxLength;

    // 지난번에 고른 값이 있으면 미리 채워 둠(저장이 막힌 환경에서는 그냥 기본값)
    try {
      const saved = JSON.parse(localStorage.getItem('campfire-outfit') || 'null');
      if (saved) {
        if (typeof saved.name === 'string') this.input.value = saved.name.slice(0, CONFIG.nameMaxLength);
        for (const part of ['hat', 'coat', 'pants']) {
          if (CONFIG.outfitColors[part].some(c => c[0] === saved[part])) this.sel[part] = saved[part];
        }
      }
    } catch (e) { /* 저장소를 못 쓰면 무시 */ }

    this.buildSwatches('hat', 'swHat', '모자');
    this.buildSwatches('coat', 'swCoat', '옷');
    this.buildSwatches('pants', 'swPants', '바지');
    for (const part of ['hat', 'coat', 'pants']) this.pick(part, this.sel[part]);

    document.getElementById('btnStart').addEventListener('click', () => this.start());
    this.input.addEventListener('keydown', e => { if (e.key === 'Enter') this.start(); });
  },

  // 시작하기: 설정 창을 닫고 버튼과 이름표를 보여 줌
  start() {
    this.name = this.input.value.trim().slice(0, CONFIG.nameMaxLength);
    try { localStorage.setItem('campfire-outfit', JSON.stringify({ name: this.name, hat: this.sel.hat, coat: this.sel.coat, pants: this.sel.pants })); } catch (e) { /* 무시 */ }
    this.started = true;
    this.el.hidden = true;
    this.tag.textContent = this.name;
    Scene.bar.style.visibility = 'visible';
    Scene.tagKey = '';
    Scene.placeTag();
  },
};

/* =====================================================================
 * Scene — 전체 흐름: 화면 크기 계산, 업데이트, 그리기, 메인 루프
 * ===================================================================== */
const Scene = {
  view: null, vctx: null, buf: null, ctx: null, bar: null,
  time: 0, last: 0, running: false, raf: 0,
  k: 1, left: 0, top: 0, tagKey: '',

  init() {
    this.view = document.getElementById('view');
    this.vctx = this.view.getContext('2d');
    this.bar = document.getElementById('bar');
    this.buf = makeCanvas(W, H);                 // 작은 내부 캔버스
    this.ctx = this.buf.getContext('2d');

    // 움직임 줄이기 설정 따라가기
    if (window.matchMedia) {
      const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      Motion.reduced = mq.matches;
      const onChange = e => { Motion.reduced = e.matches; };
      if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
    }

    Sky.init(); Forest.init(); Campfire.init(); Items.init(); Character.init(); UI.init(); Setup.init();

    window.addEventListener('resize', () => this.layout());
    window.addEventListener('orientationchange', () => this.layout());
    this.layout();

    // 꽂힌 마시멜로, 다 익은 고구마 누르기
    this.view.addEventListener('pointerdown', e => {
      const hit = this.pick(e);
      if (!hit || Character.busy) return;
      if (hit.type === 'marsh') Character.eatMarsh(hit.index);
      else if (hit.type === 'potato') Character.eatPotato(hit.index);
      else Character.notYet();
      UI.refresh();
    });
    this.view.addEventListener('pointermove', e => {
      this.view.style.cursor = (!Character.busy && this.pick(e)) ? 'pointer' : 'default';
    });

    // 탭이 숨겨지면 멈추고, 돌아오면 다시 시작
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.stop(); else this.start(); });

    // 처음부터 불이 타고 있도록 미리 조금 돌려 둠
    for (let i = 0; i < 90; i++) { this.time += 1 / 30; Campfire.update(1 / 30, this.time); }
    this.start();
  },

  // 화면 좌표 → 내부 해상도 좌표로 바꿔 아이템 찾기
  pick(e) {
    const r = this.view.getBoundingClientRect();
    return Items.hitTest((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
  },

  // 창 크기에 맞춰 정수 배율과 위치를 다시 계산(장면이 잘리지 않게, 가운데 정렬)
  layout() {
    const dpr = window.devicePixelRatio || 1, vw = window.innerWidth, vh = window.innerHeight;
    const barH = this.bar.offsetHeight + 16;
    // 가로·세로에 다 들어가고, 버튼이 캐릭터와 모닥불(내부 y 160 위쪽)을 가리지 않는 가장 큰 정수 배율
    let s = Math.floor(Math.min(vw * dpr / W, vh * dpr / H, (vh - barH) * dpr / 160));
    s = Math.max(1, s);
    this.view.width = W * s; this.view.height = H * s;
    const cw = W * s / dpr, ch = H * s / dpr;
    const left = (vw - cw) / 2;
    const top = Math.max(0, Math.min((vh - ch) / 2, vh - barH - 160 * s / dpr));
    this.view.style.width = cw + 'px'; this.view.style.height = ch + 'px';
    this.view.style.left = left + 'px'; this.view.style.top = top + 'px';
    // 버튼 줄: 장면 바로 아래, 화면 밖으로는 나가지 않게
    this.bar.style.top = Math.min(vh - barH + 8, top + ch + 8) + 'px';
    this.vctx.imageSmoothingEnabled = false;
    this.k = s / dpr; this.left = left; this.top = top; this.tagKey = '';
    if (!this.running) this.draw();
  },

  // 이름표를 캐릭터 머리 위에 붙여 둠(위치가 바뀔 때만 DOM을 건드림)
  placeTag() {
    if (!Setup.started || !Setup.name) return;
    const x = Math.round(this.left + (Math.round(Character.x) + 7.5) * this.k);
    const y = Math.round(this.top + (CHAR_Y - 5) * this.k);
    const key = x + ',' + y;
    if (key === this.tagKey) return;
    this.tagKey = key;
    Setup.tag.style.left = x + 'px'; Setup.tag.style.top = y + 'px';
  },

  start() {
    if (this.running) return;
    this.running = true;
    this.last = performance.now();
    AudioFx.resume();
    this.raf = requestAnimationFrame(now => this.frame(now));
  },
  stop() {
    this.running = false;
    cancelAnimationFrame(this.raf);
    AudioFx.pause();
  },

  frame(now) {
    if (!this.running) return;
    // delta time 기반: 주사율이 달라도 속도가 같음(너무 큰 간격은 잘라 냄)
    const dt = Math.min(0.1, Math.max(0, (now - this.last) / 1000));
    this.last = now;
    this.update(dt);
    this.draw();
    this.raf = requestAnimationFrame(n => this.frame(n));
  },

  update(dt) {
    this.time += dt;
    const t = this.time;
    Sky.update(dt);
    Campfire.update(dt, t);
    Items.update(dt);
    Character.update(dt, t);
    AudioFx.update(dt);
    UI.refresh();
  },

  // 뒤에서 앞 순서로 그리기
  draw() {
    const ctx = this.ctx, t = this.time;
    Sky.draw(ctx, t);                       // 1. 밤하늘
    Forest.drawFar(ctx);                    // 2. 먼 숲
    Forest.drawNear(ctx, Campfire.flick);   // 3. 가까운 숲과 땅(불빛 범위만 따뜻하게)
    Character.drawLog(ctx);                 // 5. 통나무 의자
    Campfire.drawBack(ctx, t);              // 4. 모닥불
    Campfire.drawFlames(ctx);
    Items.drawPotatoes(ctx, t);
    Campfire.drawFront(ctx);
    Items.drawSkewers(ctx);
    Character.draw(ctx, t);                 // 5. 캐릭터
    Items.drawFly(ctx, t);
    Campfire.drawParticles(ctx);            //    불티, 연기, 김
    Forest.drawFlies(ctx, t);               // 6. 반딧불이
    Campfire.drawGlow(ctx);                 //    따뜻한 빛 번짐

    // 작은 캔버스를 큰 캔버스로 정수 배율 확대
    this.vctx.imageSmoothingEnabled = false;
    this.vctx.drawImage(this.buf, 0, 0, this.view.width, this.view.height);
    this.placeTag();
  },
};

Scene.init();
</script>
